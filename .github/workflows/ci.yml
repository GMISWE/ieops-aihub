# Operating rule for this file: never PRE-DECLARE it.
# (aihub#438, from the aihub#411 decision table, row T1-11)
#
# .github/workflows/ci.yml and internal/citest/dbtestcov/gated_tests.txt are the
# repo's two shared ratchets, and both get edited by work items that are not
# otherwise about them: every new AIHUB_TEST_DB-gated test needs a line there,
# and — unless it needs more than a database — a step here that names it. Do NOT
# put either path in a work item's declared_resources, and do not
# pf_acquire_locks it up front: a lock taken at claim is held until the ATTEMPT
# ends unless someone deliberately narrows declared_resources to drop it, so by
# default it blocks every other work item that has to touch the same ratchet.
#
# Let the commit-time lock gate take it instead. pf_commit and pf_ship send the
# pending commit's paths; every path this attempt does not already hold gets a
# file_scope lock acquired right there, and a path a different LIVE attempt
# holds is refused with CONFLICT_LOCK_TAKEN naming the holder, with nothing
# committed and the files left staged. See internal/domain/commit_locks.go
# (FnReconcileCommitLocks). Not declaring therefore gives up no safety; it only
# shortens the window.
#
# The corollaries of the gate sitting at COMMIT time — commit through
# pf_commit/pf_ship, because a bare `git commit` never reaches the gate, and a
# merge commit reports `lock_gate: not_run` — and the case that made this worth
# writing down are in the header of internal/citest/dbtestcov/gated_tests.txt.

name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: aihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 -race ./...
        # Note: integration tests require docker-compose; run locally: cd tests/integration && make test
        # AIHUB_TEST_DB is deliberately NOT set here — see the "aihub#242
        # dependency-requeue DB tests" step below for why.

      # aihub#303: the step above leaves every AIHUB_TEST_DB-gated test SKIPped,
      # by design. The real DB coverage is therefore exactly the union of the
      # `-run` regexes on the steps below that DO set the variable — and a test
      # whose name falls outside that union runs NOWHERE, forever, while `go
      # test` prints "ok" and exits 0.
      #
      # That is not hypothetical. Each number below is over a stated set, and
      # each one is derived from the line before it — an earlier draft of this
      # comment added the EMBEDDING pair to a total that already excluded it and
      # still landed on the right answer by coincidence, which is exactly the
      # kind of arithmetic that rots without anything going red:
      #
      #   85  AIHUB_TEST_DB-gated test functions in the repo (the whole set:
      #       every function that SKIPped naming the variable)
      #   -2  also need EMBEDDING_BASE_URL, which CI has no service for, so
      #       dbtestcov excludes them and requires that no step name them
      #   =83  require only a database — the set every step below is judged over
      #   -55  were already named by some step's `-run` before this branch
      #   =28  ran NOWHERE, on every CI run since the day they were written
      #
      # Those 28 split into the two steps that now execute them: 26 (23 in
      # internal/domain, 3 in internal/server) in "aihub#303 previously
      # CI-invisible DB tests" at the bottom of this job, plus the 2 in
      # internal/mcp in "aihub#281 wi-content echo E2E DB tests". Re-measure by
      # deleting those two steps and re-running this gate; do not read 28 as a
      # property of the code.
      #
      # The 3 in internal/server sit in routes_step_test.go — the file that
      # defines the seed helpers the COVERED tests reuse: proof that a name
      # regex stops at the edge of its alternation even inside a file it is
      # already selecting from.
      #
      # Not a one-off count, either: this gate went red on its own pull request
      # the moment aihub#281 landed the internal/mcp pair on main with no `-run`
      # naming them — found by the gate, not by anyone remembering.
      #
      # This step recomputes the COVERAGE difference on every run instead of
      # trusting a checked-in list of which tests are covered, because such a
      # list would rot exactly as silently as the gap it describes.
      #
      # aihub#320 added a checked-in list of a different thing — the DB-gated
      # test functions themselves, in internal/citest/dbtestcov/gated_tests.txt
      # — and the distinction is the whole reason it is safe. That file is never
      # read to DECIDE anything; it is compared against the measurement on every
      # run and any divergence fails. A list that is re-verified each run cannot
      # rot: the moment it disagrees with the tree, the gate is red. What it
      # buys is that dropping an entry is a diff hunk somebody has to write.
      #
      # What counts as DB-gated is measured, not inferred: the inventory is a
      # `go test ./...` run with AIHUB_TEST_DB explicitly unset, and a test is
      # DB-gated iff it SKIPped and its own skip message names that variable. So
      # there is no list of guard helpers to keep in sync. The message IS a
      # convention, and wording it wrongly is the cheapest way to make this gate
      # go quiet — cheaper than fixing the coverage — so dbtestcov also audits
      # the SOURCE for every way that guard can be written to leave the count
      # unmoved: an env read in a bool-returning helper, os.LookupEnv, a
      # constant or concatenated variable name, a bare `return` instead of a
      # skip, a TestMain gate, a build tag, a guard living in a non-test file,
      # and the read sitting in a package-level var or a func literal bound to
      # one. It audits ci.yml the same way, because a `go test` line that is
      # quoted, commented, inside a heredoc, inside an `if`, or trailed by
      # `|| true` is credited as coverage by anything that reads lines instead
      # of modelling the shell. See internal/citest/dbtestcov/main.go. Note
      # what all of those have in common: none of them changes the gated count,
      # so the ratchet below cannot substitute for any of them.
      #
      # aihub#508 added the one axis all of the above still missed: SUBTEST
      # names. Everything described so far compares FUNCTION names, while the
      # assertion a step actually makes is `--- PASS: TestX/a_named_subtest` —
      # so on 2026-09-09 a renamed subtest left this gate, the manifest and a
      # local `go test ./...` all green while the step itself went red on the
      # runner. dbtestcov now enumerates the test-name tree from the AST
      # (including table-driven arms and `"prefix_"+tc.name` concatenations)
      # and requires every `--- PASS:` assertion in this file to name a path
      # that exists AND that its own step's `-run` selects. Two consequences
      # worth knowing before editing a want-list below: a line asserting on the
      # marker in any spelling dbtestcov cannot read is a failure rather than a
      # skip, and an invocation with no `--- PASS:` assertion at all is a
      # failure too — otherwise deleting the want-list entry would be the
      # cheapest way to answer a stale-name report. See
      # internal/citest/dbtestcov/asserted.go, which also names the residual
      # holes (it does not execute the step, and a subtest whose name is
      # computed at run time is reported as unverifiable rather than proven).
      #
      # aihub#535 gave the shell suites the same treatment: the steps at the
      # bottom of this job assert `PASS: <check>` want-lists and PASS-count
      # floors over plugins/polyforge/tests/*.test.sh output — a marker the
      # `--- PASS:` audit cannot see — and shellsuite.go (same package) checks
      # every want and floor against the suite file it greps the output of.
      #
      # `env -u` rather than merely omitting an env: block, so that adding a
      # job-level AIHUB_TEST_DB later cannot silently turn this into a green
      # no-op (with the variable set, nothing SKIPs, the inventory is empty and
      # every check below passes vacuously). The second guard on the same
      # failure is the ratchet: internal/citest/dbtestcov/gated_tests.txt lists
      # every DB-gated test function by name, and the gate demands the
      # measurement equal it exactly. Add a DB test, add its line (the gate
      # prints the line to paste); remove one deliberately, delete its line in
      # the same change.
      #
      # ┌─ aihub#320 ────────────────────────────────────────────────────────┐
      # │ That ratchet used to be `-min-gated N` — one integer, on the line  │
      # │ below, hand-edited by every branch that added a DB test. The delta │
      # │ log that follows is what it cost, and it is kept verbatim as the   │
      # │ record. Three failures, all measured on this repository:           │
      # │                                                                    │
      # │  1. Two branches off one base both edit that line, so the merge    │
      # │     conflicts. A conflicting PR has no refs/pull/N/merge, and      │
      # │     `pull_request` workflows check that ref out — so the symptom   │
      # │     is not a red build, it is NO BUILD (aihub#325 vs #334,         │
