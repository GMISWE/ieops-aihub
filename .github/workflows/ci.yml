      # hermetic (no docker, no network: it stubs gh/curl/binary and drives
      # check_for_update directly), so it is safe to gate on.
      #
      # Deliberately narrow: launcher-bash32, pf-commit-guard, pf-repo-sync,
      # pf-seam-check and pf-skill-router under plugins/polyforge/tests/ are
      # still unwired and are not enabled by this step. launcher-bash32 in
      # particular needs docker and would newly gate PRs, so turning them all on
      # at once belongs in its own change rather than riding along with a bugfix.
      # NOTE (aihub#254): this gap has a cost, now demonstrated — pf-repo-sync
      # regressed session-start latency and shipped with no baseline because no
      # gate covered it. pf-repo-sync.test.sh carries the static assertion that
      # the hook stays `async: true`, and while unwired that guard is advisory:
      # it only runs when someone invokes it by hand.
      # UPDATE (aihub#293): the two using-polyforge suites are no longer in that
      # list — they are wired below. The rest of the sentence still stands.
      # UPDATE (aihub#304): pf-skill-router.test.sh is still unwired, but the
      # router is no longer ungated — internal/cli/skill_router_payload_test.go
      # drives the real hook per routed skill in both engine branches and runs
