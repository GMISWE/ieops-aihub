name: Contract Lint

# Lints the in-tree polyforge plugin (plugins/polyforge/**) against the MCP tool
# contract. Unlike the marketplace/polyforge-coding copies — which curl the schema
# from the pf-schemas orphan branch and therefore lag one merge behind in-flight
# PRs — this job builds the polyforge binary from THIS PR's source and dumps the
# schema fresh, so the plugin is always checked against the server code it ships
# with (aihub#211).

on:
  pull_request:
    paths:
      - 'plugins/polyforge/**'
      # EVERY first-party package cmd/polyforge links — i.e. every package whose
      # source ships inside the plugin binary. Derived, not guessed: the "paths:
      # filter covers every package the plugin links" step below recomputes the set
      # with `go list -deps` on each run and goes red if this list stops covering
      # it. The list is not trustworthy on its own: internal/cli was missing for
      # real, and PR#283 changed `polyforge doctor` behaviour in
      # internal/cli/doctor.go while this job never ran (aihub#326).
      #
      # aihub#347 widened the rule from "packages ONLY cmd/polyforge links" to
      # "packages cmd/polyforge links", for two measured reasons.
      #
      # 1. The excluded half was not signal-free. This block used to omit the
      #    packages cmd/polyforge shares with cmd/aihub (auth, domain, embedding,
      #    render, version) on the stated grounds that triggering on them "would run
      #    this job on most server PRs for no added signal". Measured false:
      #    internal/mcp builds four tool-param enums straight out of internal/domain
      #    (PfRememberTypeEnum, MethodologyTypeEnum, DeclaredResourceTypeList,
      #    ResourceLockTypeList) and dump-mcp-schemas emits `enum` into the contract.
      #    Renaming one MemoryTypeEnum entry in internal/domain/memory.go — a
      #    one-file diff matching none of the old globs — makes pf_contract_lint.py
      #    exit 1 with two ENUM_VIOLATION errors against pf-spec and pf-revise.
      #    PR#278 and PR#282 each edited internal/domain and each carried 6 checks
      #    where a triggering PR carries 7: Contract Lint was absent, and both were
      #    green. Green because the check did not exist on that PR, not because it
      #    passed.
      #
      # 2. Subtracting the other cmds made the requirement depend on state nothing
      #    here watches. Under plugin_only = links(cmd/polyforge) - links(other
      #    cmds), cmd/aihub or internal/server DROPPING an import moves a package
      #    into the set from a diff that touches nothing in this block, so the job
      #    does not run and the step that checks the set does not run either.
      #    Measured: deleting the internal/version import from cmd/aihub/main.go and
      #    internal/server/router.go makes internal/version plugin-only and the
      #    coverage step FAIL — from a two-file diff matching no glob here. Dropping
      #    the subtraction removes the dependency. links(cmd/polyforge) can only GROW
      #    when a package already in it (or cmd/polyforge itself) adds an import, and
      #    every one of those is in this list, so the PR that opens the hole is the
      #    PR that runs the check. Do not reintroduce the subtraction.
      #
      # pkg/client was a third escapee, surfaced by the same rewrite: cmd/polyforge
      # links it and no other cmd does, so it was plugin-only under the OLD rule as
      # well — but the old check filtered candidates to the internal/ prefix and
      # could therefore never report it. The check no longer filters by prefix.
      #
      # Cost, measured over the last 165 first-parent commits on main: 80 (48%)
      # matched the old filter, 122 (74%) match this one — +42 runs, 1.52x. A run is
      # ~30s wall and bills 0 ms. The extra runs are extra coverage, not extra red:
      # check_bump skips any plugin whose source dir has no changed file, so the
      # NO_VERSION_BUMP gate does not fire on server-only PRs.
      - 'internal/auth/**'
      - 'internal/cli/**'
      - 'internal/coding/**'
      - 'internal/config/**'
      - 'internal/domain/**'
      - 'internal/embedding/**'
      - 'internal/mcp/**'
      - 'internal/render/**'
      - 'internal/version/**'
      - 'pkg/client/**'
      - 'cmd/polyforge/**'
      - 'scripts/pf_contract_lint.py'
      - 'scripts/pf_contract_lint_baseline.json'
      - '.github/workflows/contract-lint.yml'
      # Version-stamp consistency (aihub#232). Both catalogs live outside
      # plugins/**, so a catalog-only version edit would otherwise not run this
      # job at all — which is exactly the drift the check exists to catch. The
      # repo-root marketplace.json is the Copilot CLI catalog and carries its own
      # version stamp; it was one of the files left at 1.1.6 by the original
      # incident, so it needs the trigger just as much as the Claude one.
      - '.claude-plugin/marketplace.json'
      - 'marketplace.json'
      - 'scripts/pf_version_check.py'
      # Docs contract (aihub#352). docs/mcp-tools.md carries a tool total and a
      # per-section count whose authority is `polyforge dump-mcp-schemas`, which
      # this job already builds and dumps below. Both trigger directions are
      # needed and neither is redundant:
      #   - a tool added/removed/renamed under internal/mcp/** already runs this
      #     job via the globs above, and now also fails if the doc was not
      #     updated with it;
      #   - a docs-only edit that breaks the inventory, or reintroduces a
      #     line-number citation, matches NO glob above and would otherwise
      #     never be checked. An absent check reports green.
      - 'docs/mcp-tools.md'
      - 'docs/superpowers/**'
      - 'scripts/pf_docs_contract_check.py'

jobs:
  contract-lint:
    name: Contract Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump gate below diffs this PR against its base commit. The default
          # depth-1 checkout does not contain that commit, and the gate would then
          # report a diff failure rather than silently passing (aihub#302).
          fetch-depth: 0

      # Cheap and Go-independent, so it runs first: a version bump that updates
      # only some of the four stamps fails here in seconds rather than after the
      # build (aihub#232).
      - name: Plugin version-stamp consistency
        run: |
          set -euo pipefail
          python3 scripts/pf_version_check.py --self-test | tee /tmp/pf_selftest.log
          # --self-test runs TWO suites, and its exit code cannot report the one failure
          # that matters most here: a suite that never ran. Replacing the bump suite's
          # result with a literal 0 leaves the script green while skipping it entirely —
          # no assertion inside the script can see that, because the mutation removes the
          # call. So assert on the OUTPUT: each suite must announce itself by name.
          # (Anchored at line start: "self-test passed" is a substring of the bump line.)
          for want in '^self-test passed' '^bump self-test passed'; do
            grep -qE -- "$want" /tmp/pf_selftest.log \
              || { echo "::error::pf_version_check --self-test never reported \"$want\" — a suite did not run"; exit 1; }
          done
          python3 scripts/pf_version_check.py --root .

      # aihub#302. The step above is a STATE predicate — do the five stamps agree
      # with each other? — and it cannot answer "did this PR touch the plugin?".
      # PR#264 was pushed without a bump and a human caught it in review; PR#265 then
      # shipped four files under plugins/polyforge/skills/ under a version that was
      # already released, and nothing caught that one. Caught once by luck, shipped
      # once undetected. CI was green throughout, correctly — all five stamps agreed.
      # The install cache is keyed on version, so those edits reach nobody already on
      # that version and /plugin update is a no-op for them.
      #
      # Kept as its own step so the two failures are never confused: this one is
      # [NO_VERSION_BUMP], the one above is [VERSION_DRIFT] and friends. `!cancelled()`
      # so a PR carrying BOTH defects sees both in one run rather than needing two
      # round-trips — which is the whole point of separating them.
      #
      # base.sha is the PR's base commit as GitHub recorded it. Deliberately NOT a
      # local origin/main ref, which can be stale in the runner's checkout.
      #
      # ⚠️ This value is EMPTY on any event other than pull_request. The check refuses an
      # empty base loudly rather than passing, so adding `push:` / `merge_group:` above
      # turns this step red, not silent — but if you do add such a trigger, give this
      # step a base appropriate to that event instead of leaving it failing.
      - name: Plugin contents changed => version must be bumped
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/pf_version_check.py \
            --root . \
            --require-bump-since "${{ github.event.pull_request.base.sha }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      # aihub#326. The paths: filter above decides whether this whole job runs, and
      # nothing used to check it against reality — which is why internal/cli fell out
      # of it and PR#283 shipped a `polyforge doctor` behaviour change without ever
      # running this job. A filter that is present but wrong is the same as absent.
      #
      # This step derives the answer instead of restating it: the ground truth for
      # "this source ships in the plugin" is the link graph, so it asks `go list -deps`
      # for every first-party package cmd/polyforge links and requires paths: to cover
      # each one. Deliberately NOT a second hand-maintained list — there is no
      # allowlist to edit, and the only way to make a red here green is to add the
      # missing glob above, which IS the fix.
      #
      # aihub#347 changed the requirement in two ways, both of which are load-bearing
      # and neither of which may be reverted without reopening a measured hole.
      #
      # No subtraction. It used to require only the packages NO OTHER cmd links
      # (links(cmd/polyforge) - links(other cmds)). That made the requirement a
      # function of cmd/aihub's imports, which paths: does not watch, so cmd/aihub
      # dropping an import could enlarge the required set from a diff that never ran
      # this job — the check could not see the hole it was written to see. Verified by
      # deleting the internal/version import from cmd/aihub/main.go and
      # internal/server/router.go: internal/version became plugin-only, this step's
      # own logic returned FAIL, and the two changed files matched none of the globs.
      # With the subtraction gone, the required set depends only on imports inside
      # cmd/polyforge and the packages it already links — all of which are in paths:.
      # So the closure argument now runs in BOTH directions: take the first newly
      # added import edge on any path from cmd/polyforge to a newly required package;
      # its source package was already reachable, hence already in paths:, hence the
      # PR that adds it is a PR that runs this check.
      #
      # No prefix filter. It used to consider only packages under internal/, which is
      # why pkg/client — linked by cmd/polyforge and by nothing else, so in the
      # required set even under the old rule — was invisible to it. Anything with the
      # module path as its prefix now counts, so a future pkg/ or a package moved out
      # of internal/ cannot slip out of the check by changing directory.
      #
      # `go list -deps` resolves imports without compiling: ~0.5s measured, against a
      # job that already builds the binary. `!cancelled()` for the same reason as the
      # bump gate — a PR carrying both defects should see both in one run.
      - name: "paths: filter covers every package the plugin links"
        if: ${{ !cancelled() }}
        env:
          # No go.work exists in CI; set explicitly so a local run reproduces CI.
          GOWORK: "off"
        run: |
          set -euo pipefail
          python3 - .github/workflows/contract-lint.yml <<'PY'
          import re, subprocess, sys

          WF = sys.argv[1] if len(sys.argv) > 1 else ".github/workflows/contract-lint.yml"

          def go(*args):
              return subprocess.run(["go", *args], stdout=subprocess.PIPE,
                                    check=True, text=True).stdout.split()

          def glob_re(g):
              """GitHub path-filter glob -> regex. '**' crosses '/', '*' and '?' do not."""
              out, i = [], 0
              while i < len(g):
                  if g[i] == "*":
                      if g[i + 1:i + 2] == "*":
                          out.append(".*"); i += 2
                      else:
                          out.append("[^/]*"); i += 1
                  elif g[i] == "?":
                      out.append("[^/]"); i += 1
                  else:
                      out.append(re.escape(g[i])); i += 1
              return re.compile("^" + "".join(out) + "$")

          # The matcher IS the check. Degrade it to "matches everything" and this step
          # passes vacuously with nothing downstream able to see it, so pin it here.
          for g, p, want in [("internal/cli/**", "internal/cli/doctor.go", True),
                             ("internal/cli/**", "internal/domain/x.go", False),
                             ("internal/*", "internal/cli/doctor.go", False),
                             ("plugins/polyforge/**", "plugins/polyforge/a/b.md", True),
                             # aihub#347: the requirement is no longer internal/-only,
                             # so the probe paths it is fed no longer share a prefix.
                             # A pkg/ or cmd/ package must match its own glob and must
                             # NOT be swallowed by an internal/ one.
                             ("pkg/client/**", "pkg/client/x.go", True),
                             ("internal/**", "pkg/client/x.go", False),
                             ("cmd/polyforge/**", "cmd/polyforge/x.go", True),
                             ("cmd/polyforge/**", "cmd/aihub/x.go", False),
                             # Prefix-vs-boundary: 'internal/domain/**' must not match a
                             # sibling package whose name merely starts with 'domain'.
                             ("internal/domain/**", "internal/domainx/x.go", False)]:
              if bool(glob_re(g).match(p)) is not want:
                  sys.exit("::error::glob matcher is broken on %r vs %r" % (g, p))

          globs, in_block = [], False
          for line in open(WF, encoding="utf-8").read().splitlines():
              if not in_block:
                  in_block = re.match(r"^\s*paths:\s*$", line) is not None
                  continue
              s = line.strip()
              if not s or s.startswith("#"):
                  continue
              m = re.match(r"""^-\s*'([^']*)'$|^-\s*"([^"]*)"$|^-\s*(\S+)$""", s)
              if not m:
                  break
              globs.append(next(x for x in m.groups() if x is not None))

          if not in_block:
              print("no paths: filter -> job runs on every PR; coverage trivially met")
              sys.exit(0)
          if not globs:
              sys.exit("::error::%s has a paths: key with no globs under it" % WF)
          if any(g.startswith("!") for g in globs):
              sys.exit("::error::%s uses a negated path filter. This check does not "
                       "implement negation and must not pretend to: teach it, do not "
                       "delete it." % WF)

          mod = go("list", "-m")[0]
          cmds = go("list", "./cmd/...")
          target = mod + "/cmd/polyforge"
          if target not in cmds:
              sys.exit("::error::%s is not a main package; nothing could be derived, "
                       "and this check must not pass vacuously" % target)
          prefix = mod + "/"

          # Every first-party package the plugin binary links, as a repo-relative dir.
          # No prefix filter beyond the module path (pkg/client escaped an internal/-only
          # rule) and no subtraction of the other cmds (that made the requirement depend
          # on cmd/aihub, which paths: does not watch) — see the step comment above.
          # `target` is itself in `go list -deps` output, so cmd/polyforge needs no
          # special case.
          linked = sorted(p[len(prefix):] for p in go("list", "-deps", target)
                          if p.startswith(prefix))

          # A go.work, a broken import graph or a renamed target could each reduce this
          # to nothing, and an empty requirement is satisfied by any filter at all. The
          # binary cannot link zero first-party packages, so treat it as instrument
          # failure rather than a pass.
          if "cmd/polyforge" not in linked:
              sys.exit("::error::derived link set does not contain cmd/polyforge itself "
                       "(got %r) — the derivation is broken and this check must not pass "
                       "vacuously" % linked)

          res = [glob_re(g) for g in globs]
          missing = [p for p in linked
                     if not any(r.match("%s/x.go" % p) for r in res)]

          print("paths: globs        %s" % " ".join(globs))
          print("plugin links        %s" % " ".join(linked))
          if missing:
              sys.exit("::error::the paths: filter does not cover %s. Those package(s) "
                       "are linked into the polyforge binary, so editing them changes "
                       "what the plugin ships while this job never runs (aihub#326, "
                       "aihub#347). Add to paths: in %s:\n%s"
                       % (", ".join(missing), WF,
                          "\n".join("      - '%s/**'" % p for p in missing)))
          print("OK: paths: covers every package the plugin links")
          PY

      - name: Build polyforge and dump MCP schemas (fresh, in-repo)
        run: |
          go build -o /tmp/polyforge ./cmd/polyforge
          /tmp/polyforge dump-mcp-schemas "$(git rev-parse HEAD)" > /tmp/pf-tool-schemas.json
          python3 -c "import json; json.load(open('/tmp/pf-tool-schemas.json')); print('schema JSON valid')"

      - name: Linter self-test
        run: python3 scripts/pf_contract_lint.py --self-test

      # aihub#352. Uses the SAME fresh in-repo dump as the plugin lint above, so
      # the doc is checked against this PR's tool registry rather than against a
      # published schema that lags a merge behind.
      - name: Docs-contract self-test
        run: python3 scripts/pf_docs_contract_check.py --self-test

      - name: Docs contract (mcp-tools inventory, line-number citations)
        run: |
          python3 scripts/pf_docs_contract_check.py \
            --schemas /tmp/pf-tool-schemas.json

      - name: Contract-lint the polyforge plugin
        run: |
          python3 scripts/pf_contract_lint.py \
            --schemas /tmp/pf-tool-schemas.json \
            --target plugins/ \
            --baseline scripts/pf_contract_lint_baseline.json
