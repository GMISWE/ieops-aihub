                      TestDeLockingPredictReportsAdvisoryEntries/rule_6_reports_exactly_one_info_per_service_and_does_not_raise_severity \
                      TestDeLockingPredictReportsAdvisoryEntries/rule_6_still_fires_under_dry_run \
                      TestDeLockingPredictReportsAdvisoryEntries/last_active_age_seconds_tracks_the_attempts_last_active_at \
