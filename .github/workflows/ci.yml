        run: |
          set -o pipefail
          inventory=$(mktemp)
          if ! env -u AIHUB_TEST_DB go test ./... -count=1 -json > "$inventory"; then
            echo "::error::the DB-free inventory run failed, so DB-test coverage cannot be audited; fix the failing tests first (the 'Unit tests' step above runs the same set)"
            # `|| true`: a build failure produces no "fail" action at all, and a
            # no-match grep under `set -e -o pipefail` would abort here and
            # swallow the explicit exit below.
            grep -F -e '"Action":"fail"' -e '"Action":"build-fail"' "$inventory" | head -20 || true
            # aihub#593: the fail lines above carry the test's NAME and elapsed
            # but not its FAILURE MESSAGE — the output actions stay in $inventory,
            # which this branch used to discard. On 2026-09-10 that made the one
            # observed flake here (TestDiffVsBaseComparesTheBaseBranchAndThe
            # DefaultComparesHead, 0.07s, rerun green) unattributable: nothing
            # recorded WHICH line failed. Print the failing tests' own output so
            # the next one carries its message. One jq program rather than a
            # shell loop, because dbtestcov's asserted-names audit fail-closes on
            # a `for … in $(…)` whose word list it cannot read
            # (TestCheckAssertedNames_RealCIWorkflow), and it audits this file.
            # Bounded (first 5 failing tests, last 500 lines) and `|| true` for
            # the same reason as the grep above. The rerun criterion for that
            # known flake lives on the test's doc comment in
            # internal/mcp/diff_result_shape_test.go — read it before reaching
            # for `gh run rerun --failed`.
            jq -rs '
              ([ .[] | select(.Action=="fail" and .Test != null)
                 | .Package + "." + .Test ] | unique | .[0:5]) as $bad
              | .[]
              | select(.Action=="output" and .Test != null)
              | (.Package + "." + .Test) as $k
              | select($bad | index($k))
              | .Output' "$inventory" | tail -500 || true
            exit 1
          fi
          go run ./internal/citest/dbtestcov \
            -inventory "$inventory" \
            -workflow .github/workflows/ci.yml \
            -gated-set internal/citest/dbtestcov/gated_tests.txt

      # aihub#242: exercise the DeleteDependency requeue regression (Change A)
      # against the real Postgres service already started for this job, which
      # the "Unit tests" step above leaves unused (AIHUB_TEST_DB unset there).
      #
      # Deliberately scoped to `-run 'TestDeleteDependency'` rather than
      # setting AIHUB_TEST_DB on the "Unit tests" step: this domain package has
      # several other AIHUB_TEST_DB-gated suites (memory ranking, cross-project
      # resume, conflict prediction, ...) that would also switch on if the var
      # were set package-wide, and this change did not verify those pass —
      # widening the gate here could newly fail CI for unrelated reasons. This
      # step applies migrations itself (setupLatestTestDB in
      # memory_latest_test.go assumes an already-migrated DB, it does not
      # migrate) via goose, matching tests/integration/Makefile's `seed` target.
      - name: Apply migrations (aihub#242 DB tests)
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        # `go run` (rather than `go install` + bare `goose`) sidesteps relying
        # on $(go env GOPATH)/bin being on PATH in this job.
        run: go run github.com/pressly/goose/v3/cmd/goose@latest -dir internal/db/migrations postgres "$AIHUB_TEST_DB" up

      # Runs with -v and then asserts both cases actually reported PASS, rather
      # than trusting the exit code. `go test` prints "ok" and exits 0 when
      # every selected test SKIPs, and setupLatestTestDB skips whenever
      # AIHUB_TEST_DB is empty — so without this guard, anything that stops the
      # env var from reaching this step (a rename, a moved job, an edited env
      # block) would silently restore the zero-coverage state these steps exist
      # to fix, while CI stayed green. The guard converts that silent
      # regression into a hard failure.
      - name: aihub#242 dependency-requeue DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestDeleteDependency' -count=1 -v 2>&1 | tee dep_requeue.log
          for want in TestDeleteDependency_LastBlockerRemoved_Requeues \
                      TestDeleteDependency_OtherBlockerRemains_StaysBlocked; do
            grep -q -- "--- PASS: $want" dep_requeue.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated requeue coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' dep_requeue.log \
            || { echo "::error::a TestDeleteDependency case SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#241: exercise the declared_resources compare-and-set (CAS) fix
      # against the same Postgres service, already migrated by the "Apply
      # migrations (aihub#242 DB tests)" step above — reused here rather than
      # running goose a second time.
      #
      # Deliberately scoped to `-run 'TestUpdateWorkItemCAS'` rather than
      # setting AIHUB_TEST_DB on the "Unit tests" step: this domain package has
      # several other AIHUB_TEST_DB-gated suites (memory ranking, cross-project
      # resume, conflict prediction, the aihub#242 requeue tests, ...) that
      # would also switch on if the var were set package-wide, and this change
      # did not verify those pass — widening the gate here could newly fail CI
      # for unrelated reasons.
      #
      # Runs with -v and then asserts all three cases actually reported PASS,
      # rather than trusting the exit code. `go test` prints "ok" and exits 0
      # when every selected test SKIPs, and setupLatestTestDB skips whenever
      # AIHUB_TEST_DB is empty — so without this guard, anything that stops the
      # env var from reaching this step (a rename, a moved job, an edited env
      # block) would silently restore the zero-coverage state these tests
      # exist to fix, while CI stayed green. The guard converts that silent
      # regression into a hard failure.
      - name: aihub#241 declared_resources CAS DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestUpdateWorkItemCAS' -count=1 -v 2>&1 | tee wi_cas.log
          for want in TestUpdateWorkItemCASVersionAdvancesAcrossWrites \
                      TestUpdateWorkItemCASStaleVersionReturns409NotBadRequest \
                      TestUpdateWorkItemCASCorrectVersionSucceedsAndAdvances; do
            grep -q -- "--- PASS: $want" wi_cas.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated CAS coverage is not actually executing"; exit 1; }
          done
          # aihub#543's review round — PARENT-CITED SUBTESTS, pinned by name for the
          # reason the "aihub#371 remember project/work_item_id consistency DB tests"
          # step states of its own six: a contract card cites the
          # PARENT function, so deleting the subtest leaves the citation resolving, K12
          # green, and this step's function-level greps unmoved. Each name below was
          # read off a real `--- PASS:` line rather than derived from the t.Run string.
          for want in "TestUpdateWorkItemCASVersionAdvancesAcrossWrites/a_writer_that_omits_the_version_discards_the_previous_list_and_still_gets_a_200"; do
            grep -q -- "--- PASS: $want" wi_cas.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the pf_update_work_item card cites this function for what an omitted resources_version does to the stored list, and a deleted subtest leaves the citation resolving to a function that no longer holds the claim"; exit 1; }
          done
          ! grep -q -- '--- SKIP' wi_cas.log \
            || { echo "::error::a TestUpdateWorkItemCAS case SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#260: exercise the projects.members compare-and-set — the same
      # pattern as the aihub#241 step above, applied to the other whole-list
      # REPLACE column, against the same already-migrated Postgres service.
      #
      # Three packages rather than one, because the defect this guards is not
      # "the domain function is wrong" but "the precondition never reaches the
      # domain function". members_version has to survive the MCP tool schema,
      # the MCP handler's body construction, pkg/client, and echo's binder; a
      # parameter that exists in the schema and is dropped one hop later is
      # indistinguishable at the call site from a guard that passed. So each hop
      # gets its own step-visible assertion here, not just the innermost one.
      # (pkg/client's two cases need no database and run in "Unit tests".)
      #
      # Scoped with -run rather than by setting AIHUB_TEST_DB on the "Unit
      # tests" step, for the same reason as every step above: these packages
      # hold other AIHUB_TEST_DB-gated suites that would switch on with it and
      # that this change did not verify.
      #
      # Named one by one rather than counted, matching the aihub#241 step: a
      # count stays green when a test is renamed away and a different one takes
      # its place, which is exactly how coverage evaporates quietly. The
      # `--- SKIP` guard is the second half — `go test` prints ok and exits 0
      # when every selected test skips, and all of these skip whenever
      # AIHUB_TEST_DB is empty.
      #
      # ONE SKIP guard PER invocation, each naming exactly one log. A single
      # combined `! grep -q -- '--- SKIP' a.log b.log c.log` reads as equivalent
      # and is not: dbtestcov models each `go test` invocation separately and
      # rejects it, because one grep over three files cannot say WHICH
      # invocation was asserted about. That is not a style rule I inferred — the
      # first draft of this step used the combined form and both the coverage
      # gate and its own unit test (TestParseWorkflow_RealCIWorkflow, which
      # parses this very file) went red on it.
      #
      # Requires migration 0032_projects_members_version.sql; without it every
      # project read fails, because projectSelectCols names the column.
      - name: aihub#260 project members CAS DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestUpdateProjectMembersCAS' -count=1 -v 2>&1 | tee members_domain.log
          go test ./internal/server/ -run 'TestProjectMembersVersionHTTP' -count=1 -v 2>&1 | tee members_server.log
          go test ./internal/mcp/ -run 'TestProjectMembersCAS' -count=1 -v 2>&1 | tee members_mcp.log
          for want in TestUpdateProjectMembersCASVersionAdvancesAcrossWrites \
                      TestUpdateProjectMembersCASUnrelatedWriteLeavesVersionAlone \
                      TestUpdateProjectMembersCASStaleVersionReturns409AndReportsCurrent \
                      TestUpdateProjectMembersCASCorrectVersionSucceedsAndAdvances \
                      TestUpdateProjectMembersCASOmittedVersionOverwritesUnconditionally \
                      TestUpdateProjectMembersCASConcurrentAddsBothSurvive \
                      TestUpdateProjectMembersCASUnguardedConcurrentWritesEachAdvanceTheCounter; do
            grep -q -- "--- PASS: $want" members_domain.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated members CAS coverage is not actually executing"; exit 1; }
          done
          for want in TestProjectMembersVersionHTTPStaleVersionIs409 \
                      TestProjectMembersVersionHTTPCurrentVersionSucceeds \
                      TestProjectMembersVersionHTTPIsReadableFromBothReadPaths \
                      TestProjectMembersVersionHTTPZeroIsSerialised \
                      TestProjectMembersVersionHTTPGuardWithNothingToWriteIs400; do
            grep -q -- "--- PASS: $want" members_server.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the HTTP hop of the members CAS is unguarded"; exit 1; }
          done
          for want in TestProjectMembersCASToolSchemaAdvertisesMembersVersion \
                      TestProjectMembersCASVersionIsReadableFromListProjects \
                      TestProjectMembersCASStaleVersionIsRefusedEndToEnd \
                      TestProjectMembersCASConcurrentAddsBothSurviveEndToEnd; do
            grep -q -- "--- PASS: $want" members_mcp.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the MCP hop of the members CAS is unguarded"; exit 1; }
          done
          ! grep -q -- '--- SKIP' members_domain.log \
            || { echo "::error::an aihub#260 internal/domain test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' members_server.log \
            || { echo "::error::an aihub#260 internal/server test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' members_mcp.log \
            || { echo "::error::an aihub#260 internal/mcp test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#333: `members` is a whole-list REPLACE, so a caller who sends a
      # short list removes everybody they left out — and aihub#260's
      # members_version cannot see it, because a truncating caller's version
      # matches perfectly. UpdateProject now refuses a members write that would
      # drop a user_id the request did not name in expected_removals.
      #
      # A separate step from aihub#260's rather than folded into it: these are
      # separate preconditions with separate failure codes (412
      # PROJECT_MEMBERS_UNDECLARED_REMOVAL vs 409 CONFLICT_CAS_FAILED), and one
      # step whose name says #260 going red for a #333 reason sends the next
      # reader to the wrong work item.
      #
      # BOTH HALVES of the property are named below, per invocation. Half one
      # alone (an undeclared shrink is refused) is satisfied by a server that
      # refuses every members write, which is an outage rather than a fix; half
      # two (a declared shrink still succeeds) is what rejects that. The pairing
      # is not incidental to the tests either — the DECLARED half is the only
      # one that can see the HTTP and MCP hops at all, because a request whose
      # expected_removals was dropped en route is refused, so half one stays
      # green whether or not the parameter arrives.
      #
      # Requires migration 0032_projects_members_version.sql (aihub#260's).
      # aihub#333 adds NO migration: expected_removals is a request-only
      # precondition, never stored, so there is no column and nothing to
      # sequence a deploy around.
      - name: aihub#333 project members removal-declaration DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestUpdateProjectMembersRemoval' -count=1 -v 2>&1 | tee removal_domain.log
          go test ./internal/server/ -run 'TestProjectMembersRemovalHTTP' -count=1 -v 2>&1 | tee removal_server.log
          go test ./internal/mcp/ -run 'TestProjectMembersRemoval' -count=1 -v 2>&1 | tee removal_mcp.log
          for want in TestUpdateProjectMembersRemovalUndeclaredShrinkIsRefusedAndWritesNothing \
                      TestUpdateProjectMembersRemovalDeclaredShrinkSucceedsAndAdvancesVersion \
                      TestUpdateProjectMembersRemovalCallerWhoDoesNotKnowTheListCannotWipeIt \
                      TestUpdateProjectMembersRemovalStaleVersionConflictTakesPrecedence \
                      TestUpdateProjectMembersRemovalUnguardedConcurrentAddsRefuseTheLoserInsteadOfLosingIt \
                      TestUpdateProjectMembersRemovalMalformedStoredListStaysRepairable \
                      TestUpdateProjectMembersRemovalBlankUserIDIsRejectedAndNeverSticks; do
            grep -q -- "--- PASS: $want" removal_domain.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated aihub#333 removal coverage is not actually executing"; exit 1; }
          done
          for want in TestProjectMembersRemovalHTTPUndeclaredShrinkIs412 \
                      TestProjectMembersRemovalHTTPDeclaredShrinkSucceeds; do
            grep -q -- "--- PASS: $want" removal_server.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the HTTP hop of expected_removals is unguarded, and a dropped declaration refuses the write rather than failing loudly"; exit 1; }
          done
          for want in TestProjectMembersRemovalToolSchemaAdvertisesExpectedRemovals \
                      TestProjectMembersRemovalToolForwardsExpectedRemovalsOnTheWire \
                      TestProjectMembersRemovalUndeclaredTruncationIsRefusedEndToEnd \
                      TestProjectMembersRemovalDeclaredRemovalSucceedsEndToEnd; do
            grep -q -- "--- PASS: $want" removal_mcp.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the MCP hop of expected_removals is unguarded"; exit 1; }
          done
          ! grep -q -- '--- SKIP' removal_domain.log \
            || { echo "::error::an aihub#333 internal/domain test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' removal_server.log \
            || { echo "::error::an aihub#333 internal/server test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' removal_mcp.log \
            || { echo "::error::an aihub#333 internal/mcp test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#334: Postgres class 40 (40001 serialization_failure / 40P01
      # deadlock_detected) must reach the caller as a retryable 409, never as a
      # 500 that sends them to read logs instead of retrying.
      #
      # This cannot be a unit test. 40001 is produced by the server's own
      # concurrency control at the instant a blocked writer is released by the
      # committing writer that changed the row underneath it; a hand-built
      # *pgconn.PgError would only prove the classifier compiles. Those
      # hand-built cases DO exist, in internal/domain/pgx_err_test.go, and they
      # run in "Unit tests" — they are the negative half (40002, 40003, 23505
      # must NOT be reclassified), not this.
      #
      # Asserted per subtest rather than on the parent, because the three
      # instances fail for DIFFERENT reasons and are fixed in different places:
      #
      #   - the UpdateProject arm loses at `SELECT ... FOR UPDATE`;
      #   - the claim arm loses at the same shape but is reachable TODAY
      #     (FnClaimWorkItem already opens SERIALIZABLE, nobody has to raise an
      #     isolation level first);
      #   - the unblock-sweep arm loses inside a lazily-streamed result set
      #     whose error nobody asked for, so by the time it reaches the caller
      #     it is pgx.ErrTxCommitRollback with NO SQLSTATE at all. A fix placed
      #     only at a central pgx-error -> AihubError conversion point leaves
      #     this one returning 500 with every other assertion green — measured;
      #   - the memory-supersede arm loses at a plain `UPDATE`, neither a row
      #     lock nor a commit, which is what stops the fix from being scoped to
      #     the two hop shapes the other arms happen to use.
      #
      # aihub#497 added two more, both on FnForceTakeover, which is the one lock
      # path that opens its transaction with pool.Begin — READ COMMITTED — and
      # then DISCARDED the class-40 error rather than wrapping it as a 500. The
      # caller was therefore told about whichever statement happened to run next
      # and failed with 25P02, which is class 25 and unclassifiable:
      #
      #   - the lock-upsert arm loses at `INSERT INTO resource_locks ... ON
      #     CONFLICT DO UPDATE`, and before the fix reported `500 failed to
      #     update work_item after force_takeover`;
      #   - the lock-release arm loses one hop earlier, at `DELETE FROM
      #     resource_locks`, and reported `500 failed to create new attempt
      #     after force_takeover` — a THIRD statement, two hops downstream of
      #     the race. Two arms because a fix shaped to the upsert alone passes
      #     the first and leaves the second returning 500; measured.
      #
      # Both run on serializableTestPool. internal/db/db.go builds the pool with
      # pgxpool.New and pins no isolation level, so `pool.Begin` inherits
      # default_transaction_isolation from the database, the role or the DSN —
      # which makes these reachable by CONFIGURATION of today's binary, the same
      # argument this step already accepted for the UpdateProject arm.
      #
      # aihub#545 added three more, the sites the aihub#492/#497 sweep missed
      # because it searched by spelling rather than by property — all three in
      # run_attempts.go, all three discarding the error instead of wrapping it:
      #
      #   - the heartbeat arm loses at verifyAttemptCredential's
      #     `UPDATE run_attempts SET last_active_at=...`, whose error was
      #     `//nolint:errcheck` discarded inside four SERIALIZABLE
      #     transactions, and before the fix reported `500 failed to update
      #     run_attempt status` — the 25P02 second victim;
      #   - the step-state-read arm loses at FnCompleteAttempt's own
      #     wi_step_state read, the sibling of the two reads aihub#492/#497
      #     already classified. A plain SELECT cannot lose a lock wait, so this
      #     arm dooms it deterministically via SSI's read-time
      #     dangerous-structure check (ssiDoomStepStateRead in the test file);
      #   - the force-terminate arm calls fnForceTerminateStep directly on a
      #     transaction doomed the same way: its opening current-step read
      #     swallowed the 40001 into "no step to terminate" (nil), which is
      #     what kept aihub#497's ErrConflictSerializationFailure guard arm at
      #     the FnForceTakeover call site structurally unreachable. No external
      #     interleaving can park a caller between the caller's step-state read
      #     and this one — they are adjacent statements — so the arm asserts
      #     the function-level contract both call sites consume.
      #
      # The last name in the list is the control, not another instance: at READ
      # COMMITTED the same interleaving must still SUCCEED. Without it, "turn
      # every contended write into a 409" would satisfy every assertion above
      # and break every existing caller.
      - name: aihub#334 serialization-failure mapping DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestSerializationFailureSurfacesAsRetryable409' -count=1 -v 2>&1 | tee serialization_failure.log
          for want in 'TestSerializationFailureSurfacesAsRetryable409/serializable_loser_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/concurrent_claim_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/unblock_sweep_row-lock_error_still_must_not_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/memory_supersede_loser_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/force_takeover_lock_upsert_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/force_takeover_lock_release_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/complete_attempt_heartbeat_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/complete_attempt_step-state_read_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/force_terminate_current-step_read_is_classified,_not_swallowed_as_no_step' \
                      'TestSerializationFailureSurfacesAsRetryable409/read_committed_loser_still_succeeds'; do
            grep -q -- "--- PASS: $want" serialization_failure.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); an aihub#334 instance is unguarded"; exit 1; }
          done
          ! grep -q -- '--- SKIP' serialization_failure.log \
            || { echo "::error::an aihub#334 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#288: exercise the work_items.attrs merge path (attrs_patch /
      # attrs_unset) against the same Postgres service, already migrated by the
      # "Apply migrations (aihub#242 DB tests)" step above.
      #
      # Scoped to `-run 'TestUpdateWorkItemAttrs'` for the same reason as the
      # aihub#241 step: setting AIHUB_TEST_DB on the "Unit tests" step would
      # switch on every other gated suite in this package, which this change did
      # not verify.
      #
      # The statement SHAPE has ordinary, always-executing coverage in
      # work_items_attrs_test.go. What only a real Postgres can show is the
      # thing this work item is actually about — that a patch does not destroy
      # the keys it did not mention, that eight concurrent patches all survive,
      # and that `attrs` alone still REPLACEs. Without this step those
      # assertions SKIP, and a suite that SKIPs still prints "ok" and exits 0,
      # so the PASS/SKIP guards below are what makes the step mean anything.
      - name: aihub#288 attrs merge DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestUpdateWorkItemAttrs' -count=1 -v 2>&1 | tee wi_attrs.log
          for want in TestUpdateWorkItemAttrsPatch_DoesNotDestroyOtherKeys \
                      TestUpdateWorkItemAttrs_ReplaceStillDestroysUnsentKeys \
                      TestUpdateWorkItemAttrsUnset_DeletesNamedKeys \
                      TestUpdateWorkItemAttrsPatch_ConcurrentDisjointKeysAllSurvive \
                      TestUpdateWorkItemAttrsPatch_WorksOnTerminalWorkItem \
                      TestUpdateWorkItemAttrsPatch_SurvivesANonObjectStoredValue \
                      TestUpdateWorkItemAttrs_NullFilledPatchIsNotAConflict \
                      TestUpdateWorkItemAttrs_RejectsAttrsCombinedWithPatch; do
            grep -q -- "--- PASS: $want" wi_attrs.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated attrs merge coverage is not actually executing"; exit 1; }
          done
          # aihub#543's review round — PARENT-CITED SUBTESTS, pinned by name for the
          # reason the "aihub#371 remember project/work_item_id consistency DB tests"
          # step states of its own six: a contract card cites the
          # PARENT function, so deleting the subtest leaves the citation resolving, K12
          # green, and this step's function-level greps unmoved. Each name below was
          # read off a real `--- PASS:` line rather than derived from the t.Run string.
          for want in "TestUpdateWorkItemAttrsPatch_DoesNotDestroyOtherKeys/the_merge_is_shallow:_a_patched_key's_stored_value_is_replaced_outright" \
                      "TestUpdateWorkItemAttrsPatch_WorksOnTerminalWorkItem/a_patch_mixing_attrs_patch_with_a_working-tier_field_is_refused_whole"; do
            grep -q -- "--- PASS: $want" wi_attrs.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the pf_update_work_item card cites these functions for the shallow merge and for the mixed-patch refusal, and a deleted subtest leaves the citation resolving to a function that no longer holds the claim"; exit 1; }
          done
          ! grep -q -- '--- SKIP' wi_attrs.log \
            || { echo "::error::a TestUpdateWorkItemAttrs case SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#230: exercise the ListDependencies blocking/blocked_by direction
      # fix against the same Postgres service, already migrated by the "Apply
      # migrations (aihub#242 DB tests)" step above — reused here rather than
      # running goose a third time.
      #
      # Deliberately scoped to `-run 'TestListDependencies_Direction'` rather
      # than setting AIHUB_TEST_DB on the "Unit tests" step, for the same reason
      # as the two steps above: this domain package has several other
      # AIHUB_TEST_DB-gated suites that would also switch on if the var were set
      # package-wide, and this change did not verify those pass.
      #
      # The direction assertions are the whole point of this test: counting
      # entries alone passes against the pre-fix (inverted) SQL, so the test
      # asserts the identity AND slug of the wi in each list, plus that the
      # opposite list is empty. Verified by mutation locally: it FAILs against
      # the pre-fix SQL, against either half of a partially-applied swap
      # (predicate-only or projection-only), against one query left un-swapped,
      # and against a JOIN column that diverges from the projected column.
      #
      # Runs with -v and then asserts the case actually reported PASS, rather
      # than trusting the exit code — `go test` prints "ok" and exits 0 when
      # every selected test SKIPs, and setupLatestTestDB skips whenever
      # AIHUB_TEST_DB is empty, so without this guard a broken env block would
      # silently restore the zero-coverage state that let this inversion ship.
      - name: aihub#230 dependency-direction DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestListDependencies_Direction' -count=1 -v 2>&1 | tee dep_direction.log
          grep -q -- "--- PASS: TestListDependencies_Direction" dep_direction.log \
            || { echo "::error::TestListDependencies_Direction did not run (expected '--- PASS: TestListDependencies_Direction'); the DB-gated direction coverage is not actually executing"; exit 1; }
          ! grep -q -- '--- SKIP' dep_direction.log \
            || { echo "::error::TestListDependencies_Direction SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#357, both halves of "a dependency edge nobody can read".
      #
      # The domain half guards the RECORD: creating an edge must leave a
      # dependency_created event on the blocked wi, from either writer, and a
      # duplicate create must add neither a row nor an event. Its first subtest
      # is a CONTROL that passed before the fix — aihub#357 was filed as "no edge
      # is created at all", which measurement disproved, and that arm is what
      # keeps a red event assertion from being read as a broken fixture.
      #
      # The server half guards the READ, over the four places a work item can be
      # named by slug and was then compared against a column of canonical ids:
      # the three dependency handlers plus PredictConflicts' will_unlock. Each
      # resolved id-or-slug for something (an access check, a project lookup) and
      # then queried with the caller's raw parameter. The list endpoint answered
      # 200 with two empty lists for a wi whose edges were sitting in the table,
      # which is what made aihub#357 look like a missing write. A domain test
      # cannot see the handler three — domain.ListDependencies is correct for
      # every id it is handed — so these run through the real router.
      #
      # Subtests rather than nine functions, per aihub#334: this gate ratchets
      # on function count. The per-arm coverage claim is the greps below.
      - name: aihub#357 dependency machine-readability + slug-resolution DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestBlockedByIsMachineReadable$' -count=1 -v 2>&1 | tee dep_events.log
          go test ./internal/server/ -run '^TestDependencyEndpointsResolveSlugs$' -count=1 -v 2>&1 | tee dep_slug.log
          go test ./internal/server/ -run '^TestBlockedBySlugCannotProbeInvisibleProjects$' -count=1 -v 2>&1 | tee dep_vis.log
          for want in 'TestBlockedByIsMachineReadable/control_blocked_by_writes_one_edge_per_blocker' \
                      'TestBlockedByIsMachineReadable/blocked_by_emits_one_dependency_created_event_per_blocker' \
                      'TestBlockedByIsMachineReadable/create_dependency_emits_the_same_event' \
                      'TestBlockedByIsMachineReadable/recreating_an_existing_edge_emits_no_second_event'; do
            grep -q -- "--- PASS: $want" dep_events.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); an aihub#357 arm is unguarded and a dependency can be created with no machine-readable record of it"; exit 1; }
          done
          # aihub#543's review round — PARENT-CITED SUBTESTS, pinned by name for the
          # reason the "aihub#371 remember project/work_item_id consistency DB tests"
          # step states of its own six: a contract card cites the
          # PARENT function, so deleting the subtest leaves the citation resolving, K12
          # green, and this step's function-level greps unmoved. Each name below was
          # read off a real `--- PASS:` line rather than derived from the t.Run string.
          for want in "TestBlockedByIsMachineReadable/cross_project_needs_viewer_on_the_blocking_end"; do
            grep -q -- "--- PASS: $want" dep_events.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the pf_create_work_item and pf_create_dependency cards cite this function for the cross-project visibility rule on the blocking end, and a deleted subtest leaves the citation resolving to a function that no longer holds the claim"; exit 1; }
          done
          for want in 'TestDependencyEndpointsResolveSlugs/list_by_slug_returns_the_same_edges_as_by_id' \
                      'TestDependencyEndpointsResolveSlugs/list_by_slug_reports_the_blocking_end_too' \
                      'TestDependencyEndpointsResolveSlugs/create_by_slug_creates_a_readable_edge' \
                      'TestDependencyEndpointsResolveSlugs/delete_by_slug_removes_the_edge_created_by_slug' \
                      'TestDependencyEndpointsResolveSlugs/one_blocker_named_by_both_id_and_slug_is_one_edge_and_one_event' \
                      'TestDependencyEndpointsResolveSlugs/predict_conflicts_will_unlock_by_slug_matches_by_id'; do
            grep -q -- "--- PASS: $want" dep_slug.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); a dependency endpoint can answer a slug with an empty list instead of the edges it holds"; exit 1; }
          done
          # The visibility arms. The three positive ones are NOT optional: they
          # pass before the fix too, and they are what stops "close the oracle"
          # from being satisfied by refusing every cross-project blocked_by.
          for want in 'TestBlockedBySlugCannotProbeInvisibleProjects/fixture_outsider_cannot_read_B_by_any_honest_route' \
                      'TestBlockedBySlugCannotProbeInvisibleProjects/probing_an_invisible_project_by_slug_is_not_a_create' \
                      'TestBlockedBySlugCannotProbeInvisibleProjects/an_invisible_hit_is_indistinguishable_from_a_genuine_miss' \
                      'TestBlockedBySlugCannotProbeInvisibleProjects/a_viewer_on_the_other_project_may_still_block_on_it' \
                      'TestBlockedBySlugCannotProbeInvisibleProjects/an_admin_may_still_block_on_any_project' \
                      'TestBlockedBySlugCannotProbeInvisibleProjects/the_ordinary_same_project_slug_still_resolves'; do
            grep -q -- "--- PASS: $want" dep_vis.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); blocked_by's enumerable <project>#<seq> reference is an existence oracle for projects the caller cannot see, or the check that closes it also broke a legitimate cross-project blocked_by"; exit 1; }
          done
          ! grep -q -- '--- SKIP' dep_events.log \
            || { echo "::error::an aihub#357 internal/domain test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' dep_slug.log \
            || { echo "::error::an aihub#357 internal/server test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' dep_vis.log \
            || { echo "::error::an aihub#357 visibility test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#363 — the same class as the step above, one endpoint further on.
      # pf_recall's `work_item_id` filter was compared raw against
      # memories.work_item_id, which FK-references work_items(id), so a slug
      # matched nothing and the endpoint answered 200 with an empty list: the
      # same page a work item with no memories returns. pf-work's SKILL.md asks
      # for exactly this call on every claim path to pick up the previous
      # agent's handover notes, and hands out a slug, so an agent taking over
      # got zero context and no signal that anything was missing.
      #
      # The greps are split into three groups because they fail for three
      # different reasons, and a single "an arm did not run" message would say
      # none of them:
      #
      #   resolution — the defect itself; red on the unfixed tree.
      #   containment — the fix must not become a WIDER answer. These three are
      #     the same shape as the visibility arms above: "absent" and "you
      #     cannot see it" must be one response, byte for byte, and the
      #     reference response is the one an unknown canonical id already gave
      #     BEFORE the change, so no new signal is introduced. Two of them pass
      #     on the unfixed tree and are kept precisely so that closing the
      #     oracle cannot be satisfied by refusing to resolve anything.
      #   placement — every other arm goes through handleRecall, so all of them
      #     stay green if the resolution is done in that handler; the other two
      #     builders of a RecallRequest (/ui/memories and the wi detail page's
      #     artifact links) would still answer a slug with nothing. Only the
      #     domain-entry arm can tell those two fixes apart, and a mutation that
      #     moved the resolution into the handler reddened it and nothing else.
      - name: aihub#363 recall work_item_id slug-resolution DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^TestRecallResolvesWorkItemIdOrSlug$' -count=1 -v 2>&1 | tee recall_wi_slug.log
          for want in 'TestRecallResolvesWorkItemIdOrSlug/control_by_canonical_id_returns_the_memories_of_that_work_item' \
                      'TestRecallResolvesWorkItemIdOrSlug/by_slug_returns_the_same_page_as_by_id' \
                      'TestRecallResolvesWorkItemIdOrSlug/a_slug_still_filters_to_that_one_work_item' \
                      'TestRecallResolvesWorkItemIdOrSlug/a_cross-project_canonical_id_still_reaches_the_memory_it_always_did' \
                      'TestRecallResolvesWorkItemIdOrSlug/the_slug_of_that_work_item_reaches_the_same_memory_as_its_id'; do
            grep -q -- "--- PASS: $want" recall_wi_slug.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); pf_recall can answer a work_item_id slug with an empty page instead of that work item's memories, which is what every claim path reads its handover notes with"; exit 1; }
          done
          for want in 'TestRecallResolvesWorkItemIdOrSlug/a_nonexistent_canonical_id_is_still_an_empty_page' \
                      'TestRecallResolvesWorkItemIdOrSlug/a_nonexistent_slug_answers_exactly_what_a_nonexistent_id_does' \
                      'TestRecallResolvesWorkItemIdOrSlug/an_invisible_slug_answers_exactly_what_a_nonexistent_one_does' \
                      'TestRecallResolvesWorkItemIdOrSlug/the_caller_really_cannot_read_the_other_project'; do
            grep -q -- "--- PASS: $want" recall_wi_slug.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); resolving a work_item_id slug has widened what recall answers — an existence answer that varies makes the guessable <project>#<seq> an oracle, or the fixture no longer has an invisible project to probe for"; exit 1; }
          done
          grep -q -- '--- PASS: TestRecallResolvesWorkItemIdOrSlug/the_shared_domain_entry_resolves_the_slug_itself' recall_wi_slug.log \
            || { echo "::error::the domain-entry arm did not run; without it a resolution that lives in handleRecall passes every other arm while /ui/memories and the wi detail page still answer a slug with nothing"; exit 1; }
          ! grep -q -- '--- SKIP' recall_wi_slug.log \
            || { echo "::error::the aihub#363 recall slug test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#371 — the write side of the same column the step above reads.
      # domain.Remember resolved work_item_id through a bare GetWorkItem, which
      # finds any work item on the server and compares its project against
      # nothing, while handleRemember authorized on req.Project alone. So
      # project=A plus work_item_id=<a work item in B> was stored verbatim, and
      # recall ANDs the work_item filter onto the project scope — making the row
      # invisible to pf_recall(project=wi.project, work_item_id=wi_id), which is
      # the call every pf-work claim path uses to pick up handover notes. Not a
      # leak: write-only data.
      #
      # The greps are split into three groups because they fail for three
      # different reasons, and one "an arm did not run" message would say none
      # of them:
      #
      #   consistency — the defect itself; red on the unfixed tree, where each
      #     of these answered 201 and wrote the mismatched row.
      #   preserved — the positive controls, green on BOTH trees. They are what
      #     stops the group above from being satisfied by refusing work_item_id
      #     outright, which would pass every negative arm and break every
      #     caller. The back-fill arm is the sharpest: handleRemember derives
      #     project FROM the work item when project is omitted, and callers
      #     depend on it.
      #   containment — closing a write hole must not open a read one. Before
      #     the fix a caller with no role on B could tell B#7 (201) from B#9999
      #     (404); afterwards both are one 404 differing only in the caller's
      #     own echoed reference. Same shape as the aihub#357 blocked_by arms,
      #     and the reason the scope is a predicate inside the resolving query
      #     rather than a check on its result.
      #   placement — every other arm goes through handleRemember, so all of
      #     them stay green if the gate is written into that handler while
      #     domain.Remember's other callers keep writing the mismatch. The
      #     domain-entry arm is the only one that can tell those two fixes
      #     apart, and it is also where the pf_save_artifact half is stated:
      #     both MCP memory tools post to this one endpoint and land on this one
      #     function.
      - name: aihub#371 remember project/work_item_id consistency DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^TestRememberRejectsCrossProjectWorkItem$' -count=1 -v 2>&1 | tee remember_wi_scope.log
          for want in 'TestRememberRejectsCrossProjectWorkItem/a_cross-project_work_item_is_refused_by_slug' \
                      'TestRememberRejectsCrossProjectWorkItem/a_cross-project_work_item_is_refused_by_canonical_id' \
                      'TestRememberRejectsCrossProjectWorkItem/an_admin_is_refused_the_same_cross-project_mount' \
                      'TestRememberRejectsCrossProjectWorkItem/a_supersede_cannot_carry_a_cross-project_work_item_either'; do
            grep -q -- "--- PASS: $want" remember_wi_scope.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); a memory can again be stored against a work item in another project, which makes it unreachable by the pf_recall every claim path uses to read handover notes"; exit 1; }
          done
          for want in 'TestRememberRejectsCrossProjectWorkItem/the_fixture_really_spans_two_projects' \
                      'TestRememberRejectsCrossProjectWorkItem/the_caller_really_cannot_read_the_other_project' \
                      'TestRememberRejectsCrossProjectWorkItem/a_same-project_work_item_still_attaches_by_canonical_id' \
                      'TestRememberRejectsCrossProjectWorkItem/a_same-project_work_item_still_attaches_by_slug' \
                      'TestRememberRejectsCrossProjectWorkItem/omitting_project_still_back-fills_it_from_the_work_item' \
                      'TestRememberRejectsCrossProjectWorkItem/an_admin_can_still_attach_within_one_project'; do
            grep -q -- "--- PASS: $want" remember_wi_scope.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); either attaching a memory to a work item has stopped working altogether — which passes every negative arm above and is not a fix — or the two-project fixture no longer states what those arms need"; exit 1; }
          done
          for want in 'TestRememberRejectsCrossProjectWorkItem/a_nonexistent_work_item_is_refused_too' \
                      'TestRememberRejectsCrossProjectWorkItem/an_invisible_work_item_answers_exactly_what_a_nonexistent_one_does'; do
            grep -q -- "--- PASS: $want" remember_wi_scope.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); refusing the cross-project write has become a NEW existence answer — a work item you may not see must be indistinguishable from one that does not exist, or the guessable <project>#<seq> namespace is an oracle"; exit 1; }
          done
          grep -q -- '--- PASS: TestRememberRejectsCrossProjectWorkItem/the_shared_domain_entry_refuses_it_with_no_handler_in_front' remember_wi_scope.log \
            || { echo "::error::the domain-entry arm did not run; without it a gate written into handleRemember passes every other arm while UpdateMemory and any future caller of domain.Remember still write the mismatch"; exit 1; }
          # aihub#543 probe wave 2 — two pf_remember card claims hosted as subtests
          # of this function rather than as new DB-gated functions. Pinned by name
          # here because the card cites the PARENT: delete the subtests and the
          # citation still resolves, K12 stays green, and this step's greps above
          # would not notice either.
          for want in 'TestRememberRejectsCrossProjectWorkItem/the_reply_carries_both_id_aliases_and_they_agree' \
                      'TestRememberRejectsCrossProjectWorkItem/dedup_mode_decides_what_happens_to_a_similar_memory/off_stores_a_second_copy_and_annotates_nothing' \
                      'TestRememberRejectsCrossProjectWorkItem/dedup_mode_decides_what_happens_to_a_similar_memory/suggest_stores_it_and_records_what_it_resembles' \
                      'TestRememberRejectsCrossProjectWorkItem/dedup_mode_decides_what_happens_to_a_similar_memory/strict_refuses_and_names_the_row_it_collided_with' \
                      'TestRememberRejectsCrossProjectWorkItem/dedup_mode_decides_what_happens_to_a_similar_memory/strict_still_accepts_a_genuinely_different_memory' \
                      'TestRememberRejectsCrossProjectWorkItem/dedup_mode_decides_what_happens_to_a_similar_memory/strict_stores_a_near_miss_and_annotates_it_instead'; do
            grep -q -- "--- PASS: $want" remember_wi_scope.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the pf_remember card cites this function for the id/memory_id alias and for what each dedup_mode spelling does, and a deleted subtest leaves the citation resolving to a function that no longer holds the claim"; exit 1; }
          done
          ! grep -q -- '--- SKIP' remember_wi_scope.log \
            || { echo "::error::the aihub#371 remember scope test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#475 — the reinforce response reported a base_strength that was
      # never stored.
      #
      # memories.base_strength is SMALLINT, so pgx encodes the handler's float64
      # through its int2 codec, which TRUNCATES TOWARD ZERO and returns no error
      # (measured in both wire formats; domain
      # TestBaseStrengthIsTruncatedByThePgxInt2Codec pins it). The 200 body and
      # the memory_reinforced payload were both rendered from the Go arithmetic
      # rather than from the row, so on a memory stored at 3 a
      # `strength_delta: 0.5` stored 3 and answered 3.5 — and the next identical
      # call read 3 back and answered 3.5 again. Every |strength_delta| below 1
      # was a permanent no-op that reported progress on every call, and nothing
      # a caller could observe told it apart from a working one. The fix is
      # `RETURNING base_strength, activation_count` and a response built from
      # what comes back.
      #
      # Two functions, one step, and the second is not optional. Every assertion
      # in the first is ALSO satisfied by a handler that reinforces nothing and
      # honestly reports the unchanged row — a worse bug, reported accurately —
      # so IntegralDeltaStillMoves is what stops the pair from being green for
      # that reason. It carries the clamp arm for the same purpose: aihub#475
      # changed what is REPORTED, never what may be stored, and a clamp that
      # stopped clamping would be exactly the change it promises not to make.
      #
      # The criterion in the first is `response == column`, not `response == 3`,
      # because aihub#459 may yet refuse, round, or make storable a fractional
      # value; that equality holds under all three of its options. Exactly one
      # arm pins the number, and it says there why it is entitled to.
      #
      # 🟢 aihub#459 (2026-09-09) answered that, and the answer was REFUSE, so
      # the paragraph above is now history rather than a live caveat. The first
      # function no longer runs `strength_delta: 0.5` expecting a 200 — that
      # input is a 400 before the first query — and the arm that pinned `3.0`
      # is gone with the mechanism it described. What replaced it is the thing
      # only a database can check: the refusal leaves base_strength AND
      # activation_count untouched and emits no memory_reinforced event, which
      # is what a guard moved below the UPDATE would break while still
      # returning the right status.
      #
      # ⚠️ And the equality itself is now weaker than it reads. With every
      # accepted delta integral and the column SMALLINT, a handler publishing
      # its own arithmetic and one publishing the row cannot disagree, so this
      # step no longer discriminates between them. The DB-free
      # TestReinforceResponseReportsTheStoredBaseStrength named below is what
      # does; it is not a companion to this step, it is the load-bearing arm.
      #
      # The DB-free companions have no line in the ledger above, and one of them
      # is why this step is not the only cover: server
      # TestReinforceResponseReportsTheStoredBaseStrength parses the shipped
      # handler and asserts that what it publishes as base_strength is an
      # identifier scanned from a RETURNING, so the invariant is checked in the
      # default `go test ./...` where the two functions below SKIP.
      - name: aihub#475 reinforce reports the stored base_strength DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^TestReinforceMemory_ResponseMatchesTheStoredBaseStrength$' -count=1 -v 2>&1 | tee reinforce_returning.log
          go test ./internal/server/ -run '^TestReinforceMemory_IntegralDeltaStillMoves$' -count=1 -v 2>&1 | tee reinforce_control.log
          grep -q -- '--- PASS: TestReinforceMemory_ResponseMatchesTheStoredBaseStrength' reinforce_returning.log \
            || { echo "::error::TestReinforceMemory_ResponseMatchesTheStoredBaseStrength did not run (expected '--- PASS:'); nothing then checks that a refused fractional strength_delta leaves the row and the event log untouched (aihub#459), nor that the 200 body names the value the column holds (aihub#475)"; exit 1; }
          grep -q -- '--- PASS: TestReinforceMemory_IntegralDeltaStillMoves' reinforce_control.log \
            || { echo "::error::TestReinforceMemory_IntegralDeltaStillMoves did not run (expected '--- PASS:'); without it the test above is satisfied by a handler that reinforces nothing and reports the unchanged row honestly, and the clamp is unasserted"; exit 1; }
          ! grep -q -- '--- SKIP' reinforce_returning.log \
            || { echo "::error::the aihub#475 reinforce response test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' reinforce_control.log \
            || { echo "::error::the aihub#475 reinforce control test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#377: project membership is the only visibility boundary.
      #
      # Scoped with -run rather than by setting AIHUB_TEST_DB on the "Unit tests"
      # step, for the same reason as every DB step above: internal/server holds
      # other gated suites this change did not verify.
      #
      # The three grep groups below are three different failures, and collapsing
      # them into one would lose the distinction that decides how to react:
      #
      #   identity_*  — a work item, step, event, dependency or memory you may
      #                 not see answered DIFFERENTLY from one that does not
      #                 exist. That single bit makes <project>#<seq> — a
      #                 namespace counting from 1 — walkable across projects.
      #   positive_*  — a member stopped being able to read their OWN project,
      #                 or an admin did. "Every refusal is identical" is
      #                 trivially satisfied by refusing everybody, so these are
      #                 what tell a fix from an outage. A red here means the
      #                 change over-blocked, NOT that the leak is worse.
      #   invariant2  — the edge from a visible work item into an invisible one
      #                 stopped carrying the far end's slug. That reference is
      #                 the OWNER'S OWN DATA and hiding it makes them unable to
      #                 read their own dependency graph; what stops it being an
      #                 enumerator is the write-side scoping (aihub#357), not
      #                 silence on read.
      #
      # positive_insufficient_role_still_explains is called out separately
      # because it is the one arm that goes red if someone "finishes the job" by
      # turning the member-role 403 into a 404 as well.
      - name: aihub#377 project-visibility byte-identity DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^TestProjectVisibilityIdentityOverHTTP$' -count=1 -v 2>&1 | tee project_visibility.log
          for want in 'TestProjectVisibilityIdentityOverHTTP/identity_work_item_by_canonical_id' \
                      'TestProjectVisibilityIdentityOverHTTP/identity_work_item_by_slug' \
                      'TestProjectVisibilityIdentityOverHTTP/identity_step' \
                      'TestProjectVisibilityIdentityOverHTTP/identity_events' \
                      'TestProjectVisibilityIdentityOverHTTP/identity_dependencies' \
                      'TestProjectVisibilityIdentityOverHTTP/identity_memory'; do
            grep -q -- "--- PASS: $want" project_visibility.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); an object in a project the caller cannot see is again distinguishable from one that does not exist, which makes <project>#<seq> enumerable"; exit 1; }
          done
          for want in 'TestProjectVisibilityIdentityOverHTTP/fixture_outsider_has_no_access_to_projB' \
                      'TestProjectVisibilityIdentityOverHTTP/positive_member_reads_own_work_item' \
                      'TestProjectVisibilityIdentityOverHTTP/positive_member_reads_own_work_item_by_slug' \
                      'TestProjectVisibilityIdentityOverHTTP/positive_member_reads_own_step' \
                      'TestProjectVisibilityIdentityOverHTTP/positive_member_reads_own_events' \
                      'TestProjectVisibilityIdentityOverHTTP/positive_member_reads_own_dependencies' \
                      'TestProjectVisibilityIdentityOverHTTP/positive_member_reads_own_memory' \
                      'TestProjectVisibilityIdentityOverHTTP/positive_admin_unchanged'; do
            grep -q -- "--- PASS: $want" project_visibility.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); either the change over-blocked and members can no longer read their own project, or the two-project fixture no longer states what the identity arms need"; exit 1; }
          done
          grep -q -- '--- PASS: TestProjectVisibilityIdentityOverHTTP/positive_insufficient_role_still_explains' project_visibility.log \
            || { echo "::error::the insufficient-role arm did not run; it is the ONLY control that distinguishes 'every denial is now uniform' from 'authorization is broken and everything is denied' — a member short of a role must keep an explanatory 403"; exit 1; }
          grep -q -- '--- PASS: TestProjectVisibilityIdentityOverHTTP/invariant2_edge_shows_slug_and_no_access' project_visibility.log \
            || { echo "::error::the invariant-2 arm did not run; a work item's own blocked_by reference must still show the far end's slug with accessible=false, or the owner cannot read their own dependency graph"; exit 1; }
          ! grep -q -- '--- SKIP' project_visibility.log \
            || { echo "::error::the aihub#377 byte-identity test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#382: listWorkItemsPage's text path never checked rows.Err(), so an
      # execute-time failure (cursor=garbage failing its `::timestamptz` cast,
      # or anything else Postgres reports after the statement was accepted) was
      # answered with 200 {"items":[]}. The arms are named one by one rather than
      # counted: the two negative arms are the regression, the control is what
      # separates "execution errors surface" from "every cursor is now rejected",
      # and a subtest that stops being scheduled must go red here, not vanish.
      # aihub#392: the MCP layer minted a FRESH session_secret on every
      # pf_claim_work_item call and persisted it, while the server's replay
      # branch returns the EXISTING attempt and never touches
      # session_secret_hash. So a retry with the same idempotency_key — the one
      # thing an idempotency key exists for — left the state file holding a
      # credential the server had never seen, and every later
      # credential-checked call answered "invalid session_secret".
      #
      # Needs a real database because the defect IS the disagreement between a
      # secret this process wrote to disk and a hash a Postgres row holds, and
      # neither side is observable from the other. A fake aihub has no
      # run_attempts table, so it can neither replay nor verify a credential:
      # the assertion has to be "an authenticated call SUCCEEDS", which only a
      # real server over a real database can answer.
      #
      # Three arms, and the two controls are not padding. Without
      # WithoutReplayCanAuthenticate a red replay arm is equally consistent with
      # "authenticated calls never work in this harness"; without
      # WithANewKeyMintsAFreshSecret nothing catches the mirror-image failure of
      # reusing a recorded secret for a DIFFERENT key, which would bind the
      # state file to the wrong attempt on an ordinary re-claim.
      - name: aihub#392 claim idempotency-replay credential DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/mcp/ -run '^TestE2EClaim(ReplayKeepsTheSecretTheServerAccepts|WithoutReplayCanAuthenticate|WithANewKeyMintsAFreshSecret)$' -count=1 -v 2>&1 | tee claim_replay_secret.log
          grep -q -- '--- PASS: TestE2EClaimReplayKeepsTheSecretTheServerAccepts' claim_replay_secret.log \
            || { echo "::error::TestE2EClaimReplayKeepsTheSecretTheServerAccepts did not run (expected '--- PASS: ...'); a replayed idempotency_key can again leave the client holding a session_secret the server rejects"; exit 1; }
          for want in TestE2EClaimWithoutReplayCanAuthenticate \
                      TestE2EClaimWithANewKeyMintsAFreshSecret; do
            grep -q -- "--- PASS: $want" claim_replay_secret.log \
              || { echo "::error::control arm $want did not run; without it the replay assertion above cannot distinguish 'the replay is fixed' from 'this harness never authenticates' / 'the fix over-reached onto fresh keys'"; exit 1; }
          done
          ! grep -q -- '--- SKIP' claim_replay_secret.log \
            || { echo "::error::an aihub#392 claim-replay test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      - name: aihub#382 list_work_items rows.Err() DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestListWorkItemsSurfacesExecuteTimeErrors$' -count=1 -v 2>&1 | tee list_wi_rows_err.log
          for want in 'TestListWorkItemsSurfacesExecuteTimeErrors/cursor_cast_failure_is_an_error' \
                      'TestListWorkItemsSurfacesExecuteTimeErrors/forced_execution_error_is_not_an_empty_page'; do
            grep -q -- "--- PASS: $want" list_wi_rows_err.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); an execute-time failure in GET /v1/work_items is again reported as an empty page"; exit 1; }
          done
          grep -q -- '--- PASS: TestListWorkItemsSurfacesExecuteTimeErrors/control_well_formed_cursor_lists_normally' list_wi_rows_err.log \
            || { echo "::error::the control arm did not run; it is what separates 'execution errors surface' from 'every cursor is rejected'"; exit 1; }
          ! grep -q -- '--- SKIP' list_wi_rows_err.log \
            || { echo "::error::the aihub#382 rows.Err() test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#393: a force takeover skipped the cross-work-item lock-conflict
      # probe (FnClaimWorkItem was guarded by `&& !isTakeover`; FnForceTakeover
      # had no probe at all and discarded the upsert's error), so
      # acquireLockUpsert rewrote resource_locks rows owned by LIVE attempts of
      # OTHER work items and returned success — the displaced agent was told
      # nothing and kept editing files it no longer held.
      #
      # Two halves, and BOTH must run. The refusal arms are the regression; the
      # control arms are what separates "foreign holders are refused" from
      # "takeover no longer takes any lock", which is the direction a fix that
      # over-widens the predicate breaks. Each control pins one dimension of
      # that predicate: the own-lock and paused-git_branch arms pin "another
      # WORK ITEM" (not merely "another live attempt"), and the orphan arm pins
      # "running/paused" (not merely "an owner exists"). Measured 2026-09-07: a
      # mutant dropping `AND ra.work_item_id <> $5` reddens only the
      # paused-git_branch arm, and one dropping the status filter reddens only
      # the orphan arm.
      #
      # Named one by one rather than counted, and never by package: a subtest
      # that stops being scheduled has to go red here, not silently vanish —
      # `go test -run` exits 0 when its selector matches nothing.
      - name: aihub#393 force-takeover cross-wi lock steal DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestForceTakeoverLockSteal' -count=1 -v 2>&1 | tee ft_lock_steal.log
          for want in 'TestForceTakeoverLockSteal_ClaimRefusesAForeignHolder/explicit_force_takeover_by_another_user' \
                      'TestForceTakeoverLockSteal_ClaimRefusesAForeignHolder/same_user_reclaim_of_a_running_wi' \
                      'TestForceTakeoverLockSteal_ForceTakeoverToolRefusesAForeignHolder'; do
            grep -q -- "--- PASS: $want" ft_lock_steal.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); a force takeover can again displace a resource lock held by a live attempt of another work item"; exit 1; }
          done
          for want in 'TestForceTakeoverLockSteal_ControlsStillAllowTheLegitimateDisplacements/control_takeover_still_takes_the_targets_own_lock' \
                      'TestForceTakeoverLockSteal_ControlsStillAllowTheLegitimateDisplacements/control_force_takeover_tool_still_takes_the_targets_own_lock' \
                      'TestForceTakeoverLockSteal_ControlsStillAllowTheLegitimateDisplacements/control_orphan_row_of_a_dead_foreign_attempt_is_reclaimed' \
                      'TestForceTakeoverLockSteal_ControlsStillAllowTheLegitimateDisplacements/control_resume_still_displaces_its_own_paused_attempts_git_branch_lock'; do
            grep -q -- "--- PASS: $want" ft_lock_steal.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); without it the refusal arms above are also satisfied by a takeover that displaces nothing at all"; exit 1; }
          done
          ! grep -q -- '--- SKIP' ft_lock_steal.log \
            || { echo "::error::an aihub#393 arm SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#410, the residue of the aihub#393 step above and placed next to it
      # for that reason. That change gave FnClaimWorkItem and FnForceTakeover a
      # shared cross-work-item lock probe; what it left behind was the probe's
      # error handling. The whole of it was `if err == nil { conflict }`, so
      # ErrNoRows and a genuine failure took the same silent path and the claim
      # walked on believing nothing held the lock.
      #
      # Safety was never the casualty — lockUpsertSQL's conditional ON CONFLICT
      # DO UPDATE is the backstop and holds. CLASSIFICATION was. FnClaimWorkItem's
      # transaction is SERIALIZABLE, so 40001 is live on this path, and a 40001
      # aborts the transaction: every later statement then fails with 25P02,
      # which is not class 40, so the caller was told 500 INTERNAL_ERROR about a
      # statement that was only the second victim. Measured on the mutant:
      #
      #   500 INTERNAL_ERROR  failed to insert run_attempt: ERROR: current
      #                       transaction is aborted, commands ignored until end
      #                       of transaction block (SQLSTATE 25P02)
      #
      # THE DB IS THE POINT, not scaffolding. The unit arms in
      # lock_probe_error_test.go hand probeForeignLockHolders a stub pgx.Tx and
      # run on the "Unit tests" step with no database — they assert what the
      # function returns. This step asserts that the classification survives the
      # trip out through FnClaimWorkItem to the caller, past the aborted
      # transaction that used to overwrite it. Neither implies the other.
      #
      # The fixture renames resource_locks and puts a view over a 40001-raising
      # set-returning function in its place, so the SQLSTATE is real and arrives
      # on the real probe statement. It self-checks by running the actual
      # foreignLockHolderSQL and requiring 40001 back, and restores the table in
      # t.Cleanup — if that restore ever fails, later steps in this block fail on
      # the fixture rather than on their own subject, which is the loud outcome.
      - name: aihub#410 lock-probe error classification DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestClaimProbeFailureReachesTheCallerAsARetryable409$' -count=1 -v 2>&1 | tee lock_probe_err.log
          for want in TestClaimProbeFailureReachesTheCallerAsARetryable409; do
            grep -q -- "--- PASS: $want" lock_probe_err.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); a lock-probe failure can again reach the caller as an unclassified 500 instead of the retryable 409"; exit 1; }
          done
          ! grep -q -- '--- SKIP' lock_probe_err.log \
            || { echo "::error::the aihub#410 arm SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#430, the third step in this aihub#393 -> #410 -> #430 block and the
      # one that settles what the other two only asserted. pf_claim_work_item's
      # force_takeover description carried "…except in a narrow commit-window
      # race (aihub#410)", inherited from a note written about pf_force_takeover.
      # The two tools reach lockUpsertSQL at DIFFERENT isolation levels —
      # FnClaimWorkItem opens SERIALIZABLE, FnForceTakeover opens pool.Begin —
      # so one sentence cannot be true of both, and the claim tool's copy was
      # deleted on the strength of this step.
      #
      # THE DB IS THE POINT, and more so here than anywhere else in this block:
      # the subject is what Postgres does at the instant a blocked writer is
      # released by the committing one. Nothing short of two real backends racing
      # over one real row can produce it, and no source reading can settle it.
      # Measured: 409 CONFLICT_SERIALIZATION_FAILURE (SQLSTATE 40001) with the
      # row unchanged.
      #
      # BOTH arms are named. The window arm is the measurement; the orphan arm is
      # the control that makes "the owner did not change" mean something — with a
      # harness that cannot observe the column moving at all, the window arm
      # passes for free. The test's own synchronisation is a pg_stat_activity
      # poll that FAILS if the claim never blocks inside the upsert, so a run in
      # which the two never overlapped is red rather than quietly green.
      - name: aihub#430 claim-takeover commit-window DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestClaimTakeoverCommitWindowCannotDisplaceAForeignLock$' -count=1 -v 2>&1 | tee claim_commit_window.log
          for want in 'TestClaimTakeoverCommitWindowCannotDisplaceAForeignLock/foreign_lock_committed_inside_the_takeover_window'; do
            grep -q -- "--- PASS: $want" claim_commit_window.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the claim tool's force_takeover description now promises 'No flag displaces another work item's lock' with nothing measuring it"; exit 1; }
          done
          for want in 'TestClaimTakeoverCommitWindowCannotDisplaceAForeignLock/orphan_lock_committed_before_the_claim_is_displaced'; do
            grep -q -- "--- PASS: $want" claim_commit_window.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); without the control arm, 'the lock did not change hands' is also satisfied by a harness that cannot see it change hands at all"; exit 1; }
          done
          ! grep -q -- '--- SKIP' claim_commit_window.log \
            || { echo "::error::an aihub#430 arm SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#451, the fourth step in the aihub#393 -> #410 -> #430 -> #451 block
      # and the one that settles what #430 deliberately left open. #430 deleted
      # the commit-window qualifier from pf_claim_work_item and KEPT it on
      # pf_force_takeover, while recording an unasserted probe: at READ COMMITTED
      # — FnForceTakeover's level — its interleaving was refused too. Read
      # quickly that says the surviving qualifier describes a gap nothing can
      # reach. It does not: that probe committed only the LOCK ROW inside the
      # window, so the DO UPDATE's WHERE re-ran against a snapshot that still
      # contained the owner and refused. The gap resource_events.go documents is
      # the `prior` CTE's blindness and a STALE run_attempts read.
      #
      # This step builds the shape that reaches it — a foreign claim IN FLIGHT,
      # run_attempts row and resource_locks row committed together inside the
      # window, which is what FnClaimWorkItem holds between its first insert and
      # its commit — and measures a real displacement: the takeover succeeds, a
      # live foreign holder loses its row, and nobody is told.
      #
      # THE DB IS THE POINT, for #430's reason and one more: the subject is that
      # READ COMMITTED re-reads the conflicting ROW but not the other relations
      # in the same statement. No source reading settles that, and no unit test
      # can hand-build it.
      #
      # ⚠️ This step asserts that a defect is REACHABLE. If the window arm goes
      # red because the gap was closed — FnForceTakeover raised to SERIALIZABLE,
      # or the holder re-read inside the statement — the fix is to DELETE the
      # "except in a narrow commit-window race (aihub#410)" clause from
      # pf_force_takeover's description, docs/mcp-cards/pf_force_takeover.md and
      # the resource_events.go comment in that same change, and delete the test.
      # It is not to restore the race. Both control arms are named for the usual
      # reason: without the refusal arm, "displaced" is also what a build with
      # the aihub#393 predicate disabled reports, and without the event-trail arm
      # the window arm's "no lock_released was emitted" passes in a harness where
      # none ever is.
      - name: aihub#451 force-takeover commit-window DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestForceTakeoverCommitWindowDisplacesALiveForeignLock$' -count=1 -v 2>&1 | tee ft_commit_window.log
          for want in 'TestForceTakeoverCommitWindowDisplacesALiveForeignLock/foreign_attempt_and_its_lock_committed_inside_the_window'; do
            grep -q -- "--- PASS: $want" ft_commit_window.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); pf_force_takeover's description still says 'except in a narrow commit-window race' with nothing measuring it"; exit 1; }
          done
          for want in 'TestForceTakeoverCommitWindowDisplacesALiveForeignLock/control_only_the_lock_row_committed_inside_the_window_is_refused' \
                      'TestForceTakeoverCommitWindowDisplacesALiveForeignLock/control_a_prior_owner_the_cte_can_see_is_reported_as_replaced'; do
            grep -q -- "--- PASS: $want" ft_commit_window.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); without the controls the window arm is also satisfied by a build whose aihub#393 predicate does nothing, and by an event query that matches nothing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' ft_commit_window.log \
            || { echo "::error::an aihub#451 arm SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#402: GetWorkItem chose ONE column by testing a `wi_` prefix — id if
      # present, slug otherwise — unlike every sibling resolver, which takes the
      # union `id = $1 OR slug = $1`. Project names are validated by
      # ^[a-z][a-z0-9_-]{0,39}$, which does not reserve `wi_`, and slug is
      # project||'#'||seq, so a project named `wi_lab` produced slugs `wi_lab#1`
      # that were looked up in the id column and never found: a 404 for a work
      # item that exists, from every caller of GetWorkItem.
      #
      # The three control arms are not padding. The fix WIDENS the WHERE clause
      # from one column to two, and the failure mode of a widening is matching
      # what it must not — so `control_an_absent_ref_is_still_not_found` is what
      # separates "resolves by id or slug" from "resolves anything at all".
      # Measured 2026-09-07: a mutant replacing the clause with
      # `$1::text IS NOT NULL` reddens exactly that arm and the main one, while
      # the two positive controls stay green.
      #
      # The DB-free half of this policy (no `wi_` prefix dispatch anywhere in
      # non-test Go source, plus a self-test proving that detector still fires)
      # lives in internal/domain/work_item_ref_policy_test.go and runs in the
      # "Unit tests" step above, so it needs no step here.
      - name: aihub#402 work-item id-or-slug resolution DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestGetWorkItemResolvesIDOrSlug$' -count=1 -v 2>&1 | tee wi_ref_resolution.log
          grep -q -- '--- PASS: TestGetWorkItemResolvesIDOrSlug/slug_of_a_wi_prefixed_project_resolves' wi_ref_resolution.log \
            || { echo "::error::the aihub#402 regression arm did not run; a slug whose project is named wi_* is again looked up in the id column and 404s"; exit 1; }
          for want in 'TestGetWorkItemResolvesIDOrSlug/control_canonical_id_still_resolves' \
                      'TestGetWorkItemResolvesIDOrSlug/control_slug_of_an_ordinary_project_still_resolves' \
                      'TestGetWorkItemResolvesIDOrSlug/control_an_absent_ref_is_still_not_found'; do
            grep -q -- "--- PASS: $want" wi_ref_resolution.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); without the controls the regression arm is also satisfied by a resolver that matches every row"; exit 1; }
          done
          ! grep -q -- '--- SKIP' wi_ref_resolution.log \
            || { echo "::error::an aihub#402 arm SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#237: the launcher's update check is shell, so `go test` cannot see
      # it — a silent-pin regression there would ship green. This suite is
      # hermetic (no docker, no network: it stubs gh/curl/binary and drives
      # check_for_update directly), so it is safe to gate on.
      #
      # Deliberately narrow: launcher-bash32, pf-commit-guard, pf-repo-sync,
      # pf-seam-check and pf-skill-router under plugins/polyforge/tests/ are
      # still unwired and are not enabled by this step. launcher-bash32 in
      # particular needs docker and would newly gate PRs, so turning them all on
      # at once belongs in its own change rather than riding along with a bugfix.
      # NOTE (aihub#254): this gap has a cost, now demonstrated — pf-repo-sync
      # regressed session-start latency and shipped with no baseline because no
      # gate covered it. pf-repo-sync.test.sh carries the static assertion that
      # the hook stays `async: true`, and while unwired that guard is advisory:
      # it only runs when someone invokes it by hand.
      # UPDATE (aihub#293): the two using-polyforge suites are no longer in that
      # list — they are wired below. The rest of the sentence still stands.
      # UPDATE (aihub#304): pf-skill-router.test.sh is still unwired, but the
      # router is no longer ungated — internal/cli/skill_router_payload_test.go
      # drives the real hook per routed skill in both engine branches and runs
      # under the "Unit tests" step above, with no -run filter to fall out of.
      # It is Go rather than shell precisely so it cannot become advisory.
      # UPDATE (aihub#305): launcher-channel-url.test.sh is wired below too, and
      # it is the first gate here that touches the network. That was a
      # deliberate trade: the defect it guards (the default download channel
      # pointing at a branch that was never published) is invisible to every
      # hermetic check, because stubbing curl makes any URL succeed. The suite
      # keeps its own positive control so a token or network problem reports as
      # a SKIP rather than masquerading as a missing branch, and the step below
      # then fails on that SKIP rather than passing quietly.
      # UPDATE (aihub#305, second half): launcher-visibility.test.sh is wired
      # below as well. It is hermetic — the thing it gates is what the launcher
      # SAYS when a download fails, which needs no real network, only a failing
      # one.
      # UPDATE (aihub#272): pf-commit-guard.test.sh is wired below as well —
      # hermetic (python3 + `git init` under mktemp). It was the worst one to
      # leave advisory: the guard it covers is the ONLY enforcement of the
      # <undercover> rule, it is a PreToolUse hook so no Go test reaches it, and
      # the defect aihub#272 fixed had been live since the guard shipped. So the
      # unwired list above is now: launcher-bash32, pf-repo-sync, pf-seam-check.
      # UPDATE (aihub#513): pf-skill-router.test.sh is wired below as well, which
      # is what took it off that list. It also corrects the aihub#304 UPDATE above.
      # "It is Go rather than shell precisely so it cannot become advisory" was
      # true of the mechanism and false of the coverage: the Go gates enumerate
      # routed skills OUT OF the hook's own TARGETS dict (routedSkills/routerModes
      # in internal/cli/skill_recall_type_test.go), so deleting a skill from TARGETS
      # shrank them rather than failing them — measured green with "pf-spec"
      # removed. The Go side now carries a literal floor as well
      # (TestRoutedSkills_LiteralFloor); this suite is the half that names pf-spec
      # and pf-plan literally.
      # aihub#249: GET /v1/memories previously parsed only `top_k` (a `?limit=N`
      # caller was silently ignored) and RecallResponse carried no `total`; and
      # GET /v1/memories/:id did not exist at all. These run against the
      # internal/server package (not internal/domain, so no widening-gate
      # concern with that package's other AIHUB_TEST_DB suites) and reuse the
      # same already-migrated Postgres service.
      #
      # Runs with -v and then asserts every case actually reported PASS, rather
      # than trusting the exit code, for the same reason as the DB-test steps
      # above: `go test` exits 0 when every selected test SKIPs, and these all
      # skip whenever AIHUB_TEST_DB is empty.
      - name: aihub#249 recall pagination + get-by-id DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run 'TestHandleRecall_TotalAndLimitAlias|TestHandleGetMemory' -count=1 -v 2>&1 | tee recall_getbyid.log
          for want in TestHandleRecall_TotalAndLimitAlias \
                      TestHandleGetMemory_HappyPath \
                      TestHandleGetMemory_NotFound \
                      TestHandleGetMemory_AuthzDenied_PrivateNotAuthor \
                      TestHandleGetMemory_AuthzDenied_NoProjectAccess \
                      TestHandleGetMemory_AdminSeesPrivate; do
            grep -q -- "--- PASS: $want" recall_getbyid.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#249 DB-gated coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' recall_getbyid.log \
            || { echo "::error::an aihub#249 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#309: handleRecall carried a page-size cap of its own (top_k > 10 ->
      # 10) three lines above its only call to domain.Recall, whose default page
      # size is 20. So asking for a bigger page returned FEWER items than asking
      # for nothing — measured against production 2026-09-01, one filter,
      # total=220 throughout: top_k=30 -> 10 items, top_k unset -> 20, top_k=20 ->
      # 10, top_k=300 -> 10, with no field in the response saying a clamp had
      # happened. The cap also made Recall's 200 ceiling unreachable.
      #
      # This is its own step rather than another name in the aihub#249 -run above
      # for a reason worth keeping: the aihub#249 test seeds 7 rows, so every page
      # size >= 7 returns 7 and its `limit=50` case stayed GREEN for the whole life
      # of the inversion (measured — the cap was restored and that test still
      # passed). Coverage of a topic is not coverage of a contract.
      #
      # The page-size resolution itself, including the negative control that shows
      # the measurement goes red on the pre-change build, is pure and runs on the
      # "Unit tests" step above: internal/domain/memory_topk_test.go
      # (TestNormalizeRecallTopK*). What needs a database is the COMPOSITION — a
      # cap in the handler is invisible to a domain test — so only that hop is here.
      - name: aihub#309 recall top_k inversion DB test
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^(TestHandleRecall_BiggerPageIsNotASmallerPage)$' -count=1 -v 2>&1 | tee recall_topk_inversion.log
          grep -q -- "--- PASS: TestHandleRecall_BiggerPageIsNotASmallerPage (" recall_topk_inversion.log \
            || { echo "::error::TestHandleRecall_BiggerPageIsNotASmallerPage did not run; the aihub#309 handler-to-domain page-size hop is not covered"; exit 1; }
          ! grep -q -- '--- SKIP' recall_topk_inversion.log \
            || { echo "::error::TestHandleRecall_BiggerPageIsNotASmallerPage SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#316: a hung embedding backend must not consume the whole request
      # budget. On 2026-09-01 it did, and three unrelated endpoints returned 500
      # after exactly 30.00s while Postgres answered in 9ms.
      #
      # 🔴 The subtests are asserted INDIVIDUALLY, not just the parent, and the
      # negative control is asserted by name alongside the positive arms. That is
      # the whole point of this step. The graceful fallbacks this wi protects
      # already existed and were already green — a provider that ERRORS proves
      # nothing here, because the error dimension was never the defect. Only a
      # provider that HANGS discriminates, and only against a request deadline
      # sitting between the embedding budget and the hang. If the negative
      # control ever stops running, the positive arms lose their meaning and the
      # parent would still report PASS, which is exactly the shape this gate
      # exists to refuse.
      - name: aihub#316 embedding budget DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^(TestEmbeddingBudget_HangingProviderLeavesRoomForFallback)$' -count=1 -v 2>&1 | tee embedding_budget.log
          # Every pattern ends in " (" — the open paren of Go's duration suffix.
          # Without it these are PREFIXES, and Go prints each descendant under
          # its ancestor's full path, so a child's PASS line silently satisfies
          # its parent's pattern. Measured: with the fix removed, the
          # negative_control subtest FAILED while a prefix grep for it still
          # matched (via .../negative_control:.../Recall_fails). Each name below
          # is the LEAF segment, which is unique within this test and keeps the
          # em-dashes in the group names out of this file.
          for want in "_all_three_fall_back (" \
                      "/Recall_reaches_the_text_path (" \
                      "/ListWorkItems_reaches_the_ILIKE_path (" \
                      "/CreateWorkItem_commits_with_a_NULL_emb_vector (" \
                      "_all_three_fail (" \
                      "/Recall_fails (" \
                      "/ListWorkItems_fails (" \
                      "/CreateWorkItem_fails,_and_blames_the_right_hop (" \
                      "/a_cancelled_request_is_not_reported_as_an_exhausted_deadline (" \
                      "/pool_exhaustion_is_not_blamed_on_the_embedding_provider ("; do
            grep -q -- "--- PASS: TestEmbeddingBudget_HangingProviderLeavesRoomForFallback$want" embedding_budget.log \
              || grep -q -- "--- PASS: .*$want" embedding_budget.log \
              || { echo "::error::'$want' did not report PASS; the aihub#316 budget coverage is not actually executing"; exit 1; }
          done
          # 🔴 And the COUNT, against a literal. Naming the arms individually
          # catches a renamed arm; only a count catches an arm that was deleted
          # outright together with its name here. 11 = 1 parent + 2 groups + 8
          # leaves. Raise it deliberately when adding an arm.
          passes=$(grep -c -- '--- PASS: TestEmbeddingBudget_HangingProviderLeavesRoomForFallback' embedding_budget.log)
          [ "$passes" -eq 11 ] \
            || { echo "::error::expected 11 PASS lines under TestEmbeddingBudget_HangingProviderLeavesRoomForFallback, saw $passes — an arm was added or removed without updating this gate"; exit 1; }
          ! grep -q -- '--- SKIP' embedding_budget.log \
            || { echo "::error::an aihub#316 budget case SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#239: two consistency gaps deferred from aihub#236's review. (1) The
      # supersede path through Remember (pf_save_artifact, or any POST
      # /v1/memories with supersedes_memory_id) did not carry the lineage's
      # activation trio, so #236's guarantee only held for pf_update_memory.
      # (2) Recall orders by two keys (GREATEST(last_activated_at, created_at)
      # DESC, id DESC) but the cursor encoded only the timestamp, so rows tied on
      # reference time and straddling a page boundary were dropped from every
      # later page.
      #
      # Narrow -run rather than AIHUB_TEST_DB on the "Unit tests" step, for the
      # same reason as the DB-test steps above: internal/domain has other
      # AIHUB_TEST_DB-gated suites that would switch on with it and have not been
      # verified here (TestResumeOwnLocks_* in particular is not re-runnable
      # against a database that already holds its lock rows). Reuses the Postgres
      # service already migrated by the goose step above.
      #
      # The cursor CODEC tests (TestRecallCursor_RoundTrip and friends) are pure
      # and already run in "Unit tests"; only the DB-backed cases are listed here.
      #
      # Runs with -v and then asserts every case actually reported PASS rather
      # than trusting the exit code: `go test` exits 0 when every selected test
      # SKIPs, and all of these skip whenever AIHUB_TEST_DB is empty.
      - name: aihub#273 wi semantic-search DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run 'TestHandleListWorkItems_Query' -count=1 -v 2>&1 | tee wi_query.log
          grep -q -- "--- PASS: TestHandleListWorkItems_Query" wi_query.log             || { echo "::error::TestHandleListWorkItems_Query did not run; the aihub#273 DB-gated coverage is not executing"; exit 1; }
          ! grep -q -- '--- SKIP' wi_query.log             || { echo "::error::an aihub#273 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#276 / aihub#277: document→document recall (similar_to=) and the
      # semantic response metadata that replaced the similarity floor nobody can
      # calibrate.
      #
      # These need a real database for a reason no fake can cover: the whole
      # contract is expressed in pgvector's own operators. `similar_to` binds a
      # vector read straight back out of the table as a literal, the source's
      # self-similarity has to come out at EXACTLY 1.0 through `<=>`,
      # `ranked_candidates` is a `count(*) OVER ()` evaluated before LIMIT, and
      # the width guard exists because pgvector raises "different vector
      # dimensions" per row. Every one of those is a statement about what
      # Postgres does, so a stubbed pool would assert the stub.
      #
      # Six PASS assertions rather than one wildcard: `go test` exits 0 when the
      # selected tests all SKIP, so the exit code alone cannot tell "ran and
      # passed" from "AIHUB_TEST_DB never arrived". Naming each one also means
      # deleting a test turns this red instead of quietly shrinking the set.
      - name: aihub#276/#277 wi similar_to + semantic metadata DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run 'TestSimilarTo' -count=1 -v 2>&1 | tee wi_similar_to.log
          for t in \
            TestSimilarTo_RetrievesItselfFirstAtExactlyOne \
            TestSimilarTo_MinSimilarityIsReachableAndDefaultsOff \
            TestSimilarTo_SemanticBlockDistinguishesThePaths \
            TestSimilarTo_FloorMakesAnEmptyVectorPageAuthoritative \
            TestSimilarTo_ProviderOutageWithAFloorIsNotBlamedOnTheCaller \
            TestSimilarTo_RejectionsAreExplicitNeverSilent \
          ; do
            grep -q -- "--- PASS: $t" wi_similar_to.log             || { echo "::error::$t did not report PASS; the aihub#276/#277 DB-gated coverage is not executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' wi_similar_to.log             || { echo "::error::an aihub#276/#277 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#290: exercise the fused step transition (next_step completes one
      # step and starts its successor in a single request) against the same
      # Postgres service, already migrated by the "Apply migrations (aihub#242 DB
      # tests)" step above.
      #
      # These need a real database because the guarantee is transactional, not
      # structural: the successor's start relies on reading the completion's own
      # uncommitted 'idle' inside the same transaction, and the mandatory-record
      # gate (aihub#221) has to keep blocking the successor as well as the
      # completion. Neither is visible without executing the statements.
      #
      # TestHandleUpdateStep_FusedEqualsTwoCalls is the one that matters most: it
      # drives two work items through the same step walk, one fused and one split
      # across the two calls it replaces, and asserts the resulting wi_step_state
      # and step timeline are identical. Fusing is a transport change, so
      # "indistinguishable from what it replaces" is the actual contract.
      #
      # Same -v + grep guard as every DB step above, and for the same reason: `go
      # test` prints "ok" and exits 0 when every selected test SKIPs, and these
      # skip whenever AIHUB_TEST_DB is empty — so without the guard, anything
      # that stops the env var reaching this step restores zero coverage while CI
      # stays green.
      - name: aihub#290 fused step-transition DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run 'TestHandleUpdateStep_(NextStep|FusedEquals|FusedRespects)' -count=1 -v 2>&1 | tee step_fused.log
          for want in TestHandleUpdateStep_NextStepFusesCompleteAndStart \
                      TestHandleUpdateStep_FusedEqualsTwoCalls \
                      TestHandleUpdateStep_NextStepRejectedUnlessCompleted \
                      TestHandleUpdateStep_FusedRespectsMandatoryRecordGate; do
            grep -q -- "--- PASS: $want" step_fused.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#290 DB-gated fusion coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' step_fused.log \
            || { echo "::error::an aihub#290 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#354: exercise the aihub#265 step-history guarantees that only a
      # real database can reach, against the same Postgres service already
      # migrated by the "Apply migrations (aihub#242 DB tests)" step above.
      #
      # Why the DB-free guards in routes_step_authority_test.go do not cover
      # these. Those are static: they read completedStepsQuery's text and
      # CompletedStep's field order. What they cannot see is the handler. Five
      # mutants were measured GREEN on all five gates — build, vet, `go test
      # ./...`, `go test ./...` with a database, and golangci-lint — before this
      # step existed:
      #
      #   * COALESCE(artifact_summary, error_type) in the outer SELECT list; the
      #     live handler then answered one completed step's summary under BOTH
      #     artifact_summary and error_type, and one failed step's error under
      #     both. That is the aihub#354 defect.
      #   * assigning nil instead of truncateCompletedSteps' result, so the wire
      #     carried "completed_steps":null — the third spelling of empty, on a
      #     field whose contract is that [] and absent differ.
      #   * reverting the wi_step_state read to "any error means idle/version 0",
      #     which is byte-identical to "this work item has not started a step".
      #   * reverting the failed-path INSERT's escalated column.
      #   * replacing the history-read 500's fixed message with the pgx error,
      #     which carries relation names and SQLSTATEs to any project VIEWER.
      #
      # Two of those are about a read that FAILS rather than one that returns
      # nothing, so the tests make one fail on purpose: a role denied SELECT on a
      # single table (see newTableDeniedPool). That needs CREATE ROLE and SET
      # ROLE, which the service container's postgres superuser has. It creates
      # no data and drops nothing.
      #
      # Same -v + grep guard as every DB step above, and for the same reason: `go
      # test` prints "ok" and exits 0 when every selected test SKIPs, and these
      # skip whenever AIHUB_TEST_DB is empty — so without the guard, anything
      # that stops the env var reaching this step restores zero coverage while CI
      # stays green.
      - name: aihub#354 step-history behavioural DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^(TestHandleGetStep_EmptyHistoryIsAnEmptyArrayNeverNull|TestHandleGetStep_HistoryReadFailureIsAnErrorNotAnEmptyHistory|TestHandleGetStep_MissingStepStateRowStillReturnsTheHistory|TestHandleGetStep_StepStateReadFailureIsNotReportedAsIdle|TestHandleGetStep_SummaryAndErrorTypeLandInTheirOwnFields|TestHandleUpdateStep_EscalatedSurvivesToTheHistoryRead)$' -count=1 -v 2>&1 | tee step_history.log
          for want in TestHandleGetStep_EmptyHistoryIsAnEmptyArrayNeverNull \
                      TestHandleGetStep_HistoryReadFailureIsAnErrorNotAnEmptyHistory \
                      TestHandleGetStep_MissingStepStateRowStillReturnsTheHistory \
                      TestHandleGetStep_StepStateReadFailureIsNotReportedAsIdle \
                      TestHandleGetStep_SummaryAndErrorTypeLandInTheirOwnFields \
                      TestHandleUpdateStep_EscalatedSurvivesToTheHistoryRead; do
            grep -q -- "--- PASS: $want" step_history.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#354 step-history coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' step_history.log \
            || { echo "::error::an aihub#354 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#390: the wi_step_completions row is what pf_get_step's
      # completed_steps is read from, and handleUpdateStep used to file it
      # best-effort — the INSERT sat inside a SAVEPOINT whose rollback swallowed
      # EVERY error, while the step_completed event, the version bump and the
      # 200 all went ahead. Measured on aihub#383: 7 step_completed events,
      # 6 completed_steps, completed_steps_truncated:false, because one
      # artifact_summary was 4243 characters against the migration's
      # `CHECK (length(artifact_summary) <= 4096)`. The GLOBAL unique index on
      # step_attempt_id and the run_attempt_id foreign key were swallowed the
      # same way.
      #
      # These three need a database for the reason the defect did: the CHECK,
      # the unique index and the FK are the constraints the savepoint hid, so
      # only the real schema exercises the handler's answers to them (413 / 409
      # / 400, nothing committed) and the invariant itself — completed_steps
      # equals the attempt's step_completed/step_failed events — which the
      # first test asserts through handleGetStep after a seven-step walk that
      # includes the 4243-character case. Each was run ALONE on the tree before
      # the fix and FAILED on its intended assertion (the outputs are in
      # aihub#390's record). TestArtifactSummaryCapMatchesTheMigration, the
      # DB-free fourth test that pins the handler's constant to the migration,
      # runs in the unit-test step and needs nothing here.
      #
      # Same -v + grep guard as the steps above: `go test` exits 0 when every
      # selected test SKIPs, and these skip whenever AIHUB_TEST_DB is empty.
      - name: aihub#390 step-history row invariant DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^(TestHandleUpdateStep_EveryRecordedStepOutcomeHasAHistoryRow|TestHandleUpdateStep_ArtifactSummaryAtTheCapIsRecordedAndOverItIsRefused|TestHandleUpdateStep_DuplicateStepAttemptIsAConflictNotASilentDrop)$' -count=1 -v 2>&1 | tee step_history_row.log
          for want in TestHandleUpdateStep_EveryRecordedStepOutcomeHasAHistoryRow \
                      TestHandleUpdateStep_ArtifactSummaryAtTheCapIsRecordedAndOverItIsRefused \
                      TestHandleUpdateStep_DuplicateStepAttemptIsAConflictNotASilentDrop; do
            grep -q -- "--- PASS: $want" step_history_row.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#390 step-history row coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' step_history_row.log \
            || { echo "::error::an aihub#390 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#399 (aihub#403 folded in): the other two ways a step outcome's two
      # records could disagree while the call answered 200.
      #
      # aihub#390 closed the wi_step_completions INSERT and recorded what it did
      # NOT close, which is exactly this: (a) the INSERT was still reached only
      # `if req.StepAttemptID != nil`, so a completed/failed request that omitted
      # step_attempt_id filed no history row while the state change, the
      # step_completed/step_failed event and the 200 all went ahead — the field
      # the MCP schema has called "required for completed/failed" since
      # aihub#265; and (b) the events side, where every step event was emitted
      # inside its own `SAVEPOINT bp` whose ROLLBACK discarded the error, so the
      # same invariant could break from the other direction: history row written,
      # timeline entry gone, 200 answered.
      #
      # These three need a database for the reason the defects do. (a) is only
      # visible as a disagreement between two tables. (b)'s two reachable causes
      # are constraints, measured on pgvector/pgvector:pg18 (PostgreSQL 18.6,
      # this job's own image) with these migrations applied:
      # run_attempt_id='' violates agent_events_run_attempt_id_fkey (23503)
      # while NULL is accepted, and payload::jsonb rejects a NUL byte with 22P05
      # ("unsupported Unicode escape sequence ... cannot be converted to text").
      # Nothing short of the real schema raises either.
      #
      # Three FUNCTIONS, by the aihub#143 entry's reasoning: three independent
      # claims — refusing a terminal transition with no (or a blank)
      # step_attempt_id, refusing one whose timeline event cannot be written, and
      # RECORDING the event of an attempt-less transition with a NULL attempt
      # rather than newly refusing a shape that answered 200 before. Each was run
      # ALONE on the tree before the fix and FAILED on its intended assertion,
      # and each was additionally isolated by a single-mutation probe with the
      # other thirteen TestHandleUpdateStep_* tests as negative controls: the
      # outputs are in aihub#399's record. Two DB-free companions — the server's
      # TestValidateTerminalStepArgs and the MCP layer's
      # TestValidateTerminalStepArgs_MCP plus
      # TestUpdateStepRefusesATerminalCallWithNoStepAttemptIDBeforeTheRoundTrip —
      # run in the unit-test step and have no line in the manifest; the probe
      # that deletes the handler's call site leaves all of them green, which is
      # why the three below are not redundant with them.
      #
      # Same -v + grep guard as the steps above: `go test` exits 0 when every
      # selected test SKIPs, and these skip whenever AIHUB_TEST_DB is empty.
      - name: aihub#399 step outcome record completeness DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^(TestHandleUpdateStep_TerminalWithoutStepAttemptIDIsRefused|TestHandleUpdateStep_TimelineEventIsRecordedOrTheRequestIsRefused|TestHandleUpdateStep_AttemptlessStepEventIsRecordedWithANullAttempt)$' -count=1 -v 2>&1 | tee step_outcome_records.log
          for want in TestHandleUpdateStep_TerminalWithoutStepAttemptIDIsRefused \
                      TestHandleUpdateStep_TimelineEventIsRecordedOrTheRequestIsRefused \
                      TestHandleUpdateStep_AttemptlessStepEventIsRecordedWithANullAttempt; do
            grep -q -- "--- PASS: $want" step_outcome_records.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#399 step-outcome record coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' step_outcome_records.log \
            || { echo "::error::an aihub#399 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#398 (step 1 of two): the step-IDENTITY predicate on a terminal
      # transition — and the boundary with the STATE predicate, which is
      # deliberately not in it.
      #
      # The defect these cover is a history corruption that answered 200.
      # handleUpdateStep filed the wi_step_completions row under the STORED
      # current_step, never under the request's step_id, and nothing required
      # the two to agree — so a completed/failed transition naming any other
      # step recorded the wrong step as finished, emitted an event naming the
      # caller's step, and then overwrote current_step with the caller's value.
      # pf_get_step's completed_steps is the done-set aihub#265 tells a
      # resuming agent to trust, so the resumer skipped a step that never ran
      # and redid the one that did. On a fused advance a stale actor also
      # destroyed the in_progress successor.
      #
      # Two FUNCTIONS, by the aihub#143 entry's reasoning: two independent
      # claims, and the probes separate them. The first is the predicate plus
      # the row's source, and it needs both halves — deleting the predicate's
      # call site reddens it, and so does reverting the row's step_id to the
      # stored value (that probe reddens ONLY its never-started arm, which is
      # the one place the two sources differ). The second is which guard
      # catches which double-complete: a retry with the SAME step_attempt_id is
      # still aihub#399's duplicate index, a late actor with a different id
      # after the graph advanced is this predicate, and a second completion of
      # an idle step whose name still matches is STILL ACCEPTED — that last arm
      # asserts the residual on purpose, because it is the boundary with step 2
      # and an unasserted comment about a known hole rots. When the state
      # predicate lands, that arm goes red and says so in its failure message.
      #
      # They need a database because every claim is a disagreement BETWEEN
      # records (history row vs event vs wi_step_state) that the handler used to
      # answer 200 for; the DB-free companion (server TestValidateStepIdentity)
      # checks the predicate function alone, stays GREEN under the
      # deleted-call-site probe, and has no line in the manifest. The MCP-layer
      # companions for the same work item's wording half
      # (TestUpdateStepSchemaDoesNotPromiseALease,
      # TestUpdateStepSchemaNamesBothPredicatesAndTheGapBetweenThem,
      # TestUpdateStepSchemaStaysWithinItsWireBudget) need no database either
      # and run in the unit-test step.
      #
      # Same -v + grep guard as the steps above: `go test` exits 0 when every
      # selected test SKIPs, and these skip whenever AIHUB_TEST_DB is empty.
      - name: aihub#398 step identity predicate DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^(TestHandleUpdateStep_TerminalStepIdMustMatchTheStoredCurrentStep|TestHandleUpdateStep_DoubleCompleteIsCaughtByWhicheverGuardApplies)$' -count=1 -v 2>&1 | tee step_identity.log
          for want in TestHandleUpdateStep_TerminalStepIdMustMatchTheStoredCurrentStep \
                      TestHandleUpdateStep_DoubleCompleteIsCaughtByWhicheverGuardApplies; do
            grep -q -- "--- PASS: $want" step_identity.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#398 step-identity coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' step_identity.log \
            || { echo "::error::an aihub#398 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#442, and this step is REMEDIAL: the tests it runs landed in
      # main with fee1ca6 (PR #396) without their manifest lines and without a
      # step, so the aihub#303 gate went red on main itself and on every PR's
      # merge ref. Both halves of that gate were failing — 233 entries against
      # an inventory of 236, and "3 gated test functions executed by NO CI step,
      # so they SKIP forever and CI stays green", which is precisely the
      # condition the gate exists to catch. It caught it. What was missing was
      # this step and those three lines, added here (aihub#451) because that wi
      # held the lock on both files.
      #
      # THE DB IS THE POINT for the first two, and in opposite directions. The
      # heartbeat's UPDATE is keyed on work_item_id, so on a work item with no
      # wi_step_state row it matches ZERO rows and returns NO error — a
      # nil-pool unit test cannot tell that from a successful write, and the
      # handler used to answer "heartbeat_ok" either way. FnClaimWorkItem's
      # wi_step_state upsert is deliberately non-fatal, so that state is
      # reachable in production, not contrived. The other arm needs a real
      # failing write for the same reason: `_, _ = pool.Exec(...)` discarded it.
      # Both are asserted from the DATABASE as well as from the response, since
      # a response field echoing a constant would satisfy the response half on
      # its own.
      #
      # All three in one -run: they are one file and one branch of
      # handleUpdateStep, and the third (a heartbeat carrying a step_id or
      # status it silently drops) is the aihub#290 "do not accept a parameter
      # you do not act on" rule applied to the same request path.
      - name: aihub#442 heartbeat write and dropped-argument DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^TestHandleUpdateStep_Heartbeat(DBFailureIsReportedNotDiscarded|DisclosesTheArgumentsItDrops|ReportsWhetherItRefreshedAnything)$' -count=1 -v 2>&1 | tee step_heartbeat.log
          for want in TestHandleUpdateStep_HeartbeatReportsWhetherItRefreshedAnything \
                      TestHandleUpdateStep_HeartbeatDBFailureIsReportedNotDiscarded \
                      TestHandleUpdateStep_HeartbeatDisclosesTheArgumentsItDrops; do
            grep -q -- "--- PASS: $want" step_heartbeat.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the heartbeat can again report a refresh it never made, discard a failed step_started_at write, or drop a step_id it was sent without saying so"; exit 1; }
          done
          ! grep -q -- '--- SKIP' step_heartbeat.log \
            || { echo "::error::an aihub#442 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#396. THE point of running this against a real database: the checks
      # it asserts run before any query, so a nil-pool unit test could prove the
      # 400 — but not that the answer USED to be a 500. On the pre-fix tree these
      # arms return, verbatim,
      #
      #   500 INTERNAL_ERROR failed to insert work_item: ERROR: new row for
      #   relation "work_items" violates check constraint
