name: Publish Bins

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for pushing to bins-* branches

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe --tags --always to find previous tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # aihub#305: `bins-dev` is the only channel any client reads. The launcher
      # (plugins/polyforge/bin/polyforge-mcp.sh) no longer accepts `stable` as a
      # channel name and maps the legacy value onto dev.
      #
      # The tag branch below is kept because it is the seed of a real, tag-gated
      # release channel — but be clear about what it does TODAY: pushing a `v*`
      # tag creates `bins-stable`, and nothing downloads from it. Do not read
      # "we publish a stable channel" off this step. `bins-stable` has in fact
      # never been created: this workflow landed one day AFTER the repo's only
      # tag (v1.0.0, 2026-05-25), so that tag never triggered it, and no tag has
      # been pushed since. That is the whole of aihub#305 — the launcher
      # defaulted to a branch this step had never produced.
      #
      # Restoring `stable` as a channel means re-teaching the launcher the name
      # at the same time; changing only this side republishes into the void.
      - name: Determine channel
        id: channel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            echo "channel=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build all arches (sequential, CGO_ENABLED=0 required for cross-compilation)
        run: |
          SHA=$(git rev-parse HEAD)
          # Use full 40-char SHA (not --short) so polyforge-mcp.sh can do exact version comparison
          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/GMISWE/ieops-aihub/internal/version.GitCommit=${SHA} -X github.com/GMISWE/ieops-aihub/internal/version.Version=${VERSION} -X github.com/GMISWE/ieops-aihub/internal/version.BuildTime=${NOW}"
          mkdir -p dist/bin
          # Build targets sequentially — do NOT use matrix here; parallel force-pushes to the
          # same orphan branch would race and corrupt its history.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            # CGO_ENABLED=0 is required for cross-compilation; cgo cannot link foreign libc at build time
            GOOS=${GOOS} GOARCH=${GOARCH} CGO_ENABLED=0 \
              go build -ldflags "${LDFLAGS}" \
              -o dist/bin/polyforge-${GOOS}-${GOARCH} \
              ./cmd/polyforge/
          done
          # Store full 40-char SHA for version comparison in polyforge-mcp.sh
          echo "${SHA}" > dist/bin/version.txt
          ls -la dist/bin/

      - name: Log previous bins branch HEAD (rollback reference)
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          OLD_SHA=$(git ls-remote origin "refs/heads/bins-${CHANNEL}" | awk '{print $1}')
          [ -z "${OLD_SHA}" ] && OLD_SHA="none (branch does not exist yet)"
          echo "### Rollback reference" >> $GITHUB_STEP_SUMMARY
          echo "Previous \`bins-${CHANNEL}\` HEAD: \`${OLD_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "To rollback: \`git push --force origin ${OLD_SHA}:refs/heads/bins-${CHANNEL}\`" >> $GITHUB_STEP_SUMMARY

      - name: Publish to bins-{channel} orphan branch
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          git config user.email "ci@gmi.com"
          git config user.name "CI"
          # Capture HEAD SHA before switching branches
          COMMIT_SHA=$(git rev-parse HEAD)
          # Create orphan branch — MUST immediately run git rm -rf . to prevent
          # the source tree from being committed into the bins-* branch
          git checkout --orphan "bins-${CHANNEL}"
          git rm -rf .
          mkdir -p bin
          cp dist/bin/* bin/
          git add bin/
          git commit -m "publish: ${COMMIT_SHA} [${CHANNEL}]"
          git push --force origin "HEAD:refs/heads/bins-${CHANNEL}"

      # aihub#181: there is deliberately no "notify aihub" step here. One used to
      # exist and curled `PUT ${AIHUB_URL}/v1/binary` — an endpoint the server has
      # never registered (zero PUT routes exist anywhere in this repo), wrapped in
      # continue-on-error plus `|| echo "aihub notify failed (non-blocking)"`, so
      # every publish printed one calm line instead of surfacing a 404.
      #
      # Nothing consumed such a record: the launcher reads the published version
      # straight from raw.githubusercontent.com/.../bins-<channel>/bin/version.txt
      # (plugins/polyforge/bin/polyforge-mcp.sh), so the orphan branch pushed above
      # IS the channel state. Adding the notification back means implementing the
      # endpoint first — internal/citest/wfroutes now fails the build if a workflow
      # calls an aihub route the router does not serve.
