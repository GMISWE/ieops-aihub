      # database can say is the ROW COUNT, and the row count is the whole claim of
      # that work item: "a wi declaring a repo serialises every other wi on that
      # repo" was a statement about resource_locks.
      #
      # ⚠️ THE MIGRATION ARM MUTATES THE SHARED DATABASE, and it is placed here
      # deliberately rather than anywhere convenient. TestDeLockingMigration0038
      # AndRepoPins executes the Up body of 0038 read out of the real file, which
      # DELETEs every git_branch/deploy_env row in the database — including any a
      # neighbouring step's fixture left behind. That is harmless for the steps
      # ABOVE (each finishes before the next starts) and for the steps BELOW
      # (aihub#239 onwards touch memory and recall, not locks). Do NOT move a
      # lock-fixture step after this one without re-reading that sentence.
      #
      # Running the file rather than a transcription of it is the point: a copy
      # pasted into the test would keep passing after somebody edited the real
      # migration, and the migration's content IS acceptance criterion AC-19.
      #
      # The last eight want-list entries are a back-fill (aihub#508, 2026-09-09).
      # aihub#510 added five arms under `a work item that names itself…` and
      # aihub#511 three under `declared names that look like json…`, both as
      # subtests of an already-registered DB-gated function — so neither moved
      # gated_tests.txt, neither needed a new step, and both landed with this
      # list untouched. Nothing was wrong: the list is one-directional, and no
      # gate reads the other way (an unasserted subtest is invisible here). They
      # are written down now because the aihub#508 check proves these eight
      # paths exist, which is the half that used to rot silently.
      - name: aihub#416 de-locking DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
