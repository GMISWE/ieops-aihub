      # │  2. A branch goes wrong by standing still: the number is only      │
      # │     right relative to the main it was measured against, so every   │
      # │     sibling landing invalidates it. aihub#314 was re-measured      │
      # │     twice; either earlier value would have walked the ratchet      │
      # │     BACKWARDS while looking like a normal delta line.              │
