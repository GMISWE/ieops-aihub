          for want in TestE2EReinforceMemoryWorkItemIDReachesTheGate \
                      TestE2EReinforceMemoryRejectsAMismatchedWorkItem; do
            grep -q -- "--- PASS: $want (" reinforce_wi_e2e.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#325 work_item_id fix is not actually verified end to end"; exit 1; }
          done
          ! grep -q -- '--- SKIP' reinforce_wi_e2e.log \
            || { echo "::error::an aihub#325 E2E test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#586: the unpublished `rendered_html` argument used to ride
      # pf_remember's wholesale-forwarded argument map into
      # RememberRequest.RenderedHTML and be stored verbatim for any type, so
      # `visibility: public` plus a name no schema publishes produced an
      # anonymously /share-readable row. The strip (owner ruling 2026-09-10,
      # option ②) closes that at the tool boundary; the fake-backed arms in
      # remember_wire_shape_test.go and wire_strip_family_test.go hold the wire
      # and the disclosure, and only this test can hold the two live surfaces —
