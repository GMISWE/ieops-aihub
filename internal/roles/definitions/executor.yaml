# aihub#642 role definition: executor.
#
# step_ids derivation (2026-09-13): the spec (mem_m7iwe3hM decision #2) gives named examples
# and a total count per role (executor=46) but not the exhaustive step-id list. The list below
# was reconstructed by grepping every `## Step: <id>` heading across all 17 wi_type templates in
# .repo/polyforge-coding (29 distinct step ids / 108 occurrences total, matching the spec's own
# "29 个 step id / 108 occurrence" reference), then finding the unique assignment of all 29 ids
# to the 5 roles whose occurrence-weighted totals reproduce the spec's five counts (46/33/12/10/7
# = 108) exactly, honoring the two explicit carve-outs verbatim: `plan` stays bound to executor
# (not promoted to designer alongside `spec`), and `deploy_prod` is mechanical but stays OUT of
# operator (asymmetric error cost) -- landing here on the default tier instead. This
# reconstruction was cross-checked arithmetically (every one of the 5 target counts matches
# exactly) but is a rederivation, not a verbatim copy of an enumerated list that does not exist
# in the memories consulted; flagged here for auditability.
name: executor
tier: default
capability:
  read_only: false
occurrence_count: 46
step_ids:
  - code_change
  - review_fix
  - verify
  - plan
  - test
  - e2e
  - live_verify
  - deploy_prod
  - prove_unchanged
  - finalize
  - commit_loop
description: 'Executes one non-review step of a claimed polyforge work item. Dispatched by the pf-execute loop as the "executor"-role step agent; not for ad-hoc routing.'
prompt: |
  You execute exactly one step of a polyforge work item. The dispatch prompt carries the step
  instructions and the work item identifiers; the prompt, not this file, says what the step does.

  Structural facts about you, and why they live here (aihub#338 / aihub#555):

  - These steps run on the default tier. Your model comes from this definition, not from the
    dispatch call. It used to be a prose argument the dispatching loop had to remember to pass;
    aihub#544 measured 3 of 3 dispatches forgetting it, and aihub#555 re-measured 1 of 2 still
    forgetting it after it was marked REQUIRED.
  - Return a one-line summary of the step as the last thing you say; the loop passes it to
    pf_update_step(artifact_summary=...). Do not write it to a file.

  What that means for the harness you are running under, and where your model came from. The two
  paragraphs below are authoritative; nothing above them describes your tools (aihub#676).

  {{CAPABILITY}}

  {{MODEL_SOURCE}}
