name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: aihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 -race ./...
        # Note: integration tests require docker-compose; run locally: cd tests/integration && make test
        # AIHUB_TEST_DB is deliberately NOT set here — see the "aihub#242
        # dependency-requeue DB tests" step below for why.

      # aihub#303: the step above leaves every AIHUB_TEST_DB-gated test SKIPped,
      # by design. The real DB coverage is therefore exactly the union of the
      # `-run` regexes on the steps below that DO set the variable — and a test
      # whose name falls outside that union runs NOWHERE, forever, while `go
      # test` prints "ok" and exits 0.
      #
      # That is not hypothetical. Each number below is over a stated set, and
      # each one is derived from the line before it — an earlier draft of this
      # comment added the EMBEDDING pair to a total that already excluded it and
      # still landed on the right answer by coincidence, which is exactly the
      # kind of arithmetic that rots without anything going red:
      #
      #   85  AIHUB_TEST_DB-gated test functions in the repo (the whole set:
      #       every function that SKIPped naming the variable)
      #   -2  also need EMBEDDING_BASE_URL, which CI has no service for, so
      #       dbtestcov excludes them and requires that no step name them
      #   =83  require only a database — the set every step below is judged over
      #   -55  were already named by some step's `-run` before this branch
      #   =28  ran NOWHERE, on every CI run since the day they were written
      #
      # Those 28 split into the two steps that now execute them: 26 (23 in
      # internal/domain, 3 in internal/server) in "aihub#303 previously
      # CI-invisible DB tests" at the bottom of this job, plus the 2 in
      # internal/mcp in "aihub#281 wi-content echo E2E DB tests". Re-measure by
      # deleting those two steps and re-running this gate; do not read 28 as a
      # property of the code.
      #
      # The 3 in internal/server sit in routes_step_test.go — the file that
      # defines the seed helpers the COVERED tests reuse: proof that a name
      # regex stops at the edge of its alternation even inside a file it is
      # already selecting from.
      #
      # Not a one-off count, either: this gate went red on its own pull request
      # the moment aihub#281 landed the internal/mcp pair on main with no `-run`
      # naming them — found by the gate, not by anyone remembering.
      #
      # This step recomputes the difference on every run instead of trusting a
      # checked-in list, because a checked-in list of "the DB tests" would rot
      # exactly as silently as the gap it describes.
      #
      # What counts as DB-gated is measured, not inferred: the inventory is a
      # `go test ./...` run with AIHUB_TEST_DB explicitly unset, and a test is
      # DB-gated iff it SKIPped and its own skip message names that variable. So
      # there is no list of guard helpers to keep in sync. The message IS a
      # convention, and wording it wrongly is the cheapest way to make this gate
      # go quiet — cheaper than fixing the coverage — so dbtestcov also audits
      # the SOURCE for every way that guard can be written to leave the count
      # unmoved: an env read in a bool-returning helper, os.LookupEnv, a
      # constant or concatenated variable name, a bare `return` instead of a
      # skip, a TestMain gate, a build tag, a guard living in a non-test file,
      # and the read sitting in a package-level var or a func literal bound to
      # one. It audits ci.yml the same way, because a `go test` line that is
      # quoted, commented, inside a heredoc, inside an `if`, or trailed by
      # `|| true` is credited as coverage by anything that reads lines instead
      # of modelling the shell. See internal/citest/dbtestcov/main.go. Note
      # what all of those have in common: none of them changes the gated count,
      # so -min-gated below cannot substitute for any of them.
      #
      # `env -u` rather than merely omitting an env: block, so that adding a
      # job-level AIHUB_TEST_DB later cannot silently turn this into a green
      # no-op (with the variable set, nothing SKIPs, the inventory is empty and
      # every check below passes vacuously). -min-gated is the second guard on
      # the same failure, pinned to the measured count: raise it when you add DB
      # tests, lower it only when you deliberately remove one.
      #
      # Since then -min-gated has moved, and each delta is recorded rather than
      # folded into the derivation above — that block is the record of aihub#303's
      # own measurement, and rewriting it would destroy the audit it exists to be.
      # The bases below are therefore the value at the time, not always 85:
      #
      #   86 -> 102 aihub#266 added 16 DB-gated functions in internal/domain
      #             (gc_alert_idempotency_db_test.go, all named
      #             TestAlertSweep_*), executed by the "aihub#266 GC alert-sweep
      #             idempotency DB tests" step below. The gate found them itself:
      #             it went red on this branch, listing every one of them as
      #             executed by no step, before that step existed.
      #
      #   102 -> 103 aihub#311 added 1 DB-gated function in internal/domain
      #             (TestRecallPositiveControl_Live in
      #             memory_vector_integration_test.go). It also needs
      #             EMBEDDING_BASE_URL, so it joins the excluded pair rather
      #             than the required set: excluded goes 2 -> 3 and the required
      #             count stays 100, which is why no new CI step accompanies it.
      #             It is the reporter's acceptance assertion for aihub#311 and
      #             is expected to be RED against a real endpoint; CI has
      #             pgvector but no embedding service, so CI never runs it.
      #
      #   103 -> 104 aihub#316 added 1 DB-gated function in internal/domain
      #             (TestEmbeddingBudget_HangingProviderLeavesRoomForFallback in
      #             embedding_budget_integration_test.go). Unlike aihub#311's, it
      #             needs only a database — its hanging provider is a fake, not a
      #             live endpoint — so it joins the REQUIRED set: 100 -> 101, and
      #             it does need a new step ("aihub#316 embedding budget DB
      #             tests"). Measured, not predicted: the gate was run locally
      #             exactly as it runs here and printed
      #             `104 (require only a DB: 101, need extra env: 3)` with that
      #             one function listed as executed by no step, before the step
      #             existed.
      #
      #   104 -> 121 aihub#260 added 17 DB-gated functions across three packages:
      #             8 in internal/domain (projects_members_cas_db_test.go, all
      #             named TestUpdateProjectMembersCAS*), 5 in internal/server
      #             (routes_projects_cas_db_test.go, all named
      #             TestProjectMembersVersionHTTP*) and 4 in internal/mcp
      #             (project_members_cas_e2e_db_test.go, named
      #             TestProjectMembersCAS*). A fifth function in that last file,
      #             TestProjectMembersCASToolSchemaAdvertisesMembersVersion,
      #             reads the advertised tool schema and needs no database, so it
      #             is NOT one of the 17 — but the -run regex below does select
      #             it, which is why that step asserts 5 passes in internal/mcp
      #             and not 4. All 17 need only a database, so the required set
      #             goes 101 -> 118 and they do need a new step ("aihub#260
      #             project members CAS DB tests").
      #             Measured, not predicted, and measured TWICE: first before the
      #             0032 migration existed, then again on the tree as it will
      #             merge (migration applied, database rebuilt from zero). Both
      #             runs printed
      #             `121 (require only a DB: 118, need extra env: 3)` with all 17
      #             listed as executed by no step, before the step existed.
      #             The `104` this starts from was re-read off origin/main
      #             (4c1e726) at the moment this line was written, not recalled
      #             from earlier in the session — see aihub#320 on why a stale
      #             "from" value survives auto-merge while destroying the audit.
      #
      #   121 -> 126 aihub#148 added 5 DB-gated functions: 2 in internal/server
      #             (routes_memory_similarity_threshold_db_test.go, named
      #             TestHandleRecall_SimilarityThreshold*, hops 3 and 4 of
      #             pf_recall's similarity_threshold) and 3 in internal/mcp
      #             (recall_threshold_e2e_db_test.go, named TestE2ERecall*, all
      #             four hops through the real router, client and MCP handler).
      #             The hop-1/hop-2 halves of the same guard are in
      #             recall_params_wiring_test.go and recall_wire_query_test.go
      #             and need no database, so they are NOT among the 5 — they run
      #             in "Unit tests" like any other test. All 5 need only a
      #             database (the embedding provider is internal/citest/
      #             embedprobe, a deterministic offline fake with known cosines,
      #             not a live endpoint), so the required set goes 118 -> 123 and
      #             they do need a new step ("aihub#148 pf_recall
      #             similarity_threshold DB tests").
      #             Measured, not predicted, and measured on the tree AFTER
      #             merging origin/main at 58e67b3 rather than on the older base
      #             this branch started from: the gate was run locally exactly as
      #             it runs here and printed
      #             `126 (require only a DB: 123, need extra env: 3)` with all 5
      #             listed as executed by no step, before the step existed. The
      #             `121` this starts from was read off the merged tree, not
      #             carried over from the branch's own earlier measurement of
      #             104 -> 109, which was taken before aihub#260 landed.
      #
      #   126 -> 128 aihub#314 added 2 DB-gated functions in internal/mcp
      #             (TestE2ERequestAdjustedDisclosesListLimitClamp and
      #             TestE2ERequestAdjustedDisclosesRecallTopKCap in
      #             request_adjusted_e2e_db_test.go). Both need only a database —
      #             they stand the real router up in-process, like aihub#281's
      #             pair — so the required set goes 123 -> 125 and they do need a
      #             new step ("aihub#314 request_adjusted disclosure E2E DB
      #             tests").
      #             Measured, not predicted, and RE-measured twice as this branch
      #             was rebased under two landings. Its own earlier runs printed
      #             `106` (before aihub#260) and `123` (before aihub#148); BOTH
      #             are now wrong, and either one written here would have walked
      #             the ratchet BACKWARDS while looking like a normal delta line —
      #             by 20 and by 3 respectively. That is the aihub#320 failure the
      #             aihub#260 entry above warns about, arriving from the other
      #             direction: a stale "to" rather than a stale "from", and a
      #             branch can grow one just by sitting still. On the tree AFTER
      #             merging origin/main at 7cb982f, database rebuilt from zero
      #             through 0032, the gate printed
      #             `128 (require only a DB: 125, need extra env: 3)` with both
      #             functions listed as executed by no step, before the step
      #             existed. 126 + 2 = 128 happens to agree; the 128 written below
      #             is the measurement, not the sum.
      #
      #   130 -> 131 aihub#334 added 1 DB-gated function in internal/domain
      #             (TestSerializationFailureSurfacesAsRetryable409 in
      #             serialization_failure_db_test.go). It carries FIVE arms —
      #             three instances of the defect, one that is reachable today
      #             on pf_claim_work_item, and a READ COMMITTED control — as
      #             SUBTESTS of one function rather than five functions, because
      #             this gate counts functions and five would move the ratchet
      #             five times for one guard. The step below therefore asserts
      #             `--- PASS:` on each subtest name, which is where the real
      #             per-instance coverage claim lives. It needs only a database
      #             (the races are real backends contending over real rows; no
      #             embedding service), so the required set goes 128 -> 129 and
      #             it does need a new step ("aihub#334 serialization-failure
      #             mapping DB tests").
      #             Measured, not predicted, and NOT computed as "130 plus the
      #             one I added" — arithmetic that lands on the right answer is
      #             how this log rots. Taken on a throwaway clone outside the
      #             task worktree, on the tree formed by merging origin/main at
      #             761ac3b into this branch at 9f0d74e (merge 65a8841),
      #             database untouched because the inventory run sets no
      #             AIHUB_TEST_DB. The gate printed, verbatim:
      #               dbtestcov: AIHUB_TEST_DB-gated test functions: 131
      #                 (require only a DB: 128, need extra env: 3)
      #               dbtestcov: covered by a CI step: 128/128
      #             The `130` this starts from is the value on that same
      #             origin/main, read off the merged tree.
      #             ⚠️ origin/main moved TWICE while this branch was being
      #             written (9a32bac -> af274ad -> 761ac3b, both siblings'
      #             landings). If it gains further DB tests before this merges,
      #             this line is a FLOOR and stays valid; but the line itself
      #             conflicts textually with main's 130, and the resolution is
      #             to re-run the gate on the merged tree rather than to pick
      #             the larger number.
      - name: aihub#303 DB-test coverage gate
        run: |
          set -o pipefail
          inventory=$(mktemp)
          if ! env -u AIHUB_TEST_DB go test ./... -count=1 -json > "$inventory"; then
            echo "::error::the DB-free inventory run failed, so DB-test coverage cannot be audited; fix the failing tests first (the 'Unit tests' step above runs the same set)"
            # `|| true`: a build failure produces no "fail" action at all, and a
            # no-match grep under `set -e -o pipefail` would abort here and
            # swallow the explicit exit below.
            grep -F -e '"Action":"fail"' -e '"Action":"build-fail"' "$inventory" | head -20 || true
            exit 1
          fi
          go run ./internal/citest/dbtestcov \
            -inventory "$inventory" \
            -workflow .github/workflows/ci.yml \
            -min-gated 131

      # aihub#242: exercise the DeleteDependency requeue regression (Change A)
      # against the real Postgres service already started for this job, which
      # the "Unit tests" step above leaves unused (AIHUB_TEST_DB unset there).
      #
      # Deliberately scoped to `-run 'TestDeleteDependency'` rather than
      # setting AIHUB_TEST_DB on the "Unit tests" step: this domain package has
      # several other AIHUB_TEST_DB-gated suites (memory ranking, cross-project
      # resume, conflict prediction, ...) that would also switch on if the var
      # were set package-wide, and this change did not verify those pass —
      # widening the gate here could newly fail CI for unrelated reasons. This
      # step applies migrations itself (setupLatestTestDB in
      # memory_latest_test.go assumes an already-migrated DB, it does not
      # migrate) via goose, matching tests/integration/Makefile's `seed` target.
      - name: Apply migrations (aihub#242 DB tests)
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        # `go run` (rather than `go install` + bare `goose`) sidesteps relying
        # on $(go env GOPATH)/bin being on PATH in this job.
        run: go run github.com/pressly/goose/v3/cmd/goose@latest -dir internal/db/migrations postgres "$AIHUB_TEST_DB" up

      # Runs with -v and then asserts both cases actually reported PASS, rather
      # than trusting the exit code. `go test` prints "ok" and exits 0 when
      # every selected test SKIPs, and setupLatestTestDB skips whenever
      # AIHUB_TEST_DB is empty — so without this guard, anything that stops the
      # env var from reaching this step (a rename, a moved job, an edited env
      # block) would silently restore the zero-coverage state these steps exist
      # to fix, while CI stayed green. The guard converts that silent
      # regression into a hard failure.
      - name: aihub#242 dependency-requeue DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestDeleteDependency' -count=1 -v 2>&1 | tee dep_requeue.log
          for want in TestDeleteDependency_LastBlockerRemoved_Requeues \
                      TestDeleteDependency_OtherBlockerRemains_StaysBlocked; do
            grep -q -- "--- PASS: $want" dep_requeue.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated requeue coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' dep_requeue.log \
            || { echo "::error::a TestDeleteDependency case SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#241: exercise the declared_resources compare-and-set (CAS) fix
      # against the same Postgres service, already migrated by the "Apply
      # migrations (aihub#242 DB tests)" step above — reused here rather than
      # running goose a second time.
      #
      # Deliberately scoped to `-run 'TestUpdateWorkItemCAS'` rather than
      # setting AIHUB_TEST_DB on the "Unit tests" step: this domain package has
      # several other AIHUB_TEST_DB-gated suites (memory ranking, cross-project
      # resume, conflict prediction, the aihub#242 requeue tests, ...) that
      # would also switch on if the var were set package-wide, and this change
      # did not verify those pass — widening the gate here could newly fail CI
      # for unrelated reasons.
      #
      # Runs with -v and then asserts all three cases actually reported PASS,
      # rather than trusting the exit code. `go test` prints "ok" and exits 0
      # when every selected test SKIPs, and setupLatestTestDB skips whenever
      # AIHUB_TEST_DB is empty — so without this guard, anything that stops the
      # env var from reaching this step (a rename, a moved job, an edited env
      # block) would silently restore the zero-coverage state these tests
      # exist to fix, while CI stayed green. The guard converts that silent
      # regression into a hard failure.
      - name: aihub#241 declared_resources CAS DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestUpdateWorkItemCAS' -count=1 -v 2>&1 | tee wi_cas.log
          for want in TestUpdateWorkItemCASVersionAdvancesAcrossWrites \
                      TestUpdateWorkItemCASStaleVersionReturns409NotBadRequest \
                      TestUpdateWorkItemCASCorrectVersionSucceedsAndAdvances; do
            grep -q -- "--- PASS: $want" wi_cas.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated CAS coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' wi_cas.log \
            || { echo "::error::a TestUpdateWorkItemCAS case SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#260: exercise the projects.members compare-and-set — the same
      # pattern as the aihub#241 step above, applied to the other whole-list
      # REPLACE column, against the same already-migrated Postgres service.
      #
      # Three packages rather than one, because the defect this guards is not
      # "the domain function is wrong" but "the precondition never reaches the
      # domain function". members_version has to survive the MCP tool schema,
      # the MCP handler's body construction, pkg/client, and echo's binder; a
      # parameter that exists in the schema and is dropped one hop later is
      # indistinguishable at the call site from a guard that passed. So each hop
      # gets its own step-visible assertion here, not just the innermost one.
      # (pkg/client's two cases need no database and run in "Unit tests".)
      #
      # Scoped with -run rather than by setting AIHUB_TEST_DB on the "Unit
      # tests" step, for the same reason as every step above: these packages
      # hold other AIHUB_TEST_DB-gated suites that would switch on with it and
      # that this change did not verify.
      #
      # Named one by one rather than counted, matching the aihub#241 step: a
      # count stays green when a test is renamed away and a different one takes
      # its place, which is exactly how coverage evaporates quietly. The
      # `--- SKIP` guard is the second half — `go test` prints ok and exits 0
      # when every selected test skips, and all of these skip whenever
      # AIHUB_TEST_DB is empty.
      #
      # ONE SKIP guard PER invocation, each naming exactly one log. A single
      # combined `! grep -q -- '--- SKIP' a.log b.log c.log` reads as equivalent
      # and is not: dbtestcov models each `go test` invocation separately and
      # rejects it, because one grep over three files cannot say WHICH
      # invocation was asserted about. That is not a style rule I inferred — the
      # first draft of this step used the combined form and both the coverage
      # gate and its own unit test (TestParseWorkflow_RealCIWorkflow, which
      # parses this very file) went red on it.
      #
      # Requires migration 0032_projects_members_version.sql; without it every
      # project read fails, because projectSelectCols names the column.
      - name: aihub#260 project members CAS DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestUpdateProjectMembersCAS' -count=1 -v 2>&1 | tee members_domain.log
          go test ./internal/server/ -run 'TestProjectMembersVersionHTTP' -count=1 -v 2>&1 | tee members_server.log
          go test ./internal/mcp/ -run 'TestProjectMembersCAS' -count=1 -v 2>&1 | tee members_mcp.log
          for want in TestUpdateProjectMembersCASVersionAdvancesAcrossWrites \
                      TestUpdateProjectMembersCASUnrelatedWriteLeavesVersionAlone \
                      TestUpdateProjectMembersCASStaleVersionReturns409AndReportsCurrent \
                      TestUpdateProjectMembersCASCorrectVersionSucceedsAndAdvances \
                      TestUpdateProjectMembersCASOmittedVersionOverwritesUnconditionally \
                      TestUpdateProjectMembersCASConcurrentAddsBothSurvive \
                      TestUpdateProjectMembersCASConcurrentAddsWithoutTheGuardLoseOne \
                      TestUpdateProjectMembersCASDoesNotPreventAccidentalTruncation; do
            grep -q -- "--- PASS: $want" members_domain.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the DB-gated members CAS coverage is not actually executing"; exit 1; }
          done
          for want in TestProjectMembersVersionHTTPStaleVersionIs409 \
                      TestProjectMembersVersionHTTPCurrentVersionSucceeds \
                      TestProjectMembersVersionHTTPIsReadableFromBothReadPaths \
                      TestProjectMembersVersionHTTPZeroIsSerialised \
                      TestProjectMembersVersionHTTPGuardWithNothingToWriteIs400; do
            grep -q -- "--- PASS: $want" members_server.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the HTTP hop of the members CAS is unguarded"; exit 1; }
          done
          for want in TestProjectMembersCASToolSchemaAdvertisesMembersVersion \
                      TestProjectMembersCASVersionIsReadableFromListProjects \
                      TestProjectMembersCASStaleVersionIsRefusedEndToEnd \
                      TestProjectMembersCASConcurrentAddsBothSurviveEndToEnd \
                      TestProjectMembersCASDoesNotStopSelfInflictedTruncationEndToEnd; do
            grep -q -- "--- PASS: $want" members_mcp.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the MCP hop of the members CAS is unguarded"; exit 1; }
          done
          ! grep -q -- '--- SKIP' members_domain.log \
            || { echo "::error::an aihub#260 internal/domain test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' members_server.log \
            || { echo "::error::an aihub#260 internal/server test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          ! grep -q -- '--- SKIP' members_mcp.log \
            || { echo "::error::an aihub#260 internal/mcp test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#334: Postgres class 40 (40001 serialization_failure / 40P01
      # deadlock_detected) must reach the caller as a retryable 409, never as a
      # 500 that sends them to read logs instead of retrying.
      #
      # This cannot be a unit test. 40001 is produced by the server's own
      # concurrency control at the instant a blocked writer is released by the
      # committing writer that changed the row underneath it; a hand-built
      # *pgconn.PgError would only prove the classifier compiles. Those
      # hand-built cases DO exist, in internal/domain/pgx_err_test.go, and they
      # run in "Unit tests" — they are the negative half (40002, 40003, 23505
      # must NOT be reclassified), not this.
      #
      # Asserted per subtest rather than on the parent, because the three
      # instances fail for DIFFERENT reasons and are fixed in different places:
      #
      #   - the UpdateProject arm loses at `SELECT ... FOR UPDATE`;
      #   - the claim arm loses at the same shape but is reachable TODAY
      #     (FnClaimWorkItem already opens SERIALIZABLE, nobody has to raise an
      #     isolation level first);
      #   - the unblock-sweep arm loses inside a lazily-streamed result set
      #     whose error nobody asked for, so by the time it reaches the caller
      #     it is pgx.ErrTxCommitRollback with NO SQLSTATE at all. A fix placed
      #     only at a central pgx-error -> AihubError conversion point leaves
      #     this one returning 500 with every other assertion green — measured;
      #   - the memory-supersede arm loses at a plain `UPDATE`, neither a row
      #     lock nor a commit, which is what stops the fix from being scoped to
      #     the two hop shapes the other arms happen to use.
      #
      # The last name in the list is the control, not a fourth instance: at READ
      # COMMITTED the same interleaving must still SUCCEED. Without it, "turn
      # every contended write into a 409" would satisfy all four assertions
      # above and break every existing caller.
      - name: aihub#334 serialization-failure mapping DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestSerializationFailureSurfacesAsRetryable409' -count=1 -v 2>&1 | tee serialization_failure.log
          for want in 'TestSerializationFailureSurfacesAsRetryable409/serializable_loser_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/concurrent_claim_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/unblock_sweep_row-lock_error_still_must_not_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/memory_supersede_loser_gets_a_retryable_409,_not_a_500' \
                      'TestSerializationFailureSurfacesAsRetryable409/read_committed_loser_still_succeeds'; do
            grep -q -- "--- PASS: $want" serialization_failure.log \
