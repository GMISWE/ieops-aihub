version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: aihub_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  aihub:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:testpass@postgres:5432/aihub_test?sslmode=disable
      PORT: 8080
      # Required since aihub#344 — the server refuses to start without it. A
      # fixed value rather than `ephemeral` so a test can restart this container
      # and find its /ui session still valid, which is the property aihub#344
      # is about; `ephemeral` would make that untestable here. Not a secret:
      # this stack is a throwaway on localhost:8081 with a hard-coded database
      # password two lines up.
      POLYFORGE_UI_COOKIE_SECRET: integration-test-fixed-key-not-a-secret
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/v1/health"]
      interval: 3s
      timeout: 5s
      retries: 20
