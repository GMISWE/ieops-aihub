          done
          ! grep -q -- '--- SKIP' cursor_carry.log \
            || { echo "::error::an aihub#239 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#270: exercise the recall router split against the same Postgres service,
      # already migrated by the "Apply migrations (aihub#242 DB tests)" step above.
      #
      # These need a DB rather than a pure unit test because the fix is a routing decision
      # plus a SQL complement spliced into a hand-built WHERE with hand-threaded $N
      # placeholders — a placeholder that drifts out of step with its args list is a
      # runtime bind error, not a compile error, so nothing short of executing the query
      # catches it. TestRecallRouterComplementPlaceholdersBindAcrossOptions exists purely
      # to run that query under every combination of the optional clauses around it.
      #
      # Unlike TestRecallWithVector_Live these need no EMBEDDING_BASE_URL: a deterministic
      # stub provider stands in for the embedding service, so the vector path runs offline.
      # That is what makes the aihub#270 regression coverage CI-executable at all.
      #
      # Same -v + grep guard as the steps above: `go test` prints "ok" and exits 0 when
      # every selected test SKIPs, and these skip whenever AIHUB_TEST_DB is empty.
      - name: aihub#270 recall router split DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestRecallRouter' -count=1 -v 2>&1 | tee recall_router.log
          for want in TestRecallRouterMixedUnionReturnsBothHalves \
                      TestRecallRouterPureEmbeddableStaysOnVectorPath \
                      TestRecallRouterPureNonEmbeddableSkipsVectorPath \
                      TestRecallRouterEmptyTypeFilterStaysSemantic \
                      TestRecallRouterThresholdGatesEmbeddableHalfOnly \
                      TestRecallRouterWorkItemScopedBypassesVectorPath \
                      TestRecallRouterComplementPlaceholdersBindAcrossOptions; do
            grep -q -- "--- PASS: $want" recall_router.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#270 router coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' recall_router.log \
            || { echo "::error::an aihub#270 router test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#268: exercise the agent_events partition creator against the same
      # Postgres service. This is the step that makes the fix trustworthy: the
      # bug it closes was a partition-exhaustion outage, and the pure-unit tests
      # in gc_test.go can only reach the month arithmetic and the DDL string —
      # everything that decides whether the sweep actually WORKS is answered by
      # Postgres and nothing else.
      #
      # Unlike every other DB step here, these tests do NOT use the migrated
      # schema: setupPartitionTestDB builds a self-contained agent_events in its
      # own schema and pins search_path to it, so they need only a live server
      # and cannot touch the migrated tables. They still run after the migration
      # step because they need the service, not its contents.
      #
      # Scoped with -run for the same reason as the steps above — the package's
      # other gated suites were not verified by this change — and doubly so here:
      # RunPartitionCreate takes advisory lock 2006, which is database-wide.
      #
      # This step is also what retires a real gap: the change was verified by
      # hand against a local PostgreSQL 14, while production is 18. The service
      # below is pg18, so from here on the drain, the catalog-verified
      # attachment, the error accumulation, the audit event, the DEFAULT-backlog
      # alarm and the lock_timeout guard are all checked on production's major
      # version.
      - name: aihub#268 agent_events partition creator DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestRunPartitionCreate|TestPartitionDDLTimeoutsAreApplied' -count=1 -v 2>&1 | tee gc_partition.log
          for want in TestRunPartitionCreate_CreatesTheLookaheadWindow \
                      TestRunPartitionCreate_WritesLandInRealPartitionsAfterwards \
                      TestRunPartitionCreate_DrainsRowsStrandedInDefault \
                      TestRunPartitionCreate_ReportsBacklogItCannotDrain \
                      TestRunPartitionCreate_ReportsADetachedNamesakeInsteadOfCountingIt \
                      TestRunPartitionCreate_AccumulatesEveryError \
                      TestPartitionDDLTimeoutsAreApplied; do
            grep -q -- "--- PASS: $want" gc_partition.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#268 partition-creator coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' gc_partition.log \
            || { echo "::error::an aihub#268 partition-creator test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#266: the two GC sweeps documented "(daily)" ran on the 60s ticker
      # with no idempotency, so each matching work item accumulated 1,440
      # identical agent_events rows per day (measured: 111,221 on ieops#84 alone,
      # ~105,000 rows/day for one project). The fix is in two places — a repeat
      # window in the sweeps' SQL, and a daily period in the RunAll/RunDue sweep
      # table — and only Postgres can say whether the first one works.
      #
      # This step is where the claim "one event per day, not 1,440" is actually
      # measured. The suite drives the sweep 1,440 times per arm against a
      # self-contained work_items + agent_events fixture (the gc_partition_db_test
      # pattern: own schema, pinned search_path, no migrated tables touched, no
      # pgvector needed), and it carries its own negative control — the verbatim
      # pre-change statements, required to come back 1,440 — so the measurement
      # is shown to discriminate rather than assumed to.
      #
      # The assertion list below names every case individually, and two of them
      # are the reason this step exists at all rather than just checking for
      # duplicates:
      #   FiresAgainOnceTheRepeatWindowHasPassed  — a guard that never emits
      #     again satisfies "no duplicates" perfectly. This is the only test that
      #     can tell a window from a latch.
      #   GuardIsPerWorkItemNotGlobal             — one alert anywhere must not
      #     suppress alerts everywhere.
      #   GuardIsScopedPerEventTypeNotPerWorkItem — nor must one alert TYPE
      #     suppress the other for the same wi.
      #   RunDueStillDrivesEverySweep             — the period change must not
      #     have taken the other six sweeps with it.
      #   RunDueSharesOneProcessWideSchedule      — the production entry point
      #     must be wired to the shared schedule, not a fresh one per call.
      #   RunDueRetriesADailySweepThatFailed      — the daily clock must start on
      #     a run that COMPLETED, or one transient DB error silences the alert
      #     for 24h.
      #   RecognisesFloodRowsWrittenByTheOldBuild — the deploy transition: on the
      #     day this ships, agent_events already holds the flood, and the guard
      #     has to recognise rows it did not write.
      #   AlertsAWorkItemWhoseWITypeIsNull        — work_items.wi_type is
      #     nullable and sweep 7 reads it; the only test that seeds the NULL.
      #   RestartAtAnUnluckyPhaseStillAlertsWithinADay — a restart must not be
      #     able to stretch the alert gap past a day. Walks both clocks (the
      #     schedule's and the database's) rather than restating arithmetic.
      #
      # Those six are not a wish list. A mutation run over eleven edits that each
      # restore a distinct defect — guard removed, period reverted, both (i.e. the
      # pre-change build), window's time bound dropped, wi match dropped,
      # event_type match dropped, window set equal to the period, RunDue given a
      # per-call schedule, the schedule recording attempts instead of completions,
      # record() storing timestamps for every-tick sweeps, and >= turned into > in
      # the due() comparison — is red on all eleven, and EIGHT of the eleven are
      # caught by exactly ONE probe each. Six of those eight live in this step
      # (the other two are pure-unit tests in gc_test.go). Deleting any one makes
      # a real defect shippable with the suite green, which is why they are named
      # here individually instead of trusting `-run 'TestAlertSweep'` to keep
      # selecting them.
      #
      # Scoped with -run like the steps above, and for the same extra reason as
      # aihub#268: these sweeps take advisory locks 2007/2008, which are
      # database-wide.
      - name: aihub#266 GC alert-sweep idempotency DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestAlertSweep' -count=1 -v 2>&1 | tee gc_alert_idempotency.log
          for want in TestAlertSweep_UnclassifiedWIEmitsOnePerDayNotOnePerTick \
                      TestAlertSweep_NeedsHumanSessionEmitsOnePerDayNotOnePerTick \
                      TestAlertSweep_MeasurementFailsOnPreChangeBuild \
                      TestAlertSweep_StillFiresOnceForAGenuinelyUnclassifiedWI \
                      TestAlertSweep_FiresAgainOnceTheRepeatWindowHasPassed \
                      TestAlertSweep_GuardIsPerWorkItemNotGlobal \
                      TestAlertSweep_DoesNotAlertWorkItemsOutsideItsPredicate \
                      TestAlertSweep_RunDueStillDrivesEverySweep \
                      TestAlertSweep_RunAllIgnoresTheScheduleButStillCannotDuplicate \
                      TestAlertSweep_GuardIsScopedPerEventTypeNotPerWorkItem \
                      TestAlertSweep_RunDueSharesOneProcessWideSchedule \
                      TestAlertSweep_RunDueRetriesADailySweepThatFailed \
                      TestAlertSweep_RecognisesFloodRowsWrittenByTheOldBuild \
                      TestAlertSweep_AlertsAWorkItemWhoseWITypeIsNull \
                      TestAlertSweep_RestartAtAnUnluckyPhaseStillAlertsWithinADay \
                      TestAlertSweep_WindowArgIsAnIntervalPostgresAgrees; do
            grep -q -- "--- PASS: $want" gc_alert_idempotency.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#266 alert-sweep coverage is not actually executing"; exit 1; }
          done
          # The four arms of the events-per-day measurement, named individually:
          # the two "old_driver_*" arms are the negative control, and a green run
          # with them absent would mean the control never executed.
          for want in TestAlertSweep_UnclassifiedWIEmitsOnePerDayNotOnePerTick/old_driver_old_emitter \
                      TestAlertSweep_UnclassifiedWIEmitsOnePerDayNotOnePerTick/old_driver_new_emitter \
                      TestAlertSweep_UnclassifiedWIEmitsOnePerDayNotOnePerTick/new_driver_old_emitter \
                      TestAlertSweep_UnclassifiedWIEmitsOnePerDayNotOnePerTick/new_driver_new_emitter \
                      TestAlertSweep_NeedsHumanSessionEmitsOnePerDayNotOnePerTick/shipped_behaviour \
                      TestAlertSweep_NeedsHumanSessionEmitsOnePerDayNotOnePerTick/after_the_fix; do
            grep -q -- "--- PASS: $want" gc_alert_idempotency.log \
              || { echo "::error::$want did not run; the aihub#266 events-per-day measurement is incomplete, so its number is not the measured one"; exit 1; }
          done
          ! grep -q -- '--- SKIP' gc_alert_idempotency.log \
            || { echo "::error::an aihub#266 alert-sweep test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#289: pf_recall's `type` filter is a LIST, but three SKILL.md templates
      # taught `type="a|b|c"` for months. Nothing in the chain ever split on '|', so the
      # whole string arrived as one type name, matched no row on either the exact or the
      # LIKE branch, and returned {"items":null,"total":0} — an empty set that is
      # indistinguishable from "this project holds no such memory". An agent following
      # the Memory-First rule read it as "no prior experience exists" and went on to
      # redo work already recorded, with nothing in any log to show it happened.
      #
      # The fix is a 400 on '|' plus a new `unmatched_types` response field naming any
      # type entry that matched nothing. The guard tests need no DB and run under "Unit
      # tests" above; the two suites below DO need one, and both are the halves that
      # prove the field survives to a caller rather than merely being computed:
      #
      #   internal/domain  — UnmatchedTypes against the real SQL (the shared
      #                      typeFilterClause means the diagnostic and the recall filter
      #                      cannot disagree), plus the differential check that the piped
      #                      form is empty AND explained while the array form works
      #   internal/server  — handleRecall assigning it and it surviving into the JSON
      #                      body, including staying OFF the wire when there is nothing
      #                      to report
      #
      # Same -v + grep guard as the steps above, for the same reason: `go test` prints
      # "ok" and exits 0 when every selected test SKIPs, and these skip on an empty
      # AIHUB_TEST_DB — so without the greps this step would be a green no-op.
      - name: aihub#289 recall unmatched-type DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run 'TestUnmatchedTypes' -count=1 -v 2>&1 | tee recall_unmatched.log
          for want in TestUnmatchedTypes \
                      TestUnmatchedTypes_AgreesWithRecall \
                      TestUnmatchedTypes_NeverBreaksRecall \
                      TestUnmatchedTypes_ChunksPastThePostgresTargetListCap \
                      TestUnmatchedTypes_AdminAndArchived; do
            grep -q -- "--- PASS: $want (" recall_unmatched.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#289 unmatched-type coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' recall_unmatched.log \
            || { echo "::error::an aihub#289 unmatched-type test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          go test ./internal/server/ -run 'TestHandleRecall_ReportsUnmatchedTypes' -count=1 -v 2>&1 | tee recall_unmatched_http.log
          grep -q -- "--- PASS: TestHandleRecall_ReportsUnmatchedTypes (" recall_unmatched_http.log \
            || { echo "::error::TestHandleRecall_ReportsUnmatchedTypes did not run; the aihub#289 handler-to-JSON hop is not covered"; exit 1; }
          ! grep -q -- '--- SKIP' recall_unmatched_http.log \
            || { echo "::error::TestHandleRecall_ReportsUnmatchedTypes SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#280: the pf_list_work_items parameter contract has four hops
      # (published MCP schema → MCP/HTTP forwarding → query param → filter field
      # → SQL), and seven params were dying on one hop or another while every
      # existing test stayed green. Hops 1-4 each got their own pure-unit guard
      # (internal/mcp/tools_list_wi_schema_test.go,
      # internal/server/router_list_wi_params_test.go,
      # internal/domain/work_items_list_filters_test.go) — those run on the
      # "Unit tests" step above and need nothing here.
      #
      # This step is for the end-to-end probe, which needs a real database
      # because the acceptance criterion is a *row count*: send a value that
      # cannot match anything and assert n == 0. That is the only formulation
      # that discriminates. The original investigation used limit=50 and compared
      # counts, but 50 was the limit, so "filtered, still >50 matches" and "param
      # discarded" produced the same number — and raising the limit reproduces the
      # illusion, since limit>200 is silently clamped back to 50 (aihub#267).
      # The suite therefore seeds a 6-item project (well under the limit), and
      # also asserts positive controls still discriminate, that an unknown param
      # does NOT filter, and — for include_step_state, which widens rows instead
      # of narrowing the set — the response key set rather than any count.
      #
      # Runs against internal/server (not internal/domain, so no widening-gate
      # concern with that package's other AIHUB_TEST_DB suites) and reuses the
      # already-migrated Postgres service.
      #
      # Same -v + grep guard as every DB step above, and for the same reason:
      # `go test` prints "ok" and exits 0 when every selected test SKIPs, and
      # these skip whenever AIHUB_TEST_DB is empty — so without the guard this
      # coverage would silently not exist while CI stayed green. Verified during
      # this wi: the unguarded form printed "ok ... 0.131s" with all three tests
      # SKIPped.
      - name: aihub#280 list work_items param contract DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run 'TestListWorkItemsParams' -count=1 -v 2>&1 | tee wi_list_params.log
          for want in TestListWorkItemsParams_EndToEnd \
                      TestListWorkItemsParams_IncludeStepStateChangesTheKeySet \
                      TestListWorkItemsParams_IdsWithoutProjectEndToEnd; do
            grep -q -- "--- PASS: $want" wi_list_params.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#280 DB-gated param-contract coverage is not actually executing"; exit 1; }
          done
          # The n==0 probes are only meaningful if the positive controls and the
          # unknown-param negative control also ran; name them so deleting a
          # subtest cannot quietly shrink the probe to its vacuous half.
          for want in 'TestListWorkItemsParams_EndToEnd/positive_controls_discriminate' \
                      'TestListWorkItemsParams_EndToEnd/negative_control:_unknown_param_must_not_filter'; do
            grep -q -- "--- PASS: $want" wi_list_params.log \
              || { echo "::error::$want did not run; without it the n==0 probes prove nothing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' wi_list_params.log \
            || { echo "::error::an aihub#280 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }
          # GetReadyQueue's items[] segment. Separate package, so a separate
          # invocation. This is the guard that has to be BEHAVIOURAL: ready_only
          # and this segment share one SQL constant, but nothing forces
          # GetReadyQueue to call the helper that embeds it, so a test which
          # merely inspects that helper stays green when a divergent query is
          # inlined at the call site. Verified by mutation during aihub#280.
          # Before these tests there was no DB coverage of items[] contents at all.
          go test ./internal/domain/ -run 'TestGetReadyQueue_' -count=1 -v 2>&1 | tee ready_queue.log
          for want in TestGetReadyQueue_ItemsExcludesHumanSessionAndBlocked \
                      TestGetReadyQueue_ItemsAgreesWithReadyOnlyFilter; do
            grep -q -- "--- PASS: $want" ready_queue.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#280 ready-queue behavioural coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' ready_queue.log \
            || { echo "::error::an aihub#280 ready-queue test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#281: the wiring that change deferred. Its
      # internal/mcp/wi_echo_e2e_db_test.go header explains why the edit is not
      # in its own commit — ci.yml was locked by aihub#303 while it was written
      # — and asks for exactly a step of this shape. Note how it surfaced: not
      # from the note, but because aihub#303's coverage gate below computed
      # these two as the only DB-gated tests no `-run` named once the two
      # branches met. A deferral that depends on someone reading a comment is
      # the shape this whole pair of steps exists to replace.
      #
      # Both cases need only a database: the suite stands the real echo router
      # up in-process (httptest) and drives it through the real SDK client, so
      # there is no external service to provide. What they are for is the
      # reference side of the suppression tests in wi_echo_test.go — that a real
      # create/update response still carries `content` at all, and that stored
      # content comes back byte-identical. Both of those can only be answered by
      # executing against a real server, and if either silently stopped being
      # true, every "content is absent" assertion elsewhere would stay green
      # while measuring nothing.
      - name: aihub#281 wi-content echo E2E DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/mcp/ -run '^(TestE2EWorkItemContentEchoAgainstARealServer|TestE2ERealServerStoresContentByteIdentically)$' -count=1 -v 2>&1 | tee wi_echo_e2e.log
          for want in TestE2EWorkItemContentEchoAgainstARealServer \
                      TestE2ERealServerStoresContentByteIdentically; do
            grep -q -- "--- PASS: $want (" wi_echo_e2e.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#281 end-to-end echo coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' wi_echo_e2e.log \
            || { echo "::error::an aihub#281 E2E test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#148: pf_recall's `similarity_threshold` was published in the MCP
      # InputSchema and fully implemented in internal/domain, with NEITHER hop
      # in between carrying it — passing 0.99 and passing nothing returned
      # byte-identical results in production. The five functions below are the
      # hop-3, hop-4 and end-to-end halves of that guard; the hop-1/hop-2 halves
      # need no database and already run in the "Unit tests" step.
      #
      # They must run against a real pgvector database because the floor is a
      # SQL predicate spliced into a hand-built WHERE with hand-threaded $N
      # placeholders, and the count query drops a trailing unreferenced bind
      # value when the floor is off — a placeholder that drifts out of step with
      # its args list is a runtime bind error, not a compile error.
      - name: aihub#148 pf_recall similarity_threshold DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^(TestHandleRecall_SimilarityThresholdIsReachable|TestHandleRecall_SimilarityThresholdFiltersTotal)$' -count=1 -v 2>&1 | tee recall_threshold.log
          go test ./internal/mcp/ -run '^(TestE2ERecallSimilarityThresholdReachesSQL|TestE2ERecallSimilarityThresholdSelectsRatherThanTruncates|TestE2ERecallTopKAcceptsAJSONNumber)$' -count=1 -v 2>&1 | tee -a recall_threshold.log
          for want in TestHandleRecall_SimilarityThresholdIsReachable \
                      TestHandleRecall_SimilarityThresholdFiltersTotal \
                      TestE2ERecallSimilarityThresholdReachesSQL \
                      TestE2ERecallSimilarityThresholdSelectsRatherThanTruncates \
                      TestE2ERecallTopKAcceptsAJSONNumber; do
            grep -q -- "--- PASS: $want (" recall_threshold.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#148 similarity_threshold coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' recall_threshold.log \
            || { echo "::error::an aihub#148 threshold test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#314: `request_adjusted` — the server's statement that it rewrote a
      # value the caller sent — must reach BOTH a REST caller and the model.
      #
      # These two cases are the only ones in the change that can answer the
      # question it exists to answer, and the reason is the same one the
      # aihub#281 step above gives. The fake-backed cases in
      # request_adjusted_wiring_test.go prove the MCP hop forwards the field on
      # whatever it is handed; with a fake on the other end they stay green
      # against a server that discloses nothing at all. Only a real
      # domain.ListWorkItems can show that the aihub#267 limit reset is recorded,
      # and only asking that same live server twice — once over HTTP, once over
      # the MCP transport — can show the two ends agree. A contract with two hops
      # needs two assertions; asserting the REST body alone reproduces the bug
      # being fixed, since pf_recall's opt-in whitelist is exactly where the
      # previous three such fields died.
      #
      # Needs only a database (real router in-process via httptest, real SDK
      # client), so no extra service. Same -v + grep discipline as every DB step
      # here: a suite in which everything SKIPped still exits 0.
      - name: aihub#314 request_adjusted disclosure E2E DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/mcp/ -run '^(TestE2ERequestAdjustedDisclosesListLimitClamp|TestE2ERequestAdjustedDisclosesRecallTopKCap)$' -count=1 -v 2>&1 | tee request_adjusted_e2e.log
          for want in TestE2ERequestAdjustedDisclosesListLimitClamp \
                      TestE2ERequestAdjustedDisclosesRecallTopKCap; do
            grep -q -- "--- PASS: $want (" request_adjusted_e2e.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#314 disclosure is not actually verified end to end"; exit 1; }
          done
          ! grep -q -- '--- SKIP' request_adjusted_e2e.log \
            || { echo "::error::an aihub#314 E2E test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#325: pf_reinforce_memory declared work_item_id required and then
      # left it out of the body it sent, so the server's credential gate refused
      # every non-methodology reinforcement with a 400. Measured against a real
      # router before the fix, not inferred. The mismatch case is here for a
      # reason: it would have passed on the old build too (the call was refused
      # either way), so it asserts the rejection text is the credential one and
      # not the missing-field one.
      - name: aihub#325 pf_reinforce_memory work_item_id E2E DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/mcp/ -run '^(TestE2EReinforceMemoryWorkItemIDReachesTheGate|TestE2EReinforceMemoryRejectsAMismatchedWorkItem)$' -count=1 -v 2>&1 | tee reinforce_wi_e2e.log
          for want in TestE2EReinforceMemoryWorkItemIDReachesTheGate \
                      TestE2EReinforceMemoryRejectsAMismatchedWorkItem; do
            grep -q -- "--- PASS: $want (" reinforce_wi_e2e.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#325 work_item_id fix is not actually verified end to end"; exit 1; }
          done
          ! grep -q -- '--- SKIP' reinforce_wi_e2e.log \
            || { echo "::error::an aihub#325 E2E test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#151: the pre-share visibility bookkeeping in SetMemoryVisibility.
      #
      # The fix for "unshare hard-codes visibility=project, which WIDENS access
      # for a memory that was private or admin before it was shared" is split
      # across two layers, and only one of them is assertable without a database:
      #
      #   - which tier the handler asks for is decided in Go and is covered by
      #     TestUnshareArtifact_* in internal/server, which always run; but
      #   - whether that tier was ever WRITTEN DOWN is a jsonb_set/`-` expression
      #     inside one UPDATE. Get it wrong — record 'public' over the real tier
      #     on a second share, say — and every handler test stays green while the
      #     fix is a no-op.
      #
      # Five subtests of ONE function, not five functions, because the coverage
      # gate at the top of this job counts functions and this is one guard.
      # It needs only a database (no embedding service), so the required set goes
      # 128 -> 129.
      - name: aihub#151 pre-share visibility DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestSetMemoryVisibility_PreShareTier$' -count=1 -v 2>&1 | tee pre_share_visibility.log
          for want in 'TestSetMemoryVisibility_PreShareTier/share_records_the_tier_being_left_behind' \
                      'TestSetMemoryVisibility_PreShareTier/re-sharing_an_already_public_memory_does_not_overwrite_the_record' \
                      'TestSetMemoryVisibility_PreShareTier/unshare_clears_the_record' \
                      'TestSetMemoryVisibility_PreShareTier/other_attrs_keys_survive_both_directions' \
                      'TestSetMemoryVisibility_PreShareTier/missing_row_still_reports_not_found'; do
            grep -q -- "--- PASS: $want" pre_share_visibility.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#151 pre-share recording is not actually verified"; exit 1; }
          done
          ! grep -q -- '--- SKIP' pre_share_visibility.log \
            || { echo "::error::an aihub#151 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#143: the /ui Watching scope and the watch/unwatch write path.
      #
      # The unit half (ui_handlers_wi_watching_test.go, work_items_watching_test.go)
      # runs in the "Unit tests" step above and needs nothing from this one — it
      # pins the wiring and the generated WHERE clause. What it structurally
      # cannot pin is the AUTHORIZATION property, because its ListWorkItems is a
      # fake that returns whatever it was handed:
      #
      #   a wi_watches row OUTLIVES the project access that created it (nothing
      #   walks that table when a membership is revoked), so "watched" and
      #   "readable" are independent facts, and the question "does a watch put an
      #   unreadable work item on the user's screen" is answered by how two SQL
      #   predicates compose. Only a real query answers it.
      #
      # Five functions rather than five subtests of one, deliberately, and it is
      # the opposite call from the aihub#151 step above: these are five separate
      # claims (the scope filters; the project bound survives it; an empty
      # allow-list means nothing rather than everything; the write is idempotent;
      # the write is authorized), not five arms of one guard. Each needs only a
      # database — no embedding service — so the required set goes 186 -> 191.
      # Measured on the tree, not computed: see the "189 -> 194" entry in the log
      # at the top of this job.
      #
      # The migrations step above applies 0033_wi_watches.sql; without it every
      # test here fails on `relation "wi_watches" does not exist` rather than
      # skipping, which is the loud direction.
      - name: aihub#143 watching scope DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/server/ -run '^(TestWatchingScope_ListsOnlyWatchedItems|TestWatchingScope_ProjectAccessStillBounds|TestWatchingScope_ViewAllWithNoAccessibleProjectsListsNothing|TestWatchToggle_RoundTripsAndIsIdempotent|TestWatchToggle_RefusesAnUnreadableWorkItem)$' -count=1 -v 2>&1 | tee watching_scope.log
          for want in TestWatchingScope_ListsOnlyWatchedItems \
                      TestWatchingScope_ProjectAccessStillBounds \
                      TestWatchingScope_ViewAllWithNoAccessibleProjectsListsNothing \
                      TestWatchToggle_RoundTripsAndIsIdempotent \
                      TestWatchToggle_RefusesAnUnreadableWorkItem; do
            grep -q -- "--- PASS: $want (" watching_scope.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#143 watching scope is not actually verified against a database"; exit 1; }
          done
          ! grep -q -- '--- SKIP' watching_scope.log \
            || { echo "::error::an aihub#143 watching test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#342: every path that DERIVES a lock from a declared resource must
      # apply the intent rule the tool schemas state ("read ... takes no write
      # lock"). Three of the four derivation sites ignored it; the fourth,
      # FnAcquireLocks, was the only one that had it, which is why the fix moved
      # the rule into one function (derivedLock) instead of repeating the check.
      #
      # Each read arm is paired with a write control, because aihub#342 says in
      # so many words that "the claim succeeded" is NOT the criterion — a claim
      # that waved everything through would satisfy it. The last subtest is the
      # criterion: predict and claim must answer the same input the same way,
      # and it asserts rule 3 still EMITS its `info` prediction, not merely that
      # rule 1 stopped emitting hard_block — "read takes no write lock" and
      # "read overlaps report as info" are two halves of one contract sentence
      # and only the first half has code of its own.
      #
      # The repo subtest is a scope marker, not coverage: the read rule is
      # applied to file_scope ONLY, so a `repo` entry keeps its git_branch lock
      # whatever its intent says. Dropping that would let a second attempt take
      # a branch another attempt is on, and — because both takeover paths DELETE
      # prior locks before re-deriving — would RELEASE an existing branch lock
      # on the next takeover rather than merely not take it.
      #
      # Five subtests of ONE function, not five functions, for the reason the
      # aihub#334 and aihub#151 entries give: the gate counts functions and this
      # is one guard.
      - name: aihub#342 read-intent lock derivation DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestReadIntentTakesNoWriteLock$' -count=1 -v 2>&1 | tee read_intent_locks.log
          for want in 'TestReadIntentTakesNoWriteLock/claim_derives_no_lock_for_a_read_declaration' \
                      'TestReadIntentTakesNoWriteLock/write_declaration_still_takes_the_lock' \
                      'TestReadIntentTakesNoWriteLock/force_takeover_derives_no_lock_for_a_read_declaration' \
                      'TestReadIntentTakesNoWriteLock/a_read_declaration_on_a_repo_still_takes_its_branch_lock' \
                      'TestReadIntentTakesNoWriteLock/predict_and_claim_agree_on_a_read_declaration_over_a_held_lock'; do
            grep -q -- "--- PASS: $want" read_intent_locks.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#342 intent rule is not actually verified on that derivation path"; exit 1; }
          done
          ! grep -q -- '--- SKIP' read_intent_locks.log \
            || { echo "::error::an aihub#342 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#345: pf_acquire_locks must report the locks its attempt HOLDS, not
      # the subset it happened to re-derive from the current declared_resources.
      #
      # The first subtest is the population that always worked and it is not
      # decoration: a reporter who only ever tests a still-declared lock gets a
      # correct answer every time and closes the report. The remaining four are
      # the silent populations — a removed declaration, a non-file_scope lock, a
      # read-intent lock predating aihub#342 — plus the partition check that
      # keeps "report everything held" from being satisfied by listing new locks
      # in both arrays.
      #
      # Every assertion reads the resource_locks TABLE. The tool under test is
      # the one that misreports, so its own return value cannot be the oracle.
      - name: aihub#345 acquire_locks held-lock reporting DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestAcquireLocksReportsEveryHeldLock$' -count=1 -v 2>&1 | tee acquire_locks_reporting.log
          for want in 'TestAcquireLocksReportsEveryHeldLock/a_still-declared_lock_is_reported' \
                      'TestAcquireLocksReportsEveryHeldLock/a_lock_whose_declaration_was_removed_is_still_reported' \
                      'TestAcquireLocksReportsEveryHeldLock/a_non-file-scope_lock_is_reported' \
                      'TestAcquireLocksReportsEveryHeldLock/a_newly_taken_lock_is_acquired_not_already_held' \
                      'TestAcquireLocksReportsEveryHeldLock/a_lock_behind_a_read_declaration_is_reported'; do
            grep -q -- "--- PASS: $want" acquire_locks_reporting.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#345 already_held contract is not actually verified for that population"; exit 1; }
          done
          ! grep -q -- '--- SKIP' acquire_locks_reporting.log \
            || { echo "::error::an aihub#345 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#329: the SERVER's fill of the response fields the MCP client
      # consumes to name or key something local — ClaimResponse.Goal (the task
      # branch name), and ID/Slug/Project on both claim exits and on
      # ForceTakeoverResponse (the state file key and the slug scan that finds
      # it).
      #
      # This step exists because the existing suite is provably blind to it.
      # Measured on this branch: with BOTH ClaimResponse.Goal fills blanked,
      # `env -u AIHUB_TEST_DB GOWORK=off go test -count=1 -race ./...` still
      # exits 0 — internal/mcp/claim_handler_wiring_test.go's fake aihub
      # hardcodes "goal" into its response, so it pins the three client-side
      # hops and cannot see the server one. The fields are `omitempty` and the
      # client reads them with a discarded comma-ok, so a server that stops
      # filling them produces `polyforge/<project>-<seq>` — a legal, unremarkable
      # branch name — and nothing else changes.
      #
      # Three subtests of ONE function, one per exit. Assert them individually:
      # the fresh claim and the idempotent REPLAY are separate literals, and the
      # replay is the one a retry sees — and a retry still has to build the
      # worktree.
      - name: aihub#329 claim/takeover response echo DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestServerFilledResponseFieldsAreEchoed$' -count=1 -v 2>&1 | tee response_echo.log
          for want in 'TestServerFilledResponseFieldsAreEchoed/fresh_claim' \
                      'TestServerFilledResponseFieldsAreEchoed/idempotent_replay' \
                      'TestServerFilledResponseFieldsAreEchoed/force_takeover'; do
            grep -q -- "--- PASS: $want" response_echo.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); that exit's server-side fill is unguarded again"; exit 1; }
          done
          ! grep -q -- '--- SKIP' response_echo.log \
            || { echo "::error::an aihub#329 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#264: narrowing declared_resources must RELEASE the file_scope locks
      # the removed entries were holding. Acquisition lives on the claim path and
      # mutation on the update path, and nothing connected them, so a lock
      # outlived its declaration and was held to terminal state — ieops#824 hit a
      # 409 on a path its holder had not declared since resources_version 17.
      #
      # Three of the nine arms are CONTROLS that stay green against a mutant with
      # the release deleted, and they are not decoration: "a still declared lock
      # survives" and "widening still takes the new lock" are what separate a
      # release from a server that simply stopped taking locks, and "a rejected
      # CAS releases nothing" keeps the release inside the transaction that moved
      # resources_version. Four go red against that mutant — measured, not
      # assumed.
      #
      # Two arms have their own mutants, because they cover ways the release can
      # be silently skipped rather than absent:
      #   - "a wrong typed optional field ..." goes red if derivedFileScopeLockKeys
      #     is decoded with a strict []DeclaredResourceItem unmarshal. That decode
      #     is stricter than ValidateDeclaredResources, so caller input it accepts
      #     (a non-string `intent`) killed the whole diff and released nothing.
      #   - "an explicit null declaration ..." goes red if the
      #     normalizeDeclaredResources fold is removed: a literal JSON null wiped
      #     the declarations AND dropped every file_scope lock, with HTTP 200.
      #
      # Every arm ends at a real FnClaimWorkItem by a second work item where it
      # can — the hop a blocked caller actually sees — because the resource_locks
      # table alone was never what ieops#824 could observe.
      - name: aihub#264 declared_resources lock release DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestNarrowingDeclaredResourcesReleasesItsLocks$' -count=1 -v 2>&1 | tee declared_resources_release.log
          for want in 'TestNarrowingDeclaredResourcesReleasesItsLocks/a_removed_declaration_releases_its_lock' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/a_released_lock_is_absent_from_already_held_not_merely_unreported' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/a_still_declared_lock_survives' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/widening_still_takes_the_new_lock' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/flipping_a_declaration_to_read_intent_releases_its_write_lock' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/a_rejected_CAS_releases_nothing' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/a_wrong_typed_optional_field_does_not_disable_the_release' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/an_explicit_null_declaration_changes_nothing' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/another_work_items_lock_is_untouched' \
                      'TestNarrowingDeclaredResourcesReleasesItsLocks/a_lock_with_no_declaration_behind_it_survives_a_narrowing'; do
            grep -q -- "--- PASS: $want" declared_resources_release.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#264 release contract is not actually verified for that case"; exit 1; }
          done
          ! grep -q -- '--- SKIP' declared_resources_release.log \
            || { echo "::error::an aihub#264 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#355: CancelWorkItem moved the WORK ITEM to 'cancelled' with one
      # UPDATE and left run_attempts alone. Every other release path moves the
      # ATTEMPT, and the orphan sweep is written against exactly that — it
      # collects a lock only once the owner attempt is no longer running/paused.
      # cancelGate admits status='paused', and a pause deliberately RETAINS
      # git_branch/deploy_env/worktree/tcp_port for resume, so pause-then-cancel
      # left those held by an attempt still marked 'paused': inside the retention
      # predicate, skipped by the sweep, and unreachable by claim, force_takeover
      # or complete_attempt because all three refuse a terminal work item.
      #
      # The last arm is the one that makes this a step rather than a unit test:
      # a `{"type":"repo"}` entry with no task_branch derives git_branch
      # `<repo>/main`, and the claim conflict probe matches holders whose attempt
      # is running OR paused — so one pause-then-cancel of a wi declaring a repo
      # blocks every later claim of that repo's default branch, permanently, with
      # no holder to negotiate with.
      #
      # 'the_cancel_does_not_touch_another_work_items_lock' is the paired control:
      # the release is scoped by work_item_id and reaches across claim epochs, so
      # "every lock of this work item" is one edit away from "every lock". Without
      # that arm, deleting the scoping predicate would leave this step green.
      - name: aihub#355 cancel releases retained locks DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestCancelWorkItemReleasesEveryLockItStillHolds$' -count=1 -v 2>&1 | tee cancel_lock_release.log
          for want in 'TestCancelWorkItemReleasesEveryLockItStillHolds/a_cancelled_work_item_holds_no_lock_of_any_type' \
                      'TestCancelWorkItemReleasesEveryLockItStillHolds/the_release_is_decidable_from_the_event_stream_alone' \
                      'TestCancelWorkItemReleasesEveryLockItStillHolds/the_party_those_locks_were_blocking_can_now_claim' \
                      'TestCancelWorkItemReleasesEveryLockItStillHolds/the_cancel_does_not_touch_another_work_items_lock'; do
            grep -q -- "--- PASS: $want" cancel_lock_release.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#355 cancel-release contract is not actually verified for that case"; exit 1; }
          done
          ! grep -q -- '--- SKIP' cancel_lock_release.log \
            || { echo "::error::an aihub#355 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#261: the file_scope lock key had no repo segment, so in a multi-repo
      # project every repo's go.mod / go.sum / Makefile / README.md / Dockerfile
      # derived ONE key. Measured on the acquire path, that is a hard block: two
      # work items editing two physically different files 409 each other
      # (ieops#606 vs ieops#571, aihub#256).
      #
      # Every arm here goes through a real entry point rather than through the
      # mapper, and that is the point of the step rather than a style choice.
      # aihub#342 established that this repo has FOUR sites which turn a declared
      # resource into a lock key, two of which decode into a local anonymous
      # struct whose field list is written out by hand — so a new field reaches
      # the mapper at some sites and silently reads as its zero value at others,
      # with nothing to grep for. A test that pinned derivedLock's output would
      # be green while claim and force_takeover still collided.
      #
      # The pairs are load-bearing. Each "these two no longer collide" arm is
      # matched by a "and this pair still does" arm, because the fix makes lock
      # keys FINER and a finer key is the direction that can MISS a conflict —
      # silent, unlike the noisy false conflict being removed.
      - name: aihub#261 file_scope repo-qualified lock key DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestFileScopeRepoKey' -count=1 -v 2>&1 | tee file_scope_repo_key.log
          for want in 'TestFileScopeRepoKey_ClaimDoesNotCollideAcrossRepos' \
                      'TestFileScopeRepoKey_ClaimStillCollidesWithinOneRepo' \
                      'TestFileScopeRepoKey_UnqualifiedDeclarationStillConflictsWithQualifiedHolder/qualified_holder_blocks_unqualified_claimer' \
                      'TestFileScopeRepoKey_UnqualifiedDeclarationStillConflictsWithQualifiedHolder/unqualified_holder_blocks_qualified_claimer' \
                      'TestFileScopeRepoKey_ForceTakeoverDerivesRepoQualifiedKey' \
                      'TestFileScopeRepoKey_AcquireLocksDoesNotCollideAcrossRepos' \
                      'TestFileScopeRepoKey_PredictRule1NoHardBlockAcrossRepos' \
                      'TestFileScopeRepoKey_NarrowingReleasesRepoQualifiedLock' \
                      'TestFileScopeRepoKey_ProbeSQLAndGoAgree' \
                      'TestFileScopeRepoKey_RepoDefaultIsSingleRepoOnly' \
                      'TestFileScopeRepoKey_InferredRepoReachesEveryDerivationSite/claim' \
                      'TestFileScopeRepoKey_InferredRepoReachesEveryDerivationSite/force_takeover' \
                      'TestFileScopeRepoKey_InferredRepoReachesEveryDerivationSite/acquire_locks' \
                      'TestFileScopeRepoKey_InferredRepoReachesEveryDerivationSite/predict_rule_1' \
                      'TestFileScopeRepoKey_InferredRepoReachesEveryDerivationSite/narrowing_release' \
                      'TestFileScopeRepoKey_DroppingTheRepoEntryDoesNotReleaseStillDeclaredLocks' \
                      'TestFileScopeRepoKey_WrongTypedRepoDoesNotZeroOutEveryLock' \
                      'TestFileScopeRepoKey_RepoNameIsTrimmed'; do
            grep -q -- "--- PASS: $want" file_scope_repo_key.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); that aihub#261 derivation site is not actually covered"; exit 1; }
          done
          ! grep -q -- '--- SKIP' file_scope_repo_key.log \
            || { echo "::error::an aihub#261 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#259: pf_read_events published a `types` filter that the MCP tool
      # never put on the wire, so GET /v1/events was always called unfiltered.
      # The handler and the SQL both implemented it correctly — only the MCP hop
      # dropped it — which is why the same call over REST did filter.
      #
      # This step runs the END-TO-END function (real router, real client, real
      # database), not the wire-query unit tests, which need no database and run
      # in the "Unit tests" step above. It is the only arm that covers all three
      # layers at once.
      #
      # The arms compare two states the defect makes IDENTICAL: a real type and a
      # type that cannot exist. With the bug present both returned the full event
      # stream, so any assertion that merely wanted a usable response was green
      # for the whole life of the defect — and that false green nearly published
      # a "zero cancellations" report over 44 real ones (ieops#680).
      - name: aihub#259 read_events types filter E2E DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/mcp/ -run '^TestE2EReadEventsTypesFilterDiscriminates$' -count=1 -v 2>&1 | tee read_events_types.log
          for want in 'TestE2EReadEventsTypesFilterDiscriminates/a_real_type_returns_only_that_type' \
                      'TestE2EReadEventsTypesFilterDiscriminates/a_type_that_cannot_exist_returns_nothing' \
                      'TestE2EReadEventsTypesFilterDiscriminates/the_real_and_impossible_type_return_different_id_sets' \
                      'TestE2EReadEventsTypesFilterDiscriminates/two_types_return_their_union' \
                      'TestE2EReadEventsTypesFilterDiscriminates/an_unfiltered_read_still_returns_everything'; do
            grep -q -- "--- PASS: $want" read_events_types.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#259 types filter is not actually verified for that case"; exit 1; }
          done
          ! grep -q -- '--- SKIP' read_events_types.log \
            || { echo "::error::an aihub#259 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#324: the dependency endpoints' authorization model, asserted as a
      # SUCCESS on purpose.
      #
      # These two cases are unusual and the next person to see them go red needs
      # to know why before they "fix" them. The first asserts that a project
      # writer holding NO run attempt, with no state file on disk, can add and
      # remove a dependency on a work item somebody ELSE is running. That is
      # today's model, and aihub#324 removed the code that pretended otherwise:
      # the MCP handlers used to build attempt_id / claim_epoch / session_secret
      # into both requests, and pkg/client.RemoveDependency then issued the
      # DELETE with a nil body and dropped all of it.
      #
      # 🔴 If somebody later adds genuine credential validation to those
      # endpoints, this step goes red BY DESIGN. The correct response is to
      # update the model note above handleCreateDependency in
      # internal/server/router.go and retire the test in the same change — not to
      # hand the test credentials, which would rebuild exactly the "looks
      # guarded, guards nothing" state that was just removed.
      #
      # The second case is what stops the first from being vacuous: a project
      # VIEWER must still be refused both operations. Without a caller that
      # FAILS, "the writer succeeded" is equally consistent with endpoints that
      # authorize nobody out. Measured 2026-09-03 against the real router:
      # weakening either handler's checkProjectAccess from writer to viewer fails
      # the second case and leaves the first green; adding an attempt check to
      # handleDeleteDependency fails the first and leaves the second green.
      #
      # Both need only a database.
      - name: aihub#324 dependency authorization-model DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/mcp/ -run '^(TestE2EDependencyMutationsNeedNoAttemptCredential|TestE2EDependencyMutationsStillRequireProjectWriter)$' -count=1 -v 2>&1 | tee dep_authz_e2e.log
          for want in TestE2EDependencyMutationsNeedNoAttemptCredential \
                      TestE2EDependencyMutationsStillRequireProjectWriter; do
            grep -q -- "--- PASS: $want (" dep_authz_e2e.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#324 dependency authorization model is not actually pinned"; exit 1; }
          done
          ! grep -q -- '--- SKIP' dep_authz_e2e.log \
            || { echo "::error::an aihub#324 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#303: the 26 DB-gated test functions that, until this step, no
      # `-run` in this file named — so they SKIPped on every CI run since the
      # day they were written, and `go test` printed "ok" and exited 0 each
      # time. Nothing was ever red. This step is ADDITIVE: it does not replace
      # any narrow step above, it only picks up what those steps' regexes never
      # selected.
      #
      # The sharpest case is the internal/server trio below. They live in
      # routes_step_test.go — the file that defines setupStepTestDB /
      # seedStepTestWI, which the aihub#290 step's tests reuse — yet their own
      # names fall outside
      # `TestHandleUpdateStep_(NextStep|FusedEquals|FusedRespects)`. A regex
      # cannot know what else is in the file it is selecting from, so coverage
      # scoped by test name silently stops at the edge of the alternation; the
      # "aihub#303 DB-test coverage gate" step near the top of this job is what
      # makes that edge visible from now on.
      #
      # Two of these groups end with a database-WIDE sweep
      # (RunMemoryExpiredSweep in the ranking group, RunUnblockDependentWI in
      # the pause group): neither is project-scoped, so keep this step LAST
      # among the DB steps.
      #
      # Grouped by the concern each cluster belongs to, one `go test` per group,
      # so a failure names the area rather than "the leftovers". Same -v + grep
      # discipline as every DB step above: assert each case reported PASS, and
      # reject any SKIP, because a suite in which everything SKIPped still exits
      # 0 — which is the exact state this step exists to leave behind.
      - name: aihub#303 previously CI-invisible DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail

          # memories.latest_id cursor (aihub#201): backfill, round-trip, redaction
          # repointing, supersede advancing the head, and the concurrent
          # single-head invariant. All of it is SQL behaviour under contention.
          go test ./internal/domain/ -run '^(TestBackfillLatestID|TestBackfillLatestID_RedactedHead|TestGetLatestByID|TestLatestIDRoundTrip|TestRedactHeadRepointsCursor|TestSupersedeAdvancesCursor|TestConcurrentUpdateSingleHead)$' -count=1 -v 2>&1 | tee invisible_latest.log
          for want in TestBackfillLatestID \
                      TestBackfillLatestID_RedactedHead \
                      TestGetLatestByID \
                      TestLatestIDRoundTrip \
                      TestRedactHeadRepointsCursor \
                      TestSupersedeAdvancesCursor \
                      TestConcurrentUpdateSingleHead; do
            grep -q -- "--- PASS: $want (" invisible_latest.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#201 latest_id coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' invisible_latest.log \
            || { echo "::error::a latest_id test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          # Recall ranking + memory update/expiry (aihub#236). The ranking order
          # is decided by GREATEST(last_activated_at, created_at) in SQL, and the
          # sweep's whole subtlety is which rows it declines to archive — neither
          # is observable without executing the statements.
          go test ./internal/domain/ -run '^(TestRecallRanking_CursorSkipsNoRows|TestRecallRanking_FreshNeverActivatedBeatsOlderActivated|TestRecallRanking_GreatestIgnoresNullArgument|TestUpdateMemory|TestUpdateMemory_CarriesActivationState|TestUpdateMemory_FreshEditWithStaleActivationSurvivesMinStrength|TestMemoryExpiredSweep_DoesNotArchiveFreshEditWithStaleActivation|TestMemoryExpiredSweep_StillArchivesGenuinelyDecayedMemory)$' -count=1 -v 2>&1 | tee invisible_ranking.log
          for want in TestRecallRanking_CursorSkipsNoRows \
                      TestRecallRanking_FreshNeverActivatedBeatsOlderActivated \
                      TestRecallRanking_GreatestIgnoresNullArgument \
                      TestUpdateMemory \
                      TestUpdateMemory_CarriesActivationState \
                      TestUpdateMemory_FreshEditWithStaleActivationSurvivesMinStrength \
                      TestMemoryExpiredSweep_DoesNotArchiveFreshEditWithStaleActivation \
                      TestMemoryExpiredSweep_StillArchivesGenuinelyDecayedMemory; do
            grep -q -- "--- PASS: $want (" invisible_ranking.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#236 ranking/update coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' invisible_ranking.log \
            || { echo "::error::a ranking/update test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          # Step pause / stall (aihub#207) + the 0027 migration's own up/down.
          # TestMigration0027_UpDown drops and restores run_attempts.pause_reason
          # against the migrated schema, so it is meaningless without one.
          go test ./internal/domain/ -run '^(TestPauseReasonOmittedWhenNil|TestPauseReasonSurfacedInReadyQueue|TestMigration0027_UpDown|TestRunUnblockDependentWI_StalledStaysBlocked)$' -count=1 -v 2>&1 | tee invisible_pause.log
          for want in TestPauseReasonOmittedWhenNil \
                      TestPauseReasonSurfacedInReadyQueue \
                      TestMigration0027_UpDown \
                      TestRunUnblockDependentWI_StalledStaysBlocked; do
            grep -q -- "--- PASS: $want (" invisible_pause.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the pause/stall coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' invisible_pause.log \
            || { echo "::error::a pause/stall test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          # Lock conflict scan: resume-against-own-locks (aihub#207 Change 3),
          # the cross-wi guard that stops a broken fix from letting real
          # collisions through, and the project-scoped file_scope key (aihub#222).
          # These were also the only two non-idempotent tests in the suite until
          # aihub#303 widened testProject's reset — worth knowing if this group
          # ever goes red on a re-used database.
          go test ./internal/domain/ -run '^(TestResumeOwnLocks_NoSelfConflict|TestResumeOwnLocks_DifferentWIStillConflicts|TestCrossProjectSamePath_NoConflict|TestPredictConflicts_FileScopeProjectScoped)$' -count=1 -v 2>&1 | tee invisible_locks.log
          for want in TestResumeOwnLocks_NoSelfConflict \
                      TestResumeOwnLocks_DifferentWIStillConflicts \
                      TestCrossProjectSamePath_NoConflict \
                      TestPredictConflicts_FileScopeProjectScoped; do
            grep -q -- "--- PASS: $want (" invisible_locks.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the lock-conflict coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' invisible_locks.log \
            || { echo "::error::a lock-conflict test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          # internal/server: the three routes_step_test.go cases outside the
          # aihub#290 step's alternation — including the mandatory-record gate,
          # whose entire point is that a step transition is REFUSED, which only a
          # real transaction can show.
          go test ./internal/server/ -run '^(TestHandleUpdateStep_ArtifactSummary|TestHandleUpdateStep_EscalatedStall|TestHandleUpdateStep_MandatoryRecordGate)$' -count=1 -v 2>&1 | tee invisible_step.log
          for want in TestHandleUpdateStep_ArtifactSummary \
                      TestHandleUpdateStep_EscalatedStall \
                      TestHandleUpdateStep_MandatoryRecordGate; do
            grep -q -- "--- PASS: $want (" invisible_step.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the routes_step coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' invisible_step.log \
            || { echo "::error::a routes_step test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#175: the memory lifecycle's authorization / audit / state-machine
      # trio. All seven cases are DB-gated because all three defects ARE
      # database behaviour and nothing else:
      #
      #   finding 1 (IDOR) — PATCH /v1/memories/:id/redact had no project gate,
      #     so an author whose project access had been REVOKED could still
      #     delete the memory (domain.Redact's own rule is "author or global
      #     admin", which never expires). The criterion here is the memory's
      #     status column after the call, NOT the 403: a handler that redacts
      #     and then answers 403 satisfies the status code and is still the bug.
      #     Verified by mutation — moving the gate below domain.Redact leaves
      #     the status code assertion green and is caught only by the column.
      #
      #   finding 2 (zero audit) — redacted_at / redaction_reason have existed
      #     since migration 0006 and NOTHING in the codebase ever wrote either,
      #     and no agent_event was emitted, so "who deleted this, when, why" was
      #     unanswerable. Whether the event survives agent_events'
      #     chk_evt_work_item_id whitelist (a redaction carries no work_item_id)
      #     is a runtime property of that INSERT, not a compile-time one.
      #
      #   finding 3 (two active heads) — Activate revived a SUPERSEDED archived
      #     version back to active beside its successor, and orderVersionChain
      #     marks every active entry is_current, so the version chain then
      #     reported two current heads. The guard is an EXISTS subquery;
      #     activate_status_test.go (not DB-gated, runs in "Unit tests") covers
      #     the decision function, but only this step can show the boolean fed
      #     to it is the right boolean — mutating the subquery to a constant
      #     false leaves that unit test green.
      #
      # Both negative controls are named below on purpose. "Superseded rows stay
      # archived" is trivially satisfiable by never reviving anything, which
      # would silently kill the forgetting curve, so
      # StillRevivesADecayedVersionWithNoSuccessor and
      # RedactedSuccessorDoesNotCountAsSupersession are what make the guard a
      # guard rather than a latch.
      #
      # Two packages, two invocations, one step: they share a fixture shape and
      # a work item, and the -run regexes are anchored so neither picks up an
      # unrelated suite this change did not verify.
      - name: aihub#175 memory redact authz/audit + activate supersede DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail

          go test ./internal/domain/ -run '^(TestRedact_WritesAuditColumnsAndEmitsEvent|TestRedact_OmittedReasonStoresNullNotEmptyString|TestActivate_DoesNotReviveSupersededVersion|TestActivate_StillRevivesADecayedVersionWithNoSuccessor|TestActivate_RedactedSuccessorDoesNotCountAsSupersession)$' -count=1 -v 2>&1 | tee memlifecycle_domain.log
          for want in TestRedact_WritesAuditColumnsAndEmitsEvent \
                      TestRedact_OmittedReasonStoresNullNotEmptyString \
                      TestActivate_DoesNotReviveSupersededVersion \
                      TestActivate_StillRevivesADecayedVersionWithNoSuccessor \
                      TestActivate_RedactedSuccessorDoesNotCountAsSupersession; do
            grep -q -- "--- PASS: $want (" memlifecycle_domain.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#175 redact-audit / activate-supersede coverage is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' memlifecycle_domain.log \
            || { echo "::error::an aihub#175 domain test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          go test ./internal/server/ -run '^(TestRedactMemory_AuthorWithoutProjectAccessIsRefused|TestRedactMemory_ProjectWriterIsAuditedWithReason)$' -count=1 -v 2>&1 | tee memlifecycle_server.log
          for want in TestRedactMemory_AuthorWithoutProjectAccessIsRefused \
                      TestRedactMemory_ProjectWriterIsAuditedWithReason; do
            grep -q -- "--- PASS: $want (" memlifecycle_server.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); the aihub#175 redact IDOR gate is not actually executing"; exit 1; }
          done
          ! grep -q -- '--- SKIP' memlifecycle_server.log \
            || { echo "::error::an aihub#175 server test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#343: resource_locks rows were created and destroyed with NO audit
      # trail, so no claim a step summary made about locks or declarations could
      # be checked afterwards. Two recorded instances: a review called a step
      # summary's "the init.go write lock was released" FABRICATED and the
      # producer answered that the reviewer had misread a compare-and-set guard
      # as an entry count — neither side could settle it; and a note asserting a
      # release was contradicted a day later by a 409 CONFLICT_LOCK_TAKEN from
      # that same attempt, with no way to tell "the release never happened" from
      # "it happened and the row outlived it".
      #
      # What the arms below are and are not:
      #
      #   * The REPLAY arms are the work item's own acceptance criterion, and
      #     they never read resource_locks to check an event against it. They run
      #     lockVerdictFromEvents — a decision procedure whose only input is what
      #     pf_read_events returns — and check its verdict against what the
      #     server actually enforces. A test that read the table would prove the
      #     event exists, not that it is SUFFICIENT, which is what was asked for.
      #   * `an unrelated key stays undecidable` is the control that keeps the
      #     replay honest: if the verdict defaulted to "not held" for a key the
      #     stream says nothing about, the released arm would pass on an EMPTY
      #     event stream — reproducing, inside its own test, the "absence read as
      #     proof" failure this work item exists to prevent.
      #   * EveryMutationSiteEmits reaches all eleven lock-mutating SQL
      #     statements through their real entry points, never through the shared
      #     helper. aihub#261 established why: a test of the helper stays green
      #     when one CALL SITE stops using it, which is how the previous four
      #     fixes in this area (aihub#238/#261/#264/#342) were each defeated.
      #   * FailedEventInsert... has a NEGATIVE control that is the point of it.
      #     `_, _ = tx.Exec(ctx, "INSERT INTO agent_events ...")` appears all over
      #     internal/domain and LOOKS like "ignore a failed event"; it is not,
      #     because a failed statement aborts the whole Postgres transaction. The
      #     `without a savepoint the operation dies` arm measures that, so the
      #     savepoint in emitResourceEvents is justified by a measurement rather
      #     than by its own comment.
      #
      # Measured RED, nine mutants, each snapshotted immediately before its own
      # injection and restored byte-identically after (see the aihub#343 PR body
      # for the transcript). Notably m3 — emit on a DO NOTHING insert that took
      # nothing — was GREEN on the first version of this suite and exposed a real
      # hole: FnAcquireLocks' collision SELECT short-circuits before the insert
      # when the caller already owns the key, so the "three repeat calls" arm
      # never reached the helper. The assertion that catches it now lives in the
      # orphan-reclaim arm, the only one that reaches acquireLockIfFree with the
      # key already taken.
      #
      # The structural half of the gate (TestLockEvents_*, no DB) runs in the
      # "Unit tests" step: it asserts that lock-mutating SQL exists ONLY in
      # internal/domain/resource_events.go, which is the only arm here that can
      # fail for a call site that does not exist yet.
      - name: aihub#343 lock / declared_resources event auditability DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestLockEventsDB_' -count=1 -v 2>&1 | tee lock_events.log
          for want in 'TestLockEventsDB_ReplayTheUndecidableRelease/released_is_decidable_as_released' \
                      'TestLockEventsDB_ReplayTheUndecidableRelease/still_held_is_decidable_as_held' \
                      'TestLockEventsDB_ReplayTheUndecidableRelease/an_unrelated_key_stays_undecidable' \
                      'TestLockEventsDB_EveryMutationSiteEmits/claim_upsert' \
                      'TestLockEventsDB_EveryMutationSiteEmits/claim_takeover_release' \
                      'TestLockEventsDB_EveryMutationSiteEmits/complete_attempt_terminal_release' \
                      'TestLockEventsDB_EveryMutationSiteEmits/complete_attempt_paused_release' \
                      'TestLockEventsDB_EveryMutationSiteEmits/force_takeover_release_and_re-acquire' \
                      'TestLockEventsDB_EveryMutationSiteEmits/acquire_locks_insert' \
                      'TestLockEventsDB_EveryMutationSiteEmits/acquire_locks_emits_nothing_when_it_took_nothing' \
                      'TestLockEventsDB_EveryMutationSiteEmits/orphan_reclaim_release_and_re-acquire' \
                      'TestLockEventsDB_EveryMutationSiteEmits/narrowing_release' \
                      'TestLockEventsDB_EveryMutationSiteEmits/orphan_sweep_release' \
                      'TestLockEventsDB_EveryMutationSiteEmits/upsert_displacing_an_owner_emits_both_halves' \
                      'TestLockEventsDB_ResourcesUpdatedSettlesTheVersionArgument' \
                      'TestLockEventsDB_RejectedCASRecordsNothing' \
                      'TestLockEventsDB_FailedEventInsertDoesNotAbortTheOperation/without_a_savepoint_the_operation_dies' \
                      'TestLockEventsDB_FailedEventInsertDoesNotAbortTheOperation/with_the_savepoint_the_operation_survives' \
                      'TestLockEventsDB_FailedEventInsertDoesNotAbortTheOperation/a_batch_past_the_bind-parameter_ceiling_still_lands' \
                      'TestLockEventsDB_FailedEventInsertDoesNotAbortTheOperation/an_unrecordable_release_does_not_poison_the_transaction' \
                      'TestLockEventsDB_ResourcesUpdatedAgreesWithTheReleaseItDescribes'; do
            grep -q -- "--- PASS: $want " lock_events.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); that lock mutation's effect on the lock set is not actually verifiable from the event stream"; exit 1; }
          done
          ! grep -q -- '--- SKIP' lock_events.log \
            || { echo "::error::an aihub#343 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          # The read side of aihub#127's slug-resolution defect, found while
          # verifying the arms above against production: GET /v1/events resolved
          # id-or-slug for its ACCESS check and then queried on the caller's raw
          # parameter, so a slug matched nothing and returned 200 with an empty
          # list. Every instance aihub#127 fixed was a WRITE, where a slug in a
          # work_item_id column trips the FK and 500s; a read has no constraint
          # to trip, which is why this one survived. It is load-bearing here
          # rather than incidental — aihub#343's criterion is "decide from
          # pf_read_events' return ALONE", and a slug (what every human and skill
          # types) answered every such question with "nothing was recorded".
          # Measured on production before the fix, same wi:
          #   work_item_id="aihub#343"   -> {"events":null}
          #   work_item_id="wi_V7ph7bYu" -> 2 events
          # The _StillScopesToTheWorkItem arm is the control: resolving the slug
          # must not degrade into "return the whole project", which is what the
          # equality assertion alone could not tell apart.
          go test ./internal/server/ -run '^TestListEventsBySlug_' -count=1 -v 2>&1 | tee lock_events_slug.log
          for want in 'TestListEventsBySlug_ReturnsTheSameStreamAsByID' \
                      'TestListEventsBySlug_StillScopesToTheWorkItem'; do
            grep -q -- "--- PASS: $want (" lock_events_slug.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); GET /v1/events may again answer a slug with a silently empty stream"; exit 1; }
          done
          ! grep -q -- '--- SKIP' lock_events_slug.log \
            || { echo "::error::an aihub#343 slug test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

      # aihub#130: markdown→HTML rendering moved off the write path onto a
      # bounded background pool. The three tests below are the only evidence
      # that it actually did, and each one exists because the obvious assertion
      # does not work here.
      #
      # The obvious assertion is "save an artifact, then check rendered_html is
      # non-empty". It passes on the old synchronous code, on the new
      # asynchronous code, and on a build where the background pool has been
      # deleted outright — because the viewer LAZY-RENDERS whenever the column
      # is NULL (aihub#81/#146), so reading the value is what produces it. A
      # green suite would have meant nothing.
      #
      # So the three separate the producers instead of counting the output:
      #   _WritePathReturnsWithNothingRendered  holds a render OPEN and reads
      #       the row while no render can have finished. On the pre-#130 code
      #       Remember blocks inside goldmark and never returns.
      #   _BackgroundWorkerFillsRenderedHTML    same gate, then releases it and
      #       waits (bounded, fails on deadline) for NULL → real goldmark output.
      #       The NULL-first half is what attributes the value to the worker.
      #   _DroppedRenderLeavesNullForLazyFallback  disables the producer (error,
      #       then panic) and asserts the save still succeeds, the column stays
      #       NULL — the state the fallback serves from — and the drop is
      #       COUNTED, since "NULL" is also what a job that was never enqueued
      #       looks like. Its panic arm is a gate on runRenderJob's recover(),
      #       and on a stronger property than it first appears: an unrecovered
      #       panic in a goroutine terminates the PROCESS, so without that
      #       recover one malformed artifact takes the server down.
      #
      # The `^TestDeferredRender_` regex also picks up
      # _QueueFullShedsInsteadOfBlocking, which needs no database and therefore
      # already ran in "Unit tests". It is left in rather than excluded: it
      # covers the BOUND (at capacity the queue sheds instead of blocking the
      # writer, which would be the synchronous path by the back door), it costs
      # milliseconds, and a regex that has to enumerate exclusions rots.
      #
      # Named individually rather than by a prefix regex alone for the reason
      # every step in this job does it: `go test` prints ok and exits 0 when
      # every selected test SKIPs, and the DB ones SKIP whenever AIHUB_TEST_DB
      # is empty. The SKIP check below is the second half of that guard.
      - name: aihub#130 deferred markdown render DB tests
        env:
          AIHUB_TEST_DB: postgres://postgres:testpass@localhost:5432/aihub_test?sslmode=disable
        run: |
          set -o pipefail
          go test ./internal/domain/ -run '^TestDeferredRender_' -count=1 -v 2>&1 | tee deferred_render.log
          for want in 'TestDeferredRender_WritePathReturnsWithNothingRendered' \
                      'TestDeferredRender_BackgroundWorkerFillsRenderedHTML' \
                      'TestDeferredRender_DroppedRenderLeavesNullForLazyFallback' \
                      'TestDeferredRender_DroppedRenderLeavesNullForLazyFallback/render_error' \
                      'TestDeferredRender_DroppedRenderLeavesNullForLazyFallback/render_panic_does_not_take_the_worker_pool_down'; do
            grep -q -- "--- PASS: $want " deferred_render.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); nothing then distinguishes a save that skipped rendering from one that rendered synchronously — the lazy fallback satisfies every other assertion about rendered_html"; exit 1; }
          done
          ! grep -q -- '--- SKIP' deferred_render.log \
            || { echo "::error::an aihub#130 test SKIPped — AIHUB_TEST_DB is not reaching this step"; exit 1; }

          # The read half of the same argument, and the reason this work item had
          # to touch routes_artifacts.go at all. A dropped render is only
          # survivable because every read path re-derives the HTML from content
          # when rendered_html is NULL — and /share did not: it gated on
          # `rendered_html != nil` and answered 404 otherwise, with a
          # TODO(aihub#81) admitting it. Under deferred rendering that would have
          # made a dropped render a permanently unreachable artifact on that one
          # route, and "share the spec you just wrote" a race against the worker.
          #
          # No database: these drive the handlers through the loadMemoryFn /
          # setMemoryVisibilityFn seams, so they also run in the "Unit tests"
          # step. They are named here because they are half of one acceptance
          # argument with the DB tests above, and a reader who deletes that step
          # should see what else goes with it.
          #
          # The two _StillNotFound / _412Still arms are negative controls: they
          # are what separates "the gate was relaxed" from "the gate was deleted".
          go test ./internal/server/ -run '^TestSharedArtifact_|^TestShareArtifact_Publishes|^TestShareArtifact_412Still|^TestArtifactBody_UIv1Share|^TestUIArtifactHTML_(NothingToShare|UnrenderedButShareable)' -count=1 -v 2>&1 | tee deferred_render_share.log
          for want in 'TestSharedArtifact_LazyRenders_WhenDeferredRenderHasNotLanded' \
                      'TestSharedArtifact_StillNotFoundWithNothingToServe' \
                      'TestShareArtifact_PublishesArtifactWhoseRenderHasNotLanded' \
                      'TestShareArtifact_412StillReachableWithNothingToRender' \
                      'TestArtifactBody_UIv1ShareAgreeOnTheLazyRender' \
                      'TestUIArtifactHTML_NothingToShare_NoShareControl' \
                      'TestUIArtifactHTML_UnrenderedButShareable_HasShareControl'; do
            grep -q -- "--- PASS: $want " deferred_render_share.log \
              || { echo "::error::$want did not run (expected '--- PASS: $want'); /share may again 404 an artifact whose deferred render was dropped"; exit 1; }
          done
          # These need no database today, so nothing here can SKIP for want of
          # one. The guard is kept anyway, and dbtestcov requires it: the day
          # somebody gives one of them a DB-gated seed, its silent SKIP would
          # otherwise be indistinguishable from a pass.
          ! grep -q -- '--- SKIP' deferred_render_share.log \
            || { echo "::error::an aihub#130 /share test SKIPped; it is not actually executing"; exit 1; }

      - name: Launcher update-check regression suite
        run: bash plugins/polyforge/tests/launcher-update-check.test.sh

      # aihub#305: the launcher's default channel pointed at `bins-stable`, a
      # branch publish-bins.yml has never created. Every gate that existed
      # asserted on the resolved channel STRING — launcher-bash32 even encoded
      # `stable` as the expected answer — and launcher-update-check stubs curl,
      # so no URL is ever real there. Nothing anywhere asked whether the branch
      # the launcher downloads from exists, which is why a 404 default shipped
      # and then sat silently freezing machines on their old binaries.
      #
      # This suite closes that specific gap, so it is wired on purpose rather
      # than left advisory like launcher-bash32 (see the note further up):
      #   part 1 is hermetic and reads the URL out of the argv the launcher
      #          hands to curl, so changing the URL template turns it red;
      #   part 2 actually fetches those URLs. GH_TOKEN is needed because the
      #          repo is private and raw.githubusercontent.com answers 404 —
      #          not 401 — for an unauthenticated read, so without a working
      #          token "missing branch" and "bad token" are indistinguishable.
      #          The suite carries its own positive control for exactly that,
      #          and downgrades to a loud SKIP if the control does not pass.
      #
      # The assertions deliberately do not trust the exit code, and they name
      # the part-2 lines specifically: a suite that skipped its only networked
      # check also exits 0, and that is the state this gate exists to prevent.
      - name: aihub#305 launcher channel/url gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash plugins/polyforge/tests/launcher-channel-url.test.sh 2>&1 | tee channel_gate.log
          for want in "PASS: no-config -> channel 'dev'" \
                      "PASS: no-binary-section -> channel 'dev'" \
                      "PASS: channel-stable -> channel 'dev'" \
                      "PASS: channel-garbage -> channel 'dev'" \
                      "PASS: channel-stable -> binary url on bins-dev" \
                      "PASS: channel-stable -> warns and names the channel it used" \
                      "PASS: channel-dev -> silent, as a valid config must be" \
                      "PASS: negative control" \
                      "PASS: every url the launcher resolves is published and fetchable"; do
            grep -qF -- "$want" channel_gate.log \
              || { echo "::error::launcher channel/url gate never reported \"$want\" — that check did not run"; exit 1; }
          done
          ! grep -q '^SKIP:' channel_gate.log \
            || { echo "::error::the networked half of the launcher channel/url gate SKIPped — GH_TOKEN is not reaching raw.githubusercontent.com, so the one assertion that can tell a published channel from a 404 did not run"; exit 1; }
          ! grep -q '^FAIL:' channel_gate.log \
            || { echo "::error::launcher channel/url gate reported a FAIL"; exit 1; }
          n=$(grep -c '^PASS: ' channel_gate.log)
          [ "$n" -ge 22 ] \
            || { echo "::error::launcher channel/url gate reported only $n PASSes (floor 22) — checks have gone missing"; exit 1; }

      # aihub#305 second half. The channel fix above made the DEFAULT path
      # resolve to a branch that exists; it did nothing about what happens when
      # the download fails anyway, which is still the common case for anyone
      # without gh or not logged in (`download_binary` needs `gh auth token` for
      # private-repo raw access — an independent cause the channel fix cannot
      # touch). That path used to swallow its own diagnosis with
      # `download_binary 2>/dev/null`, symlink whatever `polyforge` was on PATH,
      # and start normally: a session where every tool works and the binary
      # behind them is older than the plugin's skills, with nothing saying so.
      #
      # This suite drives the REAL launcher end to end under stubs and then the
      # REAL SessionStart hook against the HOME it left behind, because the
      # defect was two components agreeing to say nothing to each other —
      # neither one's source proves anything on its own.
      #
      # Hermetic (no network, no docker, no token), unlike the gate above: gh
      # and curl are stubbed and POLYFORGE_SYSTEM_BIN_DIR is pinned so the
      # launcher cannot repoint the runner's /usr/local/bin.
      #
      # Sections 5-7 are mutation controls that reproduce main's pre-fix
      # behaviour and pass only when the arms above go dark. They each assert
      # the mutated file really differs first — a replacement that matches
      # nothing yields a green run that means nothing, which is why
      # "MUTATION DID NOT APPLY" is a FAIL and not a skip.
      - name: aihub#305 launcher failure-visibility gate
        run: |
          set -o pipefail
          bash plugins/polyforge/tests/launcher-visibility.test.sh 2>&1 | tee visibility_gate.log
          for want in "PASS: mutant/degraded -> launcher recorded ~/.polyforge/binary-status.txt" \
                      "PASS: mutant/degraded -> SessionStart puts the warning in front of the model" \
                      "PASS: mutant/degraded -> SessionStart systemMessage carries the launcher's full text" \
                      "PASS: mutant/degraded -> system bin dir not repointed" \
                      "PASS: mutant/no-fallback -> launcher exits non-zero instead of pretending to start" \
                      "PASS: reverse -> SessionStart says nothing, as a healthy machine must" \
                      "PASS: reverse -> the pre-seeded marker was DELETED by the successful download" \
                      "PASS: budget -> the warning costs" \
                      "PASS: gh-missing/download -> the reason survives to the log" \
                      "PASS: gh-unauth/update-check -> marker names the actual cause" \
                      "PASS: unreadable-channel -> marker names the actual cause" \
                      "PASS: nc/launcher-download -> mutation applied" \
                      "PASS: nc/launcher-download -> with the mechanism removed the arm goes dark" \
                      "PASS: nc/hook-banner -> mutation applied" \
                      "PASS: nc/hook-banner -> with the banner removed the model is told nothing" \
                      "PASS: nc/update-check -> mutation applied" \
                      "PASS: nc/update-check -> the gh-unauth arm goes dark" \
                      "PASS: degrade-path -> the forced-degrade fixture really took the degrade path" \
                      "PASS: degrade-path -> the stale-binary warning survives being rebuilt"; do
            grep -qF -- "$want" visibility_gate.log \
              || { echo "::error::launcher visibility gate never reported \"$want\" — that check did not run"; exit 1; }
          done
          ! grep -q '^SKIP:' visibility_gate.log \
            || { echo "::error::launcher visibility gate SKIPped — it has no skip path, so this means the suite was replaced or python3 vanished from the runner"; exit 1; }
          ! grep -q '^FAIL:' visibility_gate.log \
            || { echo "::error::launcher visibility gate reported a FAIL"; exit 1; }
          n=$(grep -c '^PASS: ' visibility_gate.log)
          [ "$n" -ge 50 ] \
            || { echo "::error::launcher visibility gate reported only $n PASSes (floor 50) — checks have gone missing"; exit 1; }

      # aihub#293: wire the two using-polyforge gates in. Until now ci.yml ran
      # exactly one suite out of plugins/polyforge/tests/ (the launcher one
      # above), so both of these were advisory — they only ran when a human
      # remembered to invoke them. That is the same shape as the aihub#254 gap
      # noted further up, applied to a bug that already shipped: aihub#285 found
      # that ~89% of the using-polyforge skill had reached no model at all since
      # 2026-08-05, silently, because the assembled SessionStart payload passed a
      # 10,000-character harness limit and was replaced by a ~2,000-character
      # preview. The hook still exited 0. Nothing was red.
      #
      # Both suites are hermetic — no docker, no network, no database. They shell
      # out to python3 (present on ubuntu-latest) and drive hooks/pf-session-start
      # against fixture trees under mktemp, so they are as safe to gate on as
      # launcher-update-check.
      #
      # The assertions below deliberately do NOT trust the exit code, for exactly
      # the reason the DB steps above give: a suite that ran zero checks also
      # exits 0. Both scripts additionally start with
      # `command -v python3 || { echo "SKIP: ..."; exit 0; }`, so anything that
      # removes python3 from the runner would turn them into a green no-op — the
      # zero-coverage state these steps exist to prevent. So each step asserts
      # that named checks reported PASS, that no SKIP escape hatch fired, and
      # that the PASS count did not fall below a floor.
      #
      # The floors are ratchets, not exact counts: raise them when you add
      # checks. A floor catches the case that matters (a suite that silently
      # stopped running checks) without going red on a legitimate addition.
      - name: aihub#293 using-polyforge payload budget gate
        run: |
          set -o pipefail
          bash plugins/polyforge/tests/using-polyforge-payload.test.sh 2>&1 | tee payload_gate.log
          for want in "PASS: payload " \
                      "PASS: the hook did not have to degrade this payload" \
                      "PASS: IR1 — inside preview window" \
                      "PASS: IR2 — inside preview window" \
                      "PASS: IR3 — inside preview window" \
                      "PASS: IR3 falls out of the window when iron-rules.md is moved last" \
                      "PASS: post-claim-routing.md not injected" \
                      "PASS: dispatch rule: " \
                      "PASS: emptying post-claim-dispatch.md removes all" \
                      "PASS: real tree" \
                      "PASS: degraded payload " \
                      "PASS: hook wrote the over-budget finding to stderr" \
                      "PASS: +300 chars ->" \
                      "PASS: condition met -> fragment IS assembled" \
                      "PASS: condition unmet -> fragment is NOT assembled" \
                      "PASS: state scan: bootstrap.md's '<workspace>/.polyforge/state' reaches the payload" \
                      "PASS: state scan: the " \
                      "PASS: control build (path reverted to " \
                      "PASS: control build no longer carries '<workspace>/.polyforge/state'" \
                      "PASS: state-scan control build is otherwise intact (IR1 still present)" \
                      "ALL PASS"; do
            grep -qF -- "$want" payload_gate.log \
              || { echo "::error::using-polyforge-payload.test.sh did not report '$want' — the payload budget gate is not actually executing"; exit 1; }
          done
          ! grep -q '^SKIP:' payload_gate.log \
            || { echo "::error::using-polyforge-payload.test.sh SKIPped (python3 missing on the runner?) — it exits 0 in that case, so this step would otherwise be a green no-op"; exit 1; }
          n=$(grep -c '^  PASS: ' payload_gate.log || true)
          [ "${n:-0}" -ge 49 ] \
            || { echo "::error::only $n PASS lines from using-polyforge-payload.test.sh, floor is 49 — checks have gone missing"; exit 1; }
          echo "using-polyforge payload gate: $n checks passed"

      - name: aihub#293 using-polyforge manifest gate
        run: |
          set -o pipefail
          bash plugins/polyforge/tests/using-polyforge-manifest.test.sh 2>&1 | tee manifest_gate.log
          for want in "PASS: no fragment declared twice" \
                      "PASS: every declared path exists on disk" \
                      "PASS: no undeclared fragment under fragments/" \
                      "PASS: every curated enforcement mechanism still exists on disk" \
                      "PASS: no new violation;" \
                      "PASS: old parser derives the same" \
                      "PASS: with the tier rule excised, the ungated-on-demand fixture no longer fails" \
                      "PASS: ...and the un-mutated script still fails it" \
                      "PASS: a baselined fragment absorbing" \
                      "PASS: ...the same fragment SHRINKING is accepted"; do
            grep -qF -- "$want" manifest_gate.log \
              || { echo "::error::using-polyforge-manifest.test.sh did not report '$want' — the manifest gate is not actually executing"; exit 1; }
          done
          ! grep -q '^SKIP:' manifest_gate.log \
            || { echo "::error::using-polyforge-manifest.test.sh SKIPped (python3 missing on the runner?) — it exits 0 in that case, so this step would otherwise be a green no-op"; exit 1; }
          # Two, not one: the suite prints ALL PASS after the lint of the real
          # tree AND again after the negative-control + mutation sections. One
          # occurrence means a whole half stopped running.
          a=$(grep -c '^ALL PASS$' manifest_gate.log || true)
          [ "${a:-0}" -ge 2 ] \
            || { echo "::error::using-polyforge-manifest.test.sh printed ALL PASS $a time(s), expected at least 2 (lint + controls) — a whole section did not run"; exit 1; }
          n=$(grep -c '^  PASS: ' manifest_gate.log || true)
          [ "${n:-0}" -ge 22 ] \
            || { echo "::error::only $n PASS lines from using-polyforge-manifest.test.sh, floor is 22 — checks have gone missing"; exit 1; }
          echo "using-polyforge manifest gate: $n checks passed"

      # aihub#272 closes half of the aihub#254 gap: pf-commit-guard.test.sh has
      # existed since the guard did and has never run in CI, so every assertion in
      # it was advisory — it turned red only when somebody remembered to invoke
      # it by hand. The guard is the only mechanism behind the <undercover> rule
      # and it is a PreToolUse hook, so `go test` cannot see it either. Wiring it
      # in costs one hermetic step: the suite shells out to python3 and git and
      # builds its fixtures under mktemp — no docker, no network, no database.
      #
      # The named checks below are the two-sided acceptance criterion of
      # aihub#272, one from each half. Asserting only the "still blocks" side
      # would stay green under a fix that just widened the allow-list, and
      # asserting only the "audit passes" side would stay green under a fix that
      # deleted the matcher. Neither half proves the change on its own, so both
      # are named here rather than left to the PASS-count floor.
      - name: aihub#272 commit-guard gate
        run: |
          set -o pipefail
          bash plugins/polyforge/tests/pf-commit-guard.test.sh 2>&1 | tee commit_guard.log
          for want in "PASS: blocks git commit -m carries a trailer" \
                      "PASS: blocks message assembled in a shell variable" \
                      "PASS: blocks heredoc message on stdin" \
                      "PASS: blocks git commit -F <file> with attribution" \
                      "PASS: blocks git commit -F <file> written by the same command" \
                      "PASS: allows audit: loop over commits and grep each" \
                      "PASS: allows audit: gh pr view body | grep" \
                      "PASS: allows audit: path segment .claude-plugin in a log command" \
                      "PASS: allows legal name: Siteboon AI B.V." \
                      "PASS: allows technical prose: AI gateway" \
                      "PASS: blocks bare AI in a trailer block" \
                      "PASS: blocks standalone AI" \
                      "ALL PASS"; do
            grep -qF -- "$want" commit_guard.log \
              || { echo "::error::pf-commit-guard.test.sh did not report '$want' — the commit-guard gate is not actually executing"; exit 1; }
          done
          # The suite short-circuits to exit 0 when python3 or the executable bit
          # is missing, so the exit code alone cannot tell "all checks passed"
          # from "no check ran".
          ! grep -q '^SKIP:' commit_guard.log \
            || { echo "::error::pf-commit-guard.test.sh SKIPped (python3 missing on the runner?) — it exits 0 in that case, so this step would otherwise be a green no-op"; exit 1; }
          n=$(grep -c '^  PASS: ' commit_guard.log || true)
          [ "${n:-0}" -ge 90 ] \
            || { echo "::error::only $n PASS lines from pf-commit-guard.test.sh, floor is 90 — checks have gone missing"; exit 1; }
          echo "commit-guard gate: $n checks passed"

  publish-schemas:
    name: Publish MCP Schemas
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize force-pushes to the orphan branch — concurrent main pushes would
    # race last-writer-wins on pf-schemas.
    concurrency:
      group: publish-schemas
      cancel-in-progress: false
    permissions:
      contents: write   # needed for force-pushing orphan branch pf-schemas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Export MCP tool schemas
        run: |
          SHA=$(git rev-parse HEAD)
          go build -o /tmp/polyforge ./cmd/polyforge/
          /tmp/polyforge dump-mcp-schemas "${SHA}" > /tmp/pf-tool-schemas.json
          echo "Generated schemas for commit ${SHA}"
          python3 -c "import json,sys; json.load(open('/tmp/pf-tool-schemas.json')); print('JSON valid')"

      - name: Publish to pf-schemas orphan branch
        run: |
          git config user.email "ci@gmi.com"
          git config user.name "CI"
          COMMIT_SHA=$(git rev-parse HEAD)
          git checkout --orphan pf-schemas
          git rm -rf .
          cp /tmp/pf-tool-schemas.json pf-tool-schemas.json
          git add pf-tool-schemas.json
          git commit -m "schemas: ${COMMIT_SHA}"
          git push --force origin HEAD:refs/heads/pf-schemas

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  build-push:
    name: Build & Push Docker image (main)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-west1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCR_SERVICE_ACCOUNT_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gmiswe/aihub:latest
            ghcr.io/gmiswe/aihub:${{ github.sha }}
            us-west1-docker.pkg.dev/devv-404803/public/aihub:latest
            us-west1-docker.pkg.dev/devv-404803/public/aihub:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-release:
    name: Build & Push Docker image (release)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gmiswe/aihub
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Build & Push binary (release)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - name: Build polyforge binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG="${{ github.ref_name }}"
          # Full 40-char SHA, NOT --short. polyforge-mcp.sh's update check reads
          # the running binary's commit with `grep -oE '[a-f0-9]{40}'`; a 7-char
          # SHA never matches, so a binary installed from a GitHub Release would
          # be classified "cannot read version" and told it is "likely a local
          # build". Same reason publish-bins.yml and the Makefile use the full
          # SHA (aihub#237).
          SHA=$(git rev-parse HEAD)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 go build \
            -ldflags "-s -w -X github.com/GMISWE/ieops-aihub/internal/version.Version=${TAG} -X github.com/GMISWE/ieops-aihub/internal/version.GitCommit=${SHA} -X github.com/GMISWE/ieops-aihub/internal/version.BuildTime=${NOW}" \
            -o "polyforge-${GOOS}-${GOARCH}" \
            ./cmd/polyforge/
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: polyforge-${{ matrix.goos }}-${{ matrix.goarch }}
