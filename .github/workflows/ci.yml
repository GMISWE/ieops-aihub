                      TestDeLockingPredictReportsAdvisoryEntries/a_work_item_that_names_itself_is_not_its_own_conflict/an_anonymous_create_preview_still_reports_both \
                      TestDeLockingPredictReportsAdvisoryEntries/a_work_item_that_names_itself_is_not_its_own_conflict/another_work_item_declaring_the_same_name_is_still_reported \
                      TestDeLockingPredictReportsAdvisoryEntries/a_work_item_that_names_itself_is_not_its_own_conflict/naming_itself_by_slug_works_too \
                      TestDeLockingPredictReportsAdvisoryEntries/a_work_item_that_names_itself_is_not_its_own_conflict/the_exclusion_holds_under_dry_run \
                      TestDeLockingPredictReportsAdvisoryEntries/declared_names_that_look_like_json_still_match_every_containment_rule/plain \
                      TestDeLockingPredictReportsAdvisoryEntries/declared_names_that_look_like_json_still_match_every_containment_rule/doublequote \
